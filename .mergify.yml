# Mergify's merge queue: how a PR reaches `main` (ADR-021, ADR-023,
# docs/process.md § CI and merging). The operator comments `@mergifyio
# queue` on a reviewed PR, which also carries the `queue` label; once Merge
# Protections is active for the repository, the label alone queues it
# (`merge_protections_settings`, at the end).
#
# Two steps (ADR-023). A PR's own run of `CI` is the fast lane: Lint, Web,
# the Rust tests and their coverage, and the browser specs the change
# reaches (ci.yml's `changes` job says which). Green, with the PR's own
# `PR checks` green too, the PR enters the queue. The queue tests up to
# three queued PRs together (a release PR alone) on a draft PR of its own,
# from a branch under mergify/merge-queue/, on top of `main`; CI sees that
# prefix and runs the full gate there, the whole browser tier included.
# Green, the queue squash-merges each PR, one commit each. Red, it splits
# the batch and tests the parts: a part that passes merges, and a PR that
# fails on its own leaves the queue with the `dequeued` label and a comment
# saying why. Nothing is retried.
#
# Mergify reads this file from `main` only: a change here acts once merged.
# The keys are the current ones (docs.mergify.com, October 2026) and validate
# against docs.mergify.com/mergify-configuration-schema.json; Mergify also
# checks the file on every push that changes it.

# What both queues share (each queue rule below takes these unless it says
# otherwise).
defaults:
  queue_rule:
    # Merged: the full gate is green on the draft PR. Merge conditions on
    # checks are read from the draft PR, not from the PRs in it. `Full gate`
    # is a job only a queue run has (ci.yml). It has to be a check of its
    # own: Mergify counts a queue whose merge conditions are the same as its
    # queue conditions as one step, and then merges a PR that is already on
    # `main`'s tip at once, on its own run, with no draft PR ("direct
    # merge"). The fast lane would be the gate again.
    merge_conditions:
      - check-success = @github-actions/Full gate
    # A draft PR's checks that haven't answered in 45 minutes take its PRs
    # out of the queue, so a hung run can't hold the queue. The full gate
    # takes about twelve, and every job in it has a limit of its own; the
    # default (`auto`) sets no limit until the queue has some history.
    checks_timeout: 45 minutes
    # No automatic CI retries: a red check is read, then fixed or quarantined
    # (docs/process.md § Flakes). 0 is the default, written so it stays.
    max_checks_retries: 0
    # The draft PRs' branches: CI tells a queue run from a PR's run by this
    # prefix (ci.yml's `changes` job), so the two must agree. It is Mergify's
    # default, written here so a change to it is a change to both files.
    queue_branch_prefix: mergify/merge-queue/
    # No `update_method`: it applies only to checks run on the PR itself. The
    # queue tests a draft PR and never pushes to a PR's branch.
    #
    # `main` allows squash merges only. Each PR of a batch is merged on its
    # own, so `main` gets one commit per PR, and its last one is the tree the
    # draft PR tested.
    merge_method: squash
    # The squash commit: "<PR title> (#<number>)", then what the repository
    # already puts there (its squash setting: the PR's commit messages, each
    # saying why). `pr-body` would change `main`'s history to PR bodies, and
    # carry Dependabot's release notes into it.
    commit_message_format:
      title: pr-title
      body: inherit

# Into a queue: the PR's own `CI` (the fast lane) is green. That is also the
# check `main`'s ruleset requires on the PR's head commit, which GitHub reads
# when the queue squash-merges the PR, so the ruleset is met by the fast
# lane. With `branch_protection_injection_mode` at its default (`queue`),
# Mergify requires the ruleset's `CI` before queueing too, and again on the
# draft PR before merging. A PR goes into the first queue whose conditions
# it meets, and a batch holds PRs of one queue only.
#
# And `PR checks` is green (pr-checks.yml): the title is a conventional
# subject, and the body names its issues the way GitHub reads them, so no PR
# merges under an untyped subject or leaves an issue it finishes open. Only
# the PR's own: the merge conditions read the draft PR, where it doesn't run.
# A PR opened before the workflow was on main has no run of it until its
# title, body or commits change, so the PRs open when it landed are let in
# without one: the `number <=` line in both rules below, the highest PR
# number open when the change that brought the workflow was pushed (raised
# to it just before the push). Any PR opened later has a number above it.
# One opened after that push and before the workflow landed gets its run
# from any edit: `gh pr edit <n> --body-file <its body, links put right>`,
# or a push. Once every PR at or under the line has merged or closed, the
# `or` and its line can go from both rules.
queue_rules:
  # A release PR (the version bump and the changelog's new section, labelled
  # `release`: CONTRIBUTING.md § Cutting a release) is tested and merged
  # alone, so its merge commit's tree is exactly the tree the full gate
  # tested, and the tag goes on that commit. In a batch, a release merged
  # first would land on a tree no run tested, its own run on main skipped.
  - name: release
    queue_conditions:
      - check-success = @github-actions/CI
      - or:
          - check-success = @github-actions/PR checks
          - number <= 232
      - label = release
    batch_size: 1

  - name: default
    queue_conditions:
      - check-success = @github-actions/CI
      - or:
          - check-success = @github-actions/PR checks
          - number <= 232
      - label != release
    # Up to three PRs in one draft PR, so one full gate for the lot: the two
    # streams of work docs/process.md allows in flight, and a Dependabot PR.
    batch_size: 3
    # How long a batch that isn't full waits for another PR to join it,
    # counted from the first PR's entry into the queue; then it is tested as
    # it is. The default is 30 seconds. Three minutes lets a PR pushed just
    # after another join it, and a lone PR waits no longer than that.
    batch_max_wait_time: 3 minutes

merge_queue:
  # One batch at a time, on top of `main`: a second draft PR tested beside
  # the first would take a second full gate's runners, and the account runs
  # at most 20 jobs at once (#177). With one check at a time, a red batch is
  # split in two, and the first part is tested first.
  mode: serial
  max_parallel_checks: 1
  # A PR that leaves the queue without merging gets `dequeued`: the state the
  # operator waits on, beside a merge (the `ship` skill), since a conflict
  # takes a PR out with no red run to see. No `queued` label: one letter from
  # our `queue`, it would be a trap, and the PR's "Mergify Merge Queue" check
  # says where a queued PR stands.
  queued_label: null
  dequeued_label: dequeued

# Ahead of the rest of the queue, into the next batch; neither stops the
# batch being tested (`allow_checks_interruption` stays false). A release
# goes first, so it isn't left waiting behind batches. Then a PR that fixes
# CI or a flaky test: the operator adds the `priority` label. A label rather
# than the title's type: a `ci:` or `tests:` title says what a PR changes,
# not that the queue waits on it.
priority_rules:
  - name: A release goes first
    conditions:
      - label = release
    priority: high
  - name: A fix to CI or a flaky test goes first
    conditions:
      - label = priority
    priority: high

# The `queue` label puts a PR to `main` in the queue; it enters once its
# queue conditions hold (its fast lane and its `PR checks` are green).
# Mergify's auto-merge conditions are the way its docs give for queueing on
# a label: with the merge queue on, a PR that matches them is queued. They take effect only
# while Merge Protections is active for the repository in Mergify's
# dashboard, which is the maintainer's to switch on; until then the label
# does nothing, and `@mergifyio queue` is how a PR is queued. A
# `pull_request_rules` rule with the `queue` action did not queue on the
# label here (#190), so there is none. `@mergifyio queue` also puts back a
# PR that left the queue.
merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - label = queue

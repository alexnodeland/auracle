[package]
name = "auracle-features"
description = "Standard-phrase headless rendering, loudness normalization, vetting gate, and audio + structural feature extraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quiver-dsp.workspace = true
auracle-grammar.workspace = true
rustfft = "6"
# The reference audition clip is synthesized with libm's sine and exp (pure
# Rust), so the native build and the wasm build compute the same samples.
libm = "0.2"
serde.workspace = true
# Cache keys are hashed over canonical JSON of the term + spec; `float_roundtrip`
# (set workspace-wide) is what makes that encoding exact and stable.
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The render benchmark (`examples/bench_render.rs`) times this thread's CPU
# (`clock_gettime(CLOCK_THREAD_CPUTIME_ID)`) and reads the load average.
# Already in the tree through quiver's and rand's dependencies.
libc = "0.2"
fugue-ppl.workspace = true
fugue-evo.workspace = true
rand.workspace = true

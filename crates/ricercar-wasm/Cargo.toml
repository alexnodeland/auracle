[package]
name = "ricercar-wasm"
description = "wasm-bindgen surface over ricercar-session for the web app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ricercar-session = { path = "../ricercar-session", version = "0.1.0" }
ricercar-features = { path = "../ricercar-features", version = "0.1.0" }
ricercar-taste = { path = "../ricercar-taste", version = "0.1.0" }
ricercar-grammar = { path = "../ricercar-grammar", version = "0.1.0" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# wasm32-unknown-unknown entropy shim (rand → getrandom); we always seed
# explicitly, but the js feature is required for the crate to compile at all.
getrandom = { version = "0.2", features = ["js"] }

# Post-link optimization. The explicit --enable-* set matches what rustc's
# wasm32-unknown-unknown output already uses, so wasm-opt neither adds nor
# forbids features — it only optimizes. Never add --fast-math: it licenses
# value-changing float rewrites, and (term, spec) → bit-identical samples is
# a contract (see ricercar-features/src/render.rs).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-reference-types",
    "--enable-multivalue",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
]

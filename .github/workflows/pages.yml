name: Pages

# Publishes the whole site to GitHub Pages — four sections under one origin:
#
#   /                 the landing page
#   /play/            the instrument
#   /docs/            the product guide      (mdBook)
#   /reference/       the technical reference (mdBook + KaTeX)
#   /reference/api/   rustdoc for every crate
#
# Every asset path is relative, so the site runs unchanged at the root of its
# custom domain (auracle.alexnodeland.com, set in Settings → Pages) or under a
# project subpath (…github.io/auracle/), with no base-href rewriting. `make
# site-check` enforces that: a root-absolute reference is an error, because it
# breaks under any subpath.

# One trigger: `main`. The live site tracks the tip of the repo, which is what
# the README promises.
#
# This used to fire on `v*` tags as well, on the reasoning that a release should
# publish the exact build its zip was made from. It could never work: the
# `github-pages` environment permits deployments from the `main` branch only, so
# every tag build ran for two minutes and was then rejected at the deploy step
# with "not allowed to deploy to github-pages due to environment protection
# rules" — one guaranteed red run per release.
#
# It was also answering a question that does not arise. A tag is cut from a green
# `main` (CONTRIBUTING.md § Cutting a release), so by the time it exists that
# commit has already deployed from the branch. And the two claims cannot both
# hold anyway: a site that always tracks `main` is not a site pinned to the last
# tag. The site tracks `main`; the zip is pinned to the tag; the documented
# process is what makes them the same build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer main supersedes an in-flight one, but never
# cancels a run that is already mid-deploy. Still worth keeping with a single
# trigger: two pushes to main in quick succession would otherwise race.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned, and pinned together. mdBook 0.5.x changed the preprocessor wire
  # format and both preprocessors fail against it, so 0.4 is the current stack
  # rather than a stale one. The KaTeX stylesheet vendored at
  # www/theme/fonts/katex.min.css is the pair to mdbook-katex 0.9.4 — bump them
  # together or neither. Keep in sync with the Makefile.
  MDBOOK_VERSION: 0.4.52
  MDBOOK_KATEX_VERSION: 0.9.4
  MDBOOK_ADMONISH_VERSION: 1.20.0

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A prebuilt binary from the tool cache, the same way ci.yml gets it. This
      # used to curl-pipe upstream's installer, unpinned, which ran a third-party
      # script and took whatever version it served that day — and was the one
      # place in three workflows that did.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-pack

      # mdbook and mdbook-admonish ship prebuilt binaries; mdbook-katex does not
      # publish any, so it has to be compiled — which is why the cache is keyed on
      # all three versions and lands in a dedicated bin dir rather than
      # ~/.cargo/bin (where it would fight rustup's shims).
      - name: Cache the doc toolchain
        id: doc-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/bin
          key: doc-tools-${{ runner.os }}-mdbook${{ env.MDBOOK_VERSION }}-katex${{ env.MDBOOK_KATEX_VERSION }}-admonish${{ env.MDBOOK_ADMONISH_VERSION }}

      - name: Install the doc toolchain
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          if ! command -v mdbook >/dev/null; then
            curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          if ! command -v mdbook-admonish >/dev/null; then
            curl -sSfL "https://github.com/tommilligan/mdbook-admonish/releases/download/v${MDBOOK_ADMONISH_VERSION}/mdbook-admonish-v${MDBOOK_ADMONISH_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          # No prebuilt binaries are published for this one, at any version.
          if ! command -v mdbook-katex >/dev/null; then
            cargo install mdbook-katex --version "$MDBOOK_KATEX_VERSION" --locked --root ~/.local
          fi
          mdbook --version && mdbook-katex --version && mdbook-admonish --version

      # Through the Makefile, so every build path shares one definition of what
      # the site is — and so the wasm stack size lives in exactly one place.
      # Building wasm-pack directly here would ship a 1 MB stack, which the patch
      # compiler overflows on a dozen-module patch, and it does so as "memory
      # access out of bounds" nowhere near the flag that caused it.
      - name: Build the site
        run: make site

      # A root-absolute link, a dead cross-section anchor or a reintroduced CDN
      # request all pass every other check in this repo and only break in
      # production. This is the gate for them.
      - name: Check every link and asset resolves
        run: make site-check

      # `enablement` is a no-op here (Pages is already set to the Actions
      # source) but makes the workflow self-bootstrapping in a fresh fork.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

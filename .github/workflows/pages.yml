name: Pages

# Publishes the web instrument to GitHub Pages. The app is fully static and
# every asset path in apps/web is relative, so it runs unchanged from the
# project subpath (…github.io/auracle/) — no base-href rewriting needed.

# Two triggers, one site. `main` keeps the live build honest to the tip of the
# repo, which is what the README promises. A `v*` tag deploys as well, so
# cutting a release publishes the *exact* build that the zip was made from
# rather than whatever landed on main in the meantime — the `pages` concurrency
# group below serializes the two, so a tag and a main push can never interleave.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer main supersedes an in-flight one, but never
# cancels a run that is already mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Through the Makefile, so the wasm stack size lives in exactly one
      # place. Building wasm-pack directly here would ship a 1 MB stack, which
      # the patch compiler overflows on a dozen-module patch — and it does so
      # as "memory access out of bounds", nowhere near the flag that caused it.
      - name: Build wasm engine
        run: make wasm

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/web/. site/
          # serve.py is for local development; Pages is the server here.
          rm -f site/serve.py
          # Ship the wasm/glue as-is: Pages must not run the artifact through
          # Jekyll, which would drop the underscore-prefixed wasm-bindgen files.
          touch site/.nojekyll

      # `enablement` is a no-op here (Pages is already set to the Actions
      # source) but makes the workflow self-bootstrapping in a fresh fork.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

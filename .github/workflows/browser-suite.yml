name: Browser suite

# Every Playwright spec in tests/web, against the wasm built from this commit.
#
# CI's site job runs two of them (`make smoke`) on every PR that can affect the
# site, because they are fast and they catch the boot failures nothing else
# can. The rest pin behaviour a player sees: the bank, EVOLVE's feedback,
# PATCH editing, PERFORM's controls and offers, the engine answering the player
# first, booth mode, the film chip (docs/architecture/testing.md lists what
# each pins). Together they take about twenty minutes in one job, so they run
# here, split across five runners, rather than in the required `CI` check:
#
# - on a PR that touches the app, its tests or the engine, as a report that
#   does not block merging (make it a required check in the ruleset once it
#   has been green for a while);
# - nightly on main, so a regression that slipped past is found within a day;
# - on demand (Actions → Browser suite → Run workflow).
#
# Several specs assert on timing (a toast within 1.5 s, a ▶ answered while the
# engine works). A failure that only appears here is still a finding about the
# app on a slower machine, not a flake to retry away.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/web/**"
      - "crates/**"
      - "Cargo.lock"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: browser-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Five runners, each a fifth of the tests (split by test, not by file:
    # `fullyParallel` in playwright.config.js), so no runner draws all the
    # slow PERFORM specs.
    name: Every browser spec (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The nightly run on main saves the engine's build; every PR run starts
      # from it instead of compiling the crates from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && strategy.job-index == 0 }}

      - uses: taiki-e/install-action@wasm-pack

      - name: Build the engine for the browser
        run: make wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: Install Playwright's Chromium
        run: cd tests/web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      # Its own port, so the run can never be served by anything else.
      - name: Run every spec
        env:
          AURACLE_TEST_PORT: "8690"
        run: cd tests/web && npx playwright test --shard=${{ matrix.shard }} --reporter=list

      - name: Keep the traces of failed specs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-results-${{ github.sha }}-${{ strategy.job-index }}
          path: tests/web/test-results/
          if-no-files-found: ignore

name: CI health

# CI's own health over the last 7 days (scripts/ci_stats.py, #177 § 7.1): how
# long a PR waits for `CI` in each lane, how long its jobs wait for runners,
# how long it then spends in the merge queue, how often a run goes red and on
# which job, how long main stayed red, and how the browser shards spread, in
# the run's summary, each headline against the week before #177's wave 0
# (docs/notes/ci-baseline-2026-10-05.json). The budgets those numbers are read
# against are in docs/architecture/testing.md § Budgets.
#
# Its own workflow, nightly after the Flake hunt, so its numbers include
# that night's run (a run still going is left to the next night's), and a
# stop at the API's rate limit is a red run here (the script exits 3 having
# written what it read), not a red hunt. It holds one runner for a few
# minutes. Both schedules slip: over the ten nights to 2026-10-31 the hunt
# (cron 05:41 UTC) started 4 to 6 hours late, and CI health about as late
# (cron 07:13 then, starting 13:13 to 14:21), twice before that night's hunt
# had finished. This cron is 5.5 hours after the hunt's: three hours for
# the hunt, and two more for the two slips to differ by. Since #582 the
# hunt holds three runners at most, its stages one after another, and
# takes about two and a half hours with its speed budgets (flake-hunt.yml's
# header), longer on a night a stage waits for runners, so its three hours
# still hold it.

on:
  schedule:
    - cron: "13 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  # Read-only: GETs from the Actions and pull request APIs, the PRs'
  # comments included (an issues endpoint, so `issues: read`).
  stats:
    name: CI health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The answers that can no longer change (finished runs' jobs, closed
      # PRs' files and comments), kept from one night to the next: read cold,
      # a week is about 700 requests of the token's 1,000 an hour. Restored
      # and saved apart, the save on `always()`, so a night that stops at the
      # rate limit still keeps what it read, and the next goes on from there.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci_stats
          key: ci-stats-${{ github.run_id }}
          restore-keys: ci-stats-
      - name: The last 7 days, against the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci_stats.py
          --since "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          --compare docs/notes/ci-baseline-2026-10-05.json
          >> "$GITHUB_STEP_SUMMARY"
      # A run three weeks old is in no window: 7 days, and 14 more for a
      # merged PR's first runs.
      - name: Forget what no window reads
        if: always()
        run: mkdir -p .cache/ci_stats && find .cache/ci_stats -type f -mtime +21 -delete
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .cache/ci_stats
          key: ci-stats-${{ github.run_id }}

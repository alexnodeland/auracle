# Does the search still search, and does the model still learn?
#
# Deliberately NOT on pull_request. These are statistical properties of a loop
# measured over seeds, and they cost minutes of real audio rendering — the
# grammar renders sample-by-sample, and a climb run is 16 seeds x 6 generations
# of genuine MH walks. Blocking every PR on that would spend most of its budget
# on the brand and documentation changes that make up most of them.
#
# The always-on floors live in `make check` and CI's slow tier instead
# (`refinement_improves_pool`, `closed_loop_learns_synthetic_taste`; see
# slow-suite.yml). They catch a loop that stopped working. This catches one
# that quietly got worse.
#
# Two ways in:
#
#   workflow_dispatch — what you run by hand on both sides of a change that
#     touches φ, the grammar prior, the audition stimulus, the surrogate or the
#     MH kernel. That is the standing rule, and `make revalidate` is the local
#     equivalent. Pick the ref, read the summary, diff it against main's.
#
#   schedule — so a regression that slipped through is found within a day
#     rather than at the next time somebody happens to look. A night when
#     main's head is the commit the newest run on main that tested anything
#     tested green runs nothing (the `scope` job, scripts/ci_skip.py, #582),
#     a night's run: the measurements are seeded, so the same commit gives
#     the same tables, and that run's summary has them. A run by hand is
#     looked past, since it measures the seeds it was asked for and the API
#     does not say which. Over Oct 18 to 29, when
#     main did not move, that was all 12 nights, about 125 runner-minutes
#     each, at the hours the merge queue runs (GitHub starts the cron 4.5
#     to 7 hours late: from 08:51 to 11:17 UTC over Oct 18 to Nov 1). The
#     skip and the run whose answer stands are said in the run's summary.
#     A run by hand always runs, and anything that keeps the job from
#     deciding is a run, never a skip and never red.
name: Search health

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds for the climb measurement (paired, so more is tighter)"
        required: false
        default: "16"
  schedule:
    # 04:20 UTC daily — off the hour, because the top of the hour is when every
    # other cron on the runner fleet fires.
    - cron: "20 4 * * *"

# It reads the code and writes nothing back.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Is this run asked for? A run by hand always is. A scheduled one is
  # unless main's head is the commit the newest run on main that tested
  # anything tested green, a night's or one by hand (scripts/ci_skip.py
  # says how it reads that). When `run` is false the three jobs below are
  # skipped, and the run holds this one runner for a few seconds. Anything
  # that keeps it from deciding is a run, never a skip and never red, so
  # the job's limit is above its steps':
  # the checkout's 2 minutes and the script's 150 s, with room for the
  # job's setup. A job cut at its own limit would leave `run` unset and
  # the run red with nothing measured.
  scope:
    name: Asked for
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.why.outputs.run }}
    steps:
      # The script and the classifier it imports; a checkout that fails
      # leaves no script, which is a run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 2
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Say why
        id: why
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$EVENT" = schedule ] &&
            decision=$(timeout 150 python3 scripts/ci_skip.py nightly --workflow search-health.yml) &&
            [ "$decision" = run=false ]; then
            run=false
          else
            echo "$EVENT: running everything"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Three jobs, not one: they share nothing but the checkout, so run side by
  # side each gets its own runner and its own clock. As a single 90-minute job
  # the scheduled run was cancelled every day — the 16-seed climb alone is
  # longer than that on a hosted runner — and a cancelled run reports nothing,
  # which is worse than a slow one.
  stats:
    name: φ statistics and peaks
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Everything below writes to the job summary as well as the log, because
      # the point of this workflow is a table somebody reads and compares — a
      # number buried in 2000 lines of cargo output is not that.
      - name: Feature composition, prevalence and VIF
        run: |
          set -euo pipefail
          make phi-stats 2>&1 | tee /tmp/phi.log
          { echo "## φ statistics"; echo '```'; cat /tmp/phi.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Normalized peak distribution
        run: |
          set -euo pipefail
          make norm-peak 2>&1 | tee /tmp/peak.log
          { echo "## Normalized peaks"; echo '```'; cat /tmp/peak.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Kept as an artifact so two runs can be diffed directly rather than by
      # scrolling two summaries side by side.
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-health-stats-${{ github.sha }}
          path: /tmp/*.log
          if-no-files-found: warn

  climb:
    name: Pool climb
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Measured: over 90 minutes for 16 paired seeds on a hosted runner. The
    # cap is still a cap — enough for the measurement with margin, not the
    # default six hours a stuck run would otherwise hold a runner for.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Pool climb
        run: |
          set -euo pipefail
          make climb SEEDS="${{ github.event.inputs.seeds || '16' }}" 2>&1 | tee /tmp/climb.log
          { echo "## Pool climb"; echo '```'; cat /tmp/climb.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-health-climb-${{ github.sha }}
          path: /tmp/*.log
          if-no-files-found: warn

  battery:
    name: Search-health battery
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Full search-health battery
        run: |
          set -euo pipefail
          make search-check 2>&1 | tee /tmp/search.log
          { echo "## Search health"; echo '```'; cat /tmp/search.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-health-battery-${{ github.sha }}
          path: /tmp/*.log
          if-no-files-found: warn

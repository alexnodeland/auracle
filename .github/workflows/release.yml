name: Release

# A release is published from its tag, `vX.Y.Z`, on the release PR's merge
# commit. The Prepare release workflow (prepare-release.yml) makes the tag
# when the release PR merges, and starts this workflow on it: a tag made with
# a workflow's own token starts no workflow (GitHub's rule), and
# `workflow_dispatch` is the exception. A tag pushed by hand starts it too.
# The release PR carries the `release` label, so the merge queue tests it
# alone and merges it alone (.mergify.yml): the tagged commit's tree is
# exactly the tree the queue's full gate tested, and nothing here tests it
# again. This workflow packages the prebuilt web instrument and publishes the
# GitHub Release. The live site is NOT deployed from here: ci.yml's deploy job
# publishes it from green runs on `main` only (the github-pages environment
# rejects deployments from a tag), and the tagged commit is on `main`. See
# CONTRIBUTING.md § Cutting a release.

on:
  push:
    tags:
      - "v[0-9]+.*"
  # On a tag only: run on a branch, the first check below refuses it.
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish release bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
      pull-requests: read # the authors of the PRs its notes list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag before this one, and the titles merged between the two.
          fetch-depth: 0
          fetch-tags: true

      # Fail before spending six minutes on a build nobody can use. A tag whose
      # number disagrees with the workspace's is the classic release bug: the
      # asset says v0.3.0, every crate inside it says 0.2.0, and nothing
      # downstream can tell which is true. So the workspace is at the tag's
      # version everywhere it is written (Cargo.toml, the crates' path
      # dependencies, Cargo.lock), CHANGELOG.md has its section, and
      # changelog.d/ is empty: `scripts/changelog.py --release` moved every
      # entry into that section, and one still there is a change this tag
      # ships that its notes don't mention. The Prepare release workflow ran
      # the same check before it tagged (scripts/release.py verify).
      - name: Check the tag against the workspace version and the changelog
        run: python3 scripts/release.py verify "$GITHUB_REF_NAME"

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A prebuilt binary from the tool cache, the same way ci.yml gets it —
      # not an unpinned `curl | sh` of upstream's installer.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-pack

      # Through the Makefile, so the wasm stack size lives in exactly one
      # place. Building wasm-pack directly here would ship a 1 MB stack, which
      # the patch compiler overflows on a dozen-module patch — and it does so
      # as "memory access out of bounds", nowhere near the flag that caused it.
      - name: Build wasm engine
        run: make wasm

      - name: Assemble web bundle
        run: |
          BUNDLE="auracle-${GITHUB_REF_NAME}-web"
          mkdir -p "dist/$BUNDLE"
          cp -r apps/web/. "dist/$BUNDLE/"
          cat > "dist/$BUNDLE/RUNNING.md" <<'EOF'
          # Running Auracle

          This is the prebuilt web instrument — no toolchain needed, just a
          static file server (module workers require http, not file://):

              python3 serve.py        # → http://localhost:8642

          or any equivalent (`npx serve`, `php -S`, …). Then open the URL,
          wait for the pool to warm up, and play. Press `?` in the app for
          the key map. Your bank and taste model autosave in the browser.
          EOF
          (cd dist && zip -qr "$BUNDLE.zip" "$BUNDLE")

      # The changelog is the release notes. It is written by hand, per pass, in
      # the project's own voice (ADR-013). The section is extracted by its
      # heading, and under it goes every PR merged since the last release,
      # grouped by its title's type, each with its author (the next step), in
      # place of `--generate-notes`' flat list of the same titles.
      - name: Extract the changelog section for this tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VER" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          # The guard above proved the heading exists; this catches a section
          # that exists but is empty.
          if [ ! -s release-notes.md ]; then
            echo "::error::the '## [$TAG_VER]' section in CHANGELOG.md is empty"
            exit 1
          fi

      - name: Under it, every PR merged since the last release, by type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo; python3 scripts/release.py notes "$GITHUB_REF_NAME"; } >> release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/auracle-${GITHUB_REF_NAME}-web.zip" \
            --verify-tag \
            --title "Auracle $GITHUB_REF_NAME" \
            --notes-file release-notes.md

name: Slow suite

# The SLOW tier: the tests too slow to gate every PR on. CI (ci.yml) is the
# fast tier and the only required check; a PR may merge on it alone. Each test
# runs in exactly one tier (docs/architecture/testing.md § CI tiers):
#
# - Rust: the search floor (`refinement_improves_pool`, ~330 s on a runner)
#   and the ten other tests over a minute (~1030 s of test time between them),
#   named in the Makefile as SEARCH_FLOOR and SLOW_TESTS. The fast tier runs
#   every test NOT named there.
# - Browser: the specs tagged `@slow` (~35 min of test time in one worker:
#   EVOLVE POOL generations, and PERFORM's listening, offers and drift), and
#   any tagged `@quarantine`, a flaky test moved out of the gate until it is
#   fixed. The fast tier runs `--grep-invert "@slow|@quarantine"`.
#
# The nightly flake hunt is its own workflow (flake-hunt.yml), so its half
# hour never holds this one's queue on main.
#
# When it runs:
#
# - on a PR, only when the diff touches what these tests cover (the `scope`
#   job below says exactly which paths and why), or when the PR carries the
#   `full-ci` label (adding the label starts a run). It reports; it does not
#   block merging.
# - on every push to main and nightly, always and in full. A failure there
#   opens an issue titled "Slow suite failing on main", or comments on it if
#   one is already open, so a regression that merged on the fast tier is found
#   within one push or one night.
# - on demand (Actions → Slow suite → Run workflow), in full.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes its in-flight run obsolete. On main nothing is
# cancelled: every push there gets its own verdict. Adding an unrelated label
# to a PR starts a run too (GitHub cannot filter `labeled` by name); it gets a
# group of its own, so it does nothing rather than cancel a real run.
concurrency:
  group: slow-suite-${{ github.head_ref || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  # Does this run cover anything?
  #
  # Rust: any crate. Every slow Rust test walks the whole pipeline (the
  # grammar's edit ops propose, features render and measure, the taste model
  # scores, the session walks and absorbs), so no crate is outside what they
  # cover. Plus the manifests, the Makefile (it names the slow set) and this
  # workflow and its actions.
  #
  # Browser: the parts of the app the @slow specs exercise and nothing else
  # does as hard: the engine worker and the render farm (worker.js, farm.js:
  # generations, walks, their ordering), PERFORM (perform.js) and the worklet it
  # plays offers through (live-audio.js), PATCH's guess (patch.js, which the
  # guess specs drive after a warm start); AUDIO IN (audio-in.js), whose
  # capture hands a standing walk crew the new phrase; the answers and the
  # lesson (explain.js), whose figures ask the engine in `soon`; the engine crates those scripts call
  # into for walks and measurement (auracle-session, auracle-wasm); a spec file
  # that holds an @slow test; the suite's config and lockfile. NOT main.js:
  # every view lives in it, so it would make almost every app PR a slow run.
  # A main.js change that breaks an @slow spec is caught on the push to main;
  # add `full-ci` to a PR whose main.js change touches EVOLVE's generations
  # or PERFORM's offers.
  scope:
    name: What this covers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: scope
        name: Decide what to run
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          out() {
            echo "rust=$1" >> "$GITHUB_OUTPUT"
            echo "browser=$2" >> "$GITHUB_OUTPUT"
            printf '\n  rust=%s browser=%s\n' "$1" "$2"
          }

          if [ "$EVENT" != "pull_request" ]; then
            echo "$EVENT — running everything"
            out true true; exit 0
          fi
          if [ "$ACTION" = "labeled" ] && [ "$LABEL" != "full-ci" ]; then
            echo "labelled '$LABEL', which asks for nothing — the last push's run stands"
            out false false; exit 0
          fi
          if [ "$FULL_CI" = "true" ]; then
            echo "the PR carries full-ci — running everything"
            out true true; exit 0
          fi

          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"
          echo "$files" | awk '{ print "  " $0 }'

          own='^(Makefile$|\.github/workflows/slow-suite\.yml$|\.github/actions/)'

          if echo "$files" | grep -qE "$own|^(crates/|Cargo\.(toml|lock)$|rust-toolchain)"; then
            rust=true
          else
            rust=false
          fi

          # A changed spec counts if it holds an @slow test now.
          slow_spec=false
          for f in $(echo "$files" | grep -E '^tests/web/.*\.spec\.js$' || true); do
            if [ -f "$f" ] && grep -qE '@slow|@quarantine' "$f"; then slow_spec=true; fi
          done

          if [ "$slow_spec" = true ] || echo "$files" | grep -qE "$own|^(apps/web/(worker|farm|perform|patch|live-audio|audio-in|explain|faces|vessel)\.js$|crates/auracle-(session|wasm)/|Cargo\.lock$|tests/web/(playwright\.config\.js|fixtures\.js|package(-lock)?\.json)$)"; then
            browser=true
          else
            browser=false
          fi

          out "$rust" "$browser"

  # The slow Rust tests, in two legs: the search floor gets a runner to itself
  # (it walks 16 seeds, one thread each, and on a 4-core runner those threads
  # queue four deep; next to other tests it makes them wait for the cores),
  # and the other ten share one (~5 min; the longest is ~3 min).
  rust:
    name: Slow Rust (${{ matrix.name }})
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: search floor
            target: test-search-floor
          - name: the rest
            target: test-slow-rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      # CI's test cache (ci.yml saves it from main); never saved from here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: nextest
      - run: make ${{ matrix.target }}

  engine:
    name: Engine for the browser
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-engine
      - uses: ./.github/actions/browser-timings
        with:
          tier: slow

  # The @slow specs, and any @quarantine'd out of the gate while it is fixed,
  # on six runners, dealt by main's last timings for this tier (see
  # tests/web/shard.mjs): a few of these tests take ~3 min each, so the split
  # by count left one runner with twice another's work.
  browser:
    name: Slow browser (${{ matrix.shard }})
    needs: [scope, engine]
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - uses: ./.github/actions/browser-shard
        with:
          tier: slow
          name: slow
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: --grep "@slow|@quarantine"

  # The runners' reports as one HTML report when one failed, and on main this
  # tier's timings for its next deal, as ci.yml's `report` job does.
  report-browser:
    name: Slow browser report
    needs: browser
    if: ${{ !cancelled() && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: slow
          failed: ${{ needs.browser.result == 'failure' }}
          timings: slow

  # A red slow tier on main is a regression that merged on the fast tier.
  # Nobody is watching a nightly run, so it files an issue: one open issue at
  # a time, commented on by every further failing run until someone closes it.
  report:
    name: Report a failure on main
    needs: [scope, rust, engine, browser]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # A local action: the job checks out first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Slow suite failing on main
          results: ${{ toJSON(needs) }}
          advice: >-
            This tier does not block merging, so the change that broke it is on
            main. The failing jobs' logs name the tests; the run's summary links
            one report of every browser runner, with the failed tests' traces.

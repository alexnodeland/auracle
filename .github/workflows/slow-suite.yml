name: Slow suite

# The SLOW tier: the tests too slow to gate every PR on. CI (ci.yml) is the
# fast tier and the only required check; a PR may merge on it alone. Each test
# runs in exactly one tier (docs/architecture/testing.md § CI tiers):
#
# - Rust: the search floor (`refinement_improves_pool`, ~330 s on a runner)
#   and the ten other tests over a minute (~1030 s of test time between them),
#   named in the Makefile as SEARCH_FLOOR and SLOW_TESTS. The fast tier runs
#   every test NOT named there.
# - Browser: the specs tagged `@slow` (~35 min of test time in one worker:
#   EVOLVE POOL generations, and PERFORM's listening, offers and drift), and,
#   in a job of their own, any tagged `@quarantine`: a flaky test moved out
#   of the gate until it is fixed, which names its issue (testing.md §
#   Flakes). The fast tier runs `--grep-invert "@slow|@quarantine"`.
#
# The nightly flake hunt is its own workflow (flake-hunt.yml), so its hour
# never holds this one's queue on main.
#
# When it runs:
#
# - on a PR, only when the PR carries the `full-ci` label: adding the label
#   starts a run, and every push to a labelled PR runs it again. A PR without
#   the label runs nothing here (the `scope` job is skipped, and every job
#   after it). It reports; it does not block merging, and it no longer takes
#   runners from the gate on every PR push that reaches what it covers. Add
#   `full-ci` to a PR that changes what these tests cover, the paths this
#   workflow used to run a PR for: any crate, Cargo.toml or Cargo.lock,
#   rust-toolchain.toml, the Makefile, this workflow or .github/actions/;
#   apps/web's worker.js, farm.js, perform.js, patch.js, live-audio.js,
#   audio-in.js, explain.js, faces.js or vessel.js; tests/web's fixtures.js,
#   playwright.config.js, package.json or package-lock.json; or a spec file
#   that holds an @slow or @quarantine test. Also a main.js change that
#   reaches EVOLVE's generations or PERFORM's offers. Otherwise the push to
#   main is where a slow test catches it.
# - on main, in full: the latest push, and nightly. A failure there opens an
#   issue titled "Slow suite failing on main", or comments on it if one is
#   already open, so a regression that merged on the fast tier is found
#   within one merge or one night. A quarantined test's failure is not one:
#   it is said on the test's own issue, and the run stays green, so that
#   issue means a new regression (or a quarantined test whose issue was
#   closed, which owns no failure). Latest only: a run in progress
#   finishes, and of the pushes that land meanwhile only the newest waits,
#   since its run covers everything before it. A batch from the merge queue
#   lands as two or three merges seconds apart; a run whose commit main has
#   already moved past runs nothing (the `scope` job).
# - on demand (Actions → Slow suite → Run workflow), in full.
#
# It holds at most four runners at once (the matrices' `max-parallel`: one
# Rust leg and three browser runners; the quarantined tests' one runner
# starts once all six browser runners are done). The account runs at most
# 20 jobs at once. The merge queue's run of CI, the full gate, holds about
# 18 at its widest: twelve browser runners, the Site job, the Worker
# protocol job, the three Coverage runners and one more for a Lint, Web or
# Doctests job still running, or the Browser report. 18 + 4 = 22, two over,
# and a merge starts this workflow just as the queue starts on its next
# batch, beside main's own CI (which reuses the queue's verdict and runs the
# engine and Site for the deploy, two runners). So the queue's next run can
# wait a few minutes for runners while this one's first jobs hold them. A
# PR's fast lane holds at most twelve (four browser runners, the three
# Coverage runners, Site, Worker protocol and three of Lint, Web and
# Doctests), only when it changes both Rust and an app module with specs of
# its own; most hold two to eight (testing.md § CI tiers, Runners).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes its in-flight run obsolete. On main nothing is
# cancelled: a run in progress finishes, and of the runs that arrive
# meanwhile (pushes, the nightly run) only the newest waits (`queue:
# single`), since the newest covers everything before it. Adding an
# unrelated label to a PR starts a run too (GitHub cannot filter `labeled`
# by name); it gets a group of its own, so it does nothing rather than
# cancel a real run.
concurrency:
  group: slow-suite-${{ github.head_ref || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: single

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0
  # nextest's ci profile (.config/nextest.toml), as in ci.yml.
  NEXTEST_PROFILE: ci
  CARGO_NET_RETRY: 10

jobs:
  # Is this run asked for? Everything but a PR is (a push to main, the
  # nightly run, a run by hand). A PR is when it carries `full-ci`, unless
  # this event is another label being added to it, which asks for nothing:
  # the last push's run stands (and the concurrency group above keeps this
  # run from cancelling it). When this job is skipped, so is every job after
  # it, and the run costs no runner. A push to main that main has already
  # moved past (main is ahead of it) runs nothing either (`run` is false):
  # the newest push's run covers it, as ci.yml's changes job does for CI.
  scope:
    name: Asked for
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.why.outputs.run }}
    steps:
      - name: Say why
        id: why
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "the PR carries full-ci: running everything"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
            read -r status tip <<<"$(gh api "repos/$REPO/compare/$GITHUB_SHA...main" -q '"\(.status) \(.commits[-1].sha // "")"')" &&
            [ "$status" = ahead ] && [ -n "$tip" ]; then
            echo "superseded: main is at ${tip:0:12} now, and that push's run covers this one"
            echo "Superseded: main moved on to \`${tip:0:12}\` before this run began, and that push's run covers this one." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "$EVENT: running everything"
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  # The slow Rust tests, in two legs: the search floor gets a runner to itself
  # (it walks 16 seeds, one thread each, and on a 4-core runner those threads
  # queue four deep; next to other tests it makes them wait for the cores),
  # and the other ten share one (~5 min; the longest is ~3 min). One leg at a
  # time (`max-parallel: 1`), beside at most three browser runners: four.
  rust:
    name: Slow Rust (${{ matrix.name }})
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: search floor
            target: test-search-floor
          - name: the rest
            target: test-slow-rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      # The test cache, which ci.yml's Doctests job restores too. Saved from
      # main by one leg (both build the same test binaries): CI's own Rust
      # jobs on main reuse the merge queue's verdict and seldom run there.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target == 'test-slow-rest' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: nextest
      - run: make ${{ matrix.target }}

  # The engine, this tier's timings and the image's tag (the Playwright
  # version tests/web/package-lock.json locks), once for the run, as in
  # ci.yml.
  engine:
    name: Engine for the browser
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: playwright
        uses: ./.github/actions/playwright-version
      - uses: ./.github/actions/web-engine
      - uses: ./.github/actions/browser-timings
        with:
          tier: slow

  # The @slow specs, in six shards, dealt by main's last timings for this
  # tier (see tests/web/shard.mjs): a few of these tests take ~3 min each, so
  # the split by count left one runner with twice another's work. Three run
  # at a time (`max-parallel`), so the six take two rounds of about seven
  # minutes. A test tagged @quarantine too is the quarantine job's.
  browser:
    name: Slow browser (${{ matrix.shard }})
    needs: [scope, engine]
    runs-on: ubuntu-24.04
    # In Playwright's image, as ci.yml's browser job: no apt step and no
    # browser download (.github/actions/playwright says why).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    # Playwright's global timeout, five minutes under the job's limit; the
    # shard interrupts the run a minute before it, so a shard that runs long
    # still reports its tests and the one it was running (ci.yml's browser
    # job says why). The two numbers move together.
    timeout-minutes: 30
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - uses: ./.github/actions/browser-shard
        with:
          tier: slow
          name: slow
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: --grep "@slow" --grep-invert "@quarantine"

  # The @quarantine specs: flaky tests out of the gate while they are fixed
  # (testing.md § Flakes), still run so they are still seen. Each names its
  # flake issue (`annotation: { type: "issue", description: "#N" }`, which
  # `make spec-lint` checks), and a failure is said there (the jobs below),
  # not here: the run step may fail and this job stays green. What no issue
  # owns turns the run red in the next job. One runner, once the slow browser
  # runners are done, so the run holds at most four at once. With nothing
  # quarantined it runs no test.
  quarantine:
    name: Quarantined browser
    needs: [scope, engine, browser]
    if: ${{ !cancelled() && needs.engine.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    # As the slow browser runners: the global timeout five minutes under the
    # job's limit.
    timeout-minutes: 30
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 25
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - id: run
        continue-on-error: true
        uses: ./.github/actions/browser-shard
        with:
          tier: slow
          name: quarantine
          shard: "1/1"
          index: "0"
          args: --grep "@quarantine"

  # A quarantined run that failed: one report of it (linked from the run's
  # summary, traces and all), and which issue each failed test is said on
  # (tests/web/flakes.mjs). A failure no issue owns (a test naming none or a
  # closed issue, one cut short, an error outside the tests, a failed run
  # with no failed test) is not a known flake: this job fails on it, and the
  # run is red.
  report-quarantine:
    name: Quarantined browser report
    needs: quarantine
    if: ${{ !cancelled() && needs.quarantine.outputs.outcome == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      issues: ${{ steps.who.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: quarantine
          failed: "true"
      # The open issues: a comment on a closed one would reach no one. Unread
      # (gh failed), each issue named is taken as open, so a hiccup here
      # never turns the run red by itself.
      - name: Which issue each failure is said on
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tests/web
          open=()
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > open-issues.json; then
            open=(--open open-issues.json)
          else
            echo "::warning::The open issues could not be listed: each failure is said on the issue it names."
          fi
          node flakes.mjs quarantined merged.json "${open[@]}" --outcome failure
      - name: What no issue owns
        if: steps.who.outputs.unowned != '0'
        run: |
          echo "::error::The quarantined tests' run failed in a way no flake's issue owns; the run's summary says how."
          exit 1

  # Each issue whose quarantined test failed on main gets one comment: the
  # test, how many of its runs failed and what the first said, and the run.
  # Nothing here is a verdict on main.
  file-quarantine:
    name: "Say it on #${{ matrix.issue }}"
    needs: report-quarantine
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      needs.report-quarantine.outputs.issues != '' &&
      needs.report-quarantine.outputs.issues != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.report-quarantine.outputs.issues) }}
    steps:
      # A local action: the job checks out first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          issue: ${{ matrix.issue }}
          failed: ${{ matrix.failed }}
          detail: ${{ matrix.detail }}
          advice: >-
            This test is quarantined under this issue: out of the gate, it runs
            in the Slow suite's job for quarantined tests, where a failure is
            said here and leaves the suite green. The run's summary links a
            report with the failed run's trace. The PR that fixes it removes
            the @quarantine tag and its issue annotation (docs/process.md §
            Flakes).

  # The runners' reports as one HTML report when one failed, and on main this
  # tier's timings for its next deal, as ci.yml's `report` job does.
  report-browser:
    name: Slow browser report
    needs: browser
    if: ${{ !cancelled() && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: slow
          failed: ${{ needs.browser.result == 'failure' }}
          timings: ${{ github.ref == 'refs/heads/main' && 'slow' || '' }}

  # A red slow tier on main is a regression that merged on the fast tier.
  # Nobody is watching a nightly run, so it files an issue: one open issue at
  # a time, commented on by every further failing run until someone closes it.
  # A quarantined test's failure is not among them: its job stays green, and
  # only a failure no issue owns fails report-quarantine.
  report:
    name: Report a failure on main
    needs: [scope, rust, engine, browser, quarantine, report-quarantine]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # A local action: the job checks out first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Slow suite failing on main
          results: ${{ toJSON(needs) }}
          advice: >-
            This tier does not block merging, so the change that broke it is on
            main. The failing jobs' logs name the tests; the run's summary links
            one report of every browser runner, with the failed tests' traces.

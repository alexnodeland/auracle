name: CI

# The FAST tier: every test fast enough to gate a merge on. The tests too
# slow for that (the search floor, the other Rust tests that took over a
# minute when they were named, the browser specs tagged @slow, and any
# tagged @quarantine while a flake is fixed) run in the Slow suite workflow
# (slow-suite.yml): on a push to main that changes what they cover,
# nightly unless the newest run on main that tested anything (a night's, a
# push's or one by hand) tested main's head green, and on a PR that
# carries the `full-ci` label. Each test runs in exactly one tier;
# docs/architecture/testing.md § CI tiers lists which and why.
#
# Two lanes, one workflow (ADR-023); the `changes` job picks the lane.
#
# - A PR's own run is the FAST LANE: Lint, the Rust tests (as Coverage) and
#   the Doctests when Rust changed; Web and Site when the site, the docs or
#   the app did (Web alone for a script's own tests); Browser smoke when the
#   app, the engine or what runs the specs did; Worker protocol when the
#   app, the engine or tests/worker did; and the browser specs the change
#   reaches (tests/web/changed.mjs), on up to four runners, the spec files it
#   adds or edits three times each (Burn-in, on up to three runners of its
#   own, sized by main's times, #456: no other run repeats a spec before the
#   queue). A change whose
#   specs can't be told (main.js, worker.js, a crate) runs the smoke only,
#   with Worker protocol beside it, and a change to CI itself runs the full
#   gate. About five minutes
#   for docs; up to about ten when Rust changed (Coverage sets the length:
#   about seven minutes on one runner, after What changed has built the
#   engine), an app module's specs run (patch.js reaches
#   about 23 test-minutes, on four runners) or specs are burned in (planned
#   at about six minutes a runner, seven at most). A green fast lane, with the PR's
#   `PR checks` (pr-checks.yml) and `Mutants in the changed code`
#   (mutants.yml), puts the PR in the merge queue (.mergify.yml's queue
#   conditions). It is not the whole gate.
# - The merge queue's run (Mergify's draft PR, from a branch under
#   mergify/merge-queue/: .mergify.yml) is the FULL GATE, about twelve
#   minutes: everything, as on main, the browser tier on twelve runners. It
#   tests the tree that lands, up to three queued PRs at once (a release PR
#   alone), and its `Full gate` job is the check the queue merges on.
#
# A queue run waits for at most three runners in a row (#580): What changed
# (which also restores or builds the engine), then the jobs that test, then
# `CI` and `Full gate` side by side. Every job waits for a runner of its
# own, and on a busy account each wait can be minutes, so the run has no
# chain longer than that: Coverage is one job, and the browser runners'
# report is a step of `CI`.
#
# The branch ruleset requires one check, `CI`, in both lanes. The browser
# shards are inside it; the Slow suite is not.
#
# On main the jobs the queue's run passed on these exact files are not run
# again (the `changes` job says which), and the site deploys from this run's
# own build once `CI` is green (the `deploy` job).
#
# Coverage also goes to Codecov (codecov.yml, .github/actions/codecov), a
# view and never a gate: Coverage's Rust lcov, and an lcov each from Web's
# unit tests and from Worker protocol, each uploaded by a step at the end of
# its job, under a flag of its own (rust, web, worker). From a PR's own run
# and from main, not from the queue's: its draft PR's commit never reaches
# main. When main reuses the queue's verdict, a job of its own (`codecov-main`,
# which nothing waits for) uploads the queue run's reports as main's,
# measured on the same files. An upload never fails a job: each step carries
# on past an error, and its limit fits inside its job's.
#
# Every job in every workflow runs on `ubuntu-24.04`, not `ubuntu-latest`:
# the label's move to a new image is its own PR, with a Flake hunt run, not a
# change that lands under whichever PR happens to be in CI that day. The jobs
# that run a browser run on it in Playwright's image, pinned to the version
# tests/web/package-lock.json locks (.github/actions/playwright).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run for that PR obsolete, so stop it
# rather than paying for two answers to the same question. On main, the
# latest push only: a run in progress is not cancelled, and of the pushes
# that arrive meanwhile only the newest waits (`queue: single`, which
# replaces a waiting run with a newer one). A batch from the merge queue
# lands as two or three merges seconds apart, and the newest one's tree is
# the tree the queue tested, so that is the run worth having; it covers
# everything before it. A run that finds main already moved past its commit
# runs nothing (the changes job). A run on main reuses the queue's verdict
# on the same files, so the runs are short.
#
# The merge queue's runs share one group, whatever their draft PR's branch:
# the queue checks one batch at a time (.mergify.yml: `mode: serial`,
# `max_parallel_checks: 1`), so a new queue run means the draft PR before it
# was closed (its batch was reset: a PR in it pushed or dequeued, or a merge
# from outside the queue; or it went red), and nothing reads that run any
# more. It stops when the next one starts, rather than holding its runners
# until it ends (#580: one such run used 73.5 runner-minutes beside the next
# batch's). The prefix is .mergify.yml's queue_branch_prefix, as in the
# changes job and `Full gate`; only from this repository, so a fork's PR
# from a branch of that name keeps a group of its own and stops no batch.
#
# A cancelled run holds its group until the jobs it still runs have ended,
# and a job whose `if` holds when the run is cancelled is still run, runner
# wait and all: the next run waits for it. So `CI` and `Full gate` do not run
# in a run cancelled before every job they read had ended (theirs say how):
# a reset batch's run ends when it is cancelled. A red batch's `CI` does run
# to its end, since its tests had all ended, so its merged report and its
# records are kept; the next batch's run then starts when it has.
concurrency:
  group: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.head.repo.full_name == github.repository && 'ci-merge-queue' || format('ci-{0}', github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: single

# Read the code, nothing else: no job here writes to the repository. The
# Actions cache and artifacts use the runner's own token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # The test-fast profile is incremental, for a workstation's edit-and-test
  # loop (Cargo.toml). Here every build starts from a cache, and incremental
  # state in target/ would only bloat every cache upload; this overrides it.
  CARGO_INCREMENTAL: 0
  # nextest's ci profile (.config/nextest.toml): a hung test is stopped
  # inside the job's limit, so the job reports it.
  NEXTEST_PROFILE: ci
  # A blipped crates.io fetch should not cost a whole rerun.
  CARGO_NET_RETRY: 10
  # Keep in sync with the Makefile. mdBook stays on 0.4: mdbook-katex and
  # mdbook-admonish at these versions build against its preprocessor API.
  MDBOOK_VERSION: 0.4.52
  MDBOOK_KATEX_VERSION: 0.9.4
  MDBOOK_ADMONISH_VERSION: 1.20.0

jobs:
  # Which lane is this run, and what does the change reach?
  #
  # The lane comes from the event and the branch (the header says what each
  # runs). A queue run, a push and a run by hand run everything: main is what
  # the site deploys from and what releases are cut from, and the queue's run
  # is the verdict main reuses, so neither is ever partly verified. Only a
  # PR's fast lane is narrowed, by the paths it changed.
  #
  # It also restores or builds the engine for the jobs that run it, in its
  # last steps (below), so they start one runner wait sooner than behind a
  # job of their own.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    # A cold wasm build (the engine's steps) and room; the rest takes
    # seconds.
    timeout-minutes: 20
    # actions: read, to find and download the queue run's record (the reuse
    # step) and its browser times.
    permissions:
      contents: read
      actions: read
    outputs:
      # The Playwright version tests/web/package-lock.json locks: the tag of
      # the image every browser job here runs in.
      playwright: ${{ steps.playwright.outputs.version }}
      lane: ${{ steps.filter.outputs.lane }}
      rust: ${{ steps.filter.outputs.rust }}
      site: ${{ steps.filter.outputs.site }}
      web: ${{ steps.filter.outputs.web }}
      smoke: ${{ steps.filter.outputs.smoke }}
      worker: ${{ steps.filter.outputs.worker }}
      browser: ${{ steps.filter.outputs.browser }}
      specs: ${{ steps.filter.outputs.specs }}
      browser_matrix: ${{ steps.filter.outputs.browser_matrix }}
      burnin: ${{ steps.filter.outputs.burnin }}
      burnin_specs: ${{ steps.filter.outputs.burnin_specs }}
      burnin_matrix: ${{ steps.filter.outputs.burnin_matrix }}
      reuse_lint: ${{ steps.reuse.outputs.lint }}
      reuse_web: ${{ steps.reuse.outputs.web }}
      reuse_worker: ${{ steps.reuse.outputs.worker }}
      reuse_doctests: ${{ steps.reuse.outputs.doctests }}
      reuse_coverage: ${{ steps.reuse.outputs.coverage }}
      reuse_browser: ${{ steps.reuse.outputs.browser }}
      reuse_run: ${{ steps.reuse.outputs.run }}
      # Each class's record key, and in the queue's run the record of each
      # it would reuse (a dry run, #581): JSON objects, by class.
      keys: ${{ steps.keys.outputs.json }}
      would_reuse: ${{ steps.lookup.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to be reachable to diff against it.
          fetch-depth: 0

      # Main's browser times, which size a PR's burn-in (tests/web/burnin.mjs):
      # the cache the Browser job deals from (.github/actions/browser-timings).
      # None (evicted, the first run) weighs every test the same.
      - name: Main's browser times, for the burn-in
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/web/timings-fast.json
          key: browser-timings-fast-${{ github.run_id }}
          restore-keys: browser-timings-fast-

      - id: filter
        name: Pick the lane and classify the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          one='["1/1"]'
          twelve='["1/12","2/12","3/12","4/12","5/12","6/12","7/12","8/12","9/12","10/12","11/12","12/12"]'
          # Every lane writes every output. The browser job's matrix is read
          # even when the job is skipped, and an empty one is an error.
          full() {
            {
              echo "rust=true"
              echo "site=true"
              echo "web=true"
              echo "browser=true"
              echo "smoke=false"
              echo "worker=true"
              echo "specs="
              echo "browser_matrix=$twelve"
              echo "burnin=false"
              echo "burnin_specs="
              echo "burnin_matrix=$one"
            } >> "$GITHUB_OUTPUT"
          }

          # The queue's draft PRs come from branches under Mergify's prefix
          # (.mergify.yml's queue_branch_prefix, its default). Any other
          # pull_request run is a PR's own.
          lane=full
          if [ "$EVENT" = pull_request ]; then
            case "$HEAD_REF" in
              mergify/merge-queue/*) lane=queue ;;
              *) lane=fast ;;
            esac
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

          if [ "$lane" != fast ]; then
            # On main, latest only: a batch lands as two or three merges
            # seconds apart, and only the last one's files are the files the
            # queue tested. A run whose commit main has already moved past
            # runs nothing; the run of the newest push, which the concurrency
            # queue always keeps, tests these changes with the ones after
            # them. "Moved past" is main being ahead of this commit, which
            # it then contains, not merely elsewhere. An answer the API
            # can't give is no reason to skip: run everything.
            if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              read -r status tip <<<"$(gh api "repos/$REPO/compare/$GITHUB_SHA...main" -q '"\(.status) \(.commits[-1].sha // "")"' || true)"
              if [ "${status:-}" = ahead ] && [ -n "${tip:-}" ]; then
                echo "superseded: main is at ${tip:0:12} now, and that push's run tests this one's changes with it"
                {
                  echo "rust=false"
                  echo "site=false"
                  echo "web=false"
                  echo "browser=false"
                  echo "smoke=false"
                  echo "worker=false"
                  echo "specs="
                  echo "browser_matrix=$twelve"
                  echo "burnin=false"
                  echo "burnin_specs="
                  echo "burnin_matrix=$one"
                  echo "superseded=true"
                } >> "$GITHUB_OUTPUT"
                {
                  echo "### Superseded"
                  echo
                  echo "main moved on to \`${tip:0:12}\` before this run began, so nothing here runs: that push's run tests these changes with the ones after them, and deploys."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "$lane: running everything"
            full
            exit 0
          fi

          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"
          echo "$files" | awk '{ print "  " $0 }'

          # What the change reaches, from scripts/changes.py: the one path
          # classifier, which `make check-changed` runs too, so CI and a
          # workstation agree on what a change reaches. It prints a
          # `class=true|false` line for each job (its docstring and comments
          # say why each path reaches what). A change to CI itself, the
          # classifier included, runs the full gate here too: a workflow or
          # an action the queue would trip on proves itself before it
          # reaches the queue, where it would hold up a batch.
          classes="$(printf '%s\n' "$files" | python3 scripts/changes.py classify)"
          class() { echo "$classes" | sed -n "s/^$1=//p"; }
          if [ "$(class full)" = true ]; then
            echo "a change to CI itself: the full gate, as the queue runs it"
            full
            exit 0
          fi
          rust="$(class rust)"
          site="$(class site)"
          web="$(class web)"
          smoke="$(class smoke)"
          worker="$(class worker)"
          reach="$(class reach)"

          # The specs the change reaches (tests/web/changed.mjs, as `make
          # browser-changed` picks them before it follows the views): a
          # changed spec, the specs that require a changed helper, the specs
          # named for a changed app module. main.js, worker.js, index.html,
          # style.css, the config and the engine reach every level and select
          # nothing here, and say so below; locally, `make browser-changed`
          # runs the specs of the views they reach. More than twenty files
          # (a helper nearly every spec requires, or that many specs changed
          # at once) is the tier in all but name: the smoke pair runs here
          # instead, whatever changed, and the queue runs them all. One
          # runner per spec file, at most four, dealt by time like the full
          # tier.
          #
          # The spec files the change adds or edits itself (changed.mjs
          # --touched) are its burn-in, #456: they run three times each in
          # the Burn-in job, so a new spec that is flaky is caught here, not
          # in the queue, where a red batch costs every PR in it. They leave
          # the once-run selection, which never runs a file twice. Its
          # runners are sized by main's times, not by count (burnin.mjs):
          # about six minutes each, up to three, with as many of the files as
          # fit, a new spec first and then the lightest. The rest, and all of
          # them past twenty files (a burn-down that edits most of the
          # suite), stay in the once-run selection, and the run's summary
          # names them as owed a burn-in on a workstation.
          browser=false
          specs=""
          n=1
          burnin=false
          burnin_specs=""
          bn=1
          if [ "$reach" = true ]; then
            sel="$(cd tests/web && node changed.mjs "origin/$BASE_REF")" || { echo "changed.mjs could not say: smoke only"; sel=""; }
            touched="$(cd tests/web && node changed.mjs --touched "origin/$BASE_REF")" || { echo "changed.mjs could not say what the change edits: no burn-in"; touched=""; }
            tcount="$(echo "$touched" | grep -c . || true)"
            chosen=""
            if [ "$tcount" -gt 20 ]; then
              echo "the change edits $tcount spec files: no burn-in"
            elif [ "$tcount" -gt 0 ]; then
              planned="$(cd tests/web && node burnin.mjs --timings timings-fast.json --files "$(echo "$touched" | paste -sd' ' -)")" || planned=0
              read -r bn chosen <<<"$planned" || true
              if [ "${bn:-0}" -gt 0 ] && [ -n "$chosen" ]; then
                burnin=true
                burnin_specs="$(printf '%s\n' $chosen | sed 's#^#/#' | paste -sd' ' -)"
                sel="$(echo "$sel" | grep -vxF -f <(printf '%s\n' $chosen) || true)"
              else
                bn=1
                chosen=""
              fi
            fi
            left="$(echo "$touched" | grep -vxF -f <(printf '%s\n' $chosen x) | grep . || true)"
            if [ -n "$left" ]; then
              echo "not burned in (too heavy beside the rest): $(echo "$left" | paste -sd' ' -)"
              {
                echo "### Not burned in"
                echo
                echo "These spec files this PR adds or edits are too heavy to run three times here (tests/web/burnin.mjs), so they run once here. Burn them in on a workstation (\`make browser-changed REPEAT=3\`); a failure there is this PR's to fix."
                echo
                echo "$left" | sed 's/^/- /'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            count="$(echo "$sel" | grep -c . || true)"
            if [ "$count" -gt 20 ]; then
              echo "the change reaches $count spec files: the smoke pair here, and the queue runs them all"
              smoke=true
            elif [ "$count" -gt 0 ]; then
              browser=true
              # Anchored at a path separator, as shard.mjs does, so a spec's
              # name never also selects another file ending in it.
              specs="$(echo "$sel" | sed 's#^#/#' | paste -sd' ' -)"
              n="$count"
              [ "$n" -gt 4 ] && n=4
            fi
          fi
          matrix="[$(seq 1 "$n" | sed "s#.*#\"&/$n\"#" | paste -sd, -)]"
          burnin_matrix="[$(seq 1 "$bn" | sed "s#.*#\"&/$bn\"#" | paste -sd, -)]"

          {
            echo "rust=$rust"
            echo "site=$site"
            echo "web=$web"
            echo "smoke=$smoke"
            echo "worker=$worker"
            echo "browser=$browser"
            echo "specs=$specs"
            echo "browser_matrix=$matrix"
            echo "burnin=$burnin"
            echo "burnin_specs=$burnin_specs"
            echo "burnin_matrix=$burnin_matrix"
          } >> "$GITHUB_OUTPUT"
          printf '\n  rust=%s site=%s web=%s smoke=%s worker=%s browser=%s burnin=%s\n  specs=%s\n  browser runners=%s\n  burn-in=%s\n  burn-in runners=%s\n' "$rust" "$site" "$web" "$smoke" "$worker" "$browser" "$burnin" "${specs:-none}" "$matrix" "${burnin_specs:-none}" "$burnin_matrix"

      # A push to main is a squash merge by the merge queue. The last merge
      # of a batch has exactly the files the queue's run tested (a
      # pull_request run tests the draft PR merged into main), and that run
      # left a record of the jobs it passed on them (the `ci` job). Those
      # jobs are not run again: same files, same answer, and one more chance
      # to flake for nothing. Everything runs when no record matches (a merge
      # by hand, outside the queue), on a manual run, and when the record is
      # missing or expired. Only a queue run's record of the tree counts: a
      # PR's fast lane runs part of the gate, and leaves none. (The records
      # of a class below are another thing, which main does not read yet.)
      # Any error here (the API, a download, a record it cannot read) means no
      # reuse, not a red run: the jobs then simply run.
      - id: reuse
        name: Reuse the queue's verdict on the same files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.filter.outputs.superseded != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "files: tree $tree"
          art="$(gh api "repos/$REPO/actions/artifacts?name=verified-tree-$tree&per_page=10" \
            -q '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')"
          if [ -z "$art" ]; then
            echo "no queue run verified these exact files; running everything"; exit 0
          fi
          # Only a pull_request run of this workflow from the queue's branch
          # in this repository: a fork's run executes the fork's copy of the
          # workflow, and a PR's own run is the fast lane.
          IFS=$'\t' read -r event path head branch <<<"$(gh api "repos/$REPO/actions/runs/$art" \
            -q '[.event, .path, .head_repository.full_name, .head_branch] | @tsv')"
          if [ "$event" != pull_request ] || [ "$path" != .github/workflows/ci.yml ] || [ "$head" != "$REPO" ] || [ "${branch#mergify/merge-queue/}" = "$branch" ]; then
            echo "the record is from run $art ($event, $path, $head, $branch), which does not count; running everything"; exit 0
          fi
          gh run download "$art" --repo "$REPO" -n "verified-tree-$tree" -D verified
          cat verified/verified.json
          # Lint, the Rust tests and their coverage, and the doctests hold for
          # the compiler they ran on: reused only while rust-toolchain.toml
          # pins that release. The record keeps what `rustc --version` prints
          # after "rustc", so its first word is the release ("1.99.0
          # (b940084d7 2026-09-28)").
          pinned="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          recorded="$(jq -r '.rustc // ""' verified/verified.json)"
          echo "rustc: recorded '$recorded', pinned '$pinned'"
          # Lint and Coverage run here anyway after a batch that changed
          # rust-toolchain.toml or Cargo.lock, for their caches, which these
          # jobs save from main only. rust-cache keys a cache by the rustc
          # release and the lockfile: reused, nothing would save under a new
          # release's key, and both jobs would build cold on every run after;
          # nothing would save a bumped dependency either, which every run
          # after would build again. (The test cache is the Slow suite's to
          # save.) The batch is everything since main's tip when the queue
          # tested it (the record's `base`; the push's `before` for a record
          # without one). A diff that can't be read runs them too.
          since="$(jq -r '.base // empty' verified/verified.json)"
          since="${since:-$BEFORE}"
          fresh=""
          if ! git diff --quiet "$since" HEAD -- rust-toolchain.toml Cargo.lock; then
            echo "rust-toolchain.toml or Cargo.lock changed since ${since:0:12} (or the diff failed): Lint and Coverage run, to save their caches"
            fresh=" lint coverage "
          fi
          # Web and Worker protocol hold whatever compiler Lint ran on: Web
          # compiles nothing, and Worker protocol's engine is built from
          # these files, rust-toolchain.toml included.
          reused=""
          for job in lint web doctests coverage worker; do
            r="$(jq -r ".ran.$job" verified/verified.json)"
            if [ "$job" != web ] && [ "$job" != worker ] && { [ -z "$pinned" ] || [ "${recorded%% *}" != "$pinned" ]; }; then continue; fi
            case "$fresh" in *" $job "*) continue ;; esac
            if [ "$r" = success ]; then echo "$job=true" >> "$GITHUB_OUTPUT"; reused="$reused, $job"; fi
          done
          if [ "$(jq -r .ran.browser verified/verified.json)" = full ]; then echo "browser=true" >> "$GITHUB_OUTPUT"; reused="$reused, browser"; fi
          echo "run=$art" >> "$GITHUB_OUTPUT"
          {
            echo "### Reused from the merge queue"
            echo
            echo "Queue run [$art]($GITHUB_SERVER_URL/$REPO/actions/runs/$art) passed these jobs on these exact files (tree \`${tree:0:12}\`), and they are not run again: ${reused#, }."
          } >> "$GITHUB_STEP_SUMMARY"

      # The queue run's browser times, folded into main's timings by its
      # Browser report job, saved here for the next run's deal: a cache
      # saved by a pull_request run is that PR's alone, and main never runs
      # the tier itself when it reuses the queue's verdict. Without this, the
      # timings would stop at the last tier main ran. An error costs the next
      # run its balance, never this run its answer.
      - id: times
        name: Keep the queue run's browser times
        if: steps.reuse.outputs.browser == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ steps.reuse.outputs.run }}
        run: gh run download "$RUN" --repo "$REPO" -n browser-timings-folded-fast -D tests/web
      - if: steps.times.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/web/timings-fast.json
          key: browser-timings-fast-${{ github.run_id }}-${{ github.run_attempt }}

      # The voice check (www/brand/voice.md) reads the README and the
      # changelog as well as the site and the app, and a PR that touches only
      # those skips the web job's `make dev-check`. It takes a second, so it
      # runs here, on every PR.
      # Each class of job's record key (scripts/changes.py keys): a hash of
      # the files that class reads, in this commit and in the main it was
      # merged onto (HEAD^1). `CI` names the record of a class that passed
      # by it; the queue's run looks each up (below). An error means no key,
      # so no record and no lookup, never a red run.
      - id: keys
        name: The records' keys
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          keys="$(python3 scripts/changes.py keys --base HEAD^1 --json)"
          echo "$keys" | jq .
          echo "json=$keys" >> "$GITHUB_OUTPUT"

      # A dry run of reuse in the queue (#581): for each class, a record of
      # a run that passed it on byte-identical inputs, a PR's own run (when
      # it ran the class in full) or an earlier queue run. Logged as `would
      # reuse <class> (record <run>)`, and nothing is skipped: everything
      # runs, and `CI` sets each against what ran here, so a wave's batches
      # can be diffed before skipping turns on. Only a pull_request run of
      # this workflow from this repository counts, as for main's reuse
      # above. Any error means no reuse, as there.
      - id: lookup
        name: Records these files match (a dry run)
        if: steps.filter.outputs.lane == 'queue' && steps.keys.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEYS: ${{ steps.keys.outputs.json }}
        run: |
          set -euo pipefail
          found='{}'
          rows=""
          for class in rust browser worker web site tree; do
            key="$(jq -r --arg c "$class" '.[$c] // empty' <<<"$KEYS")"
            [ -n "$key" ] || continue
            run="$(gh api "repos/$REPO/actions/artifacts?name=ci-record-$class-$key&per_page=20" \
              -q "[.artifacts[] | select(.expired == false) | .workflow_run.id | select(. != $GITHUB_RUN_ID)] | first // empty")" || run=""
            if [ -z "$run" ]; then
              echo "would run $class: no record of key ${key:0:12}"
              rows="$rows| $class | none |"$'\n'
              continue
            fi
            IFS=$'\t' read -r event path head <<<"$(gh api "repos/$REPO/actions/runs/$run" -q '[.event, .path, .head_repository.full_name] | @tsv')" || true
            if [ "${event:-}" = pull_request ] && [ "${path:-}" = .github/workflows/ci.yml ] && [ "${head:-}" = "$REPO" ]; then
              echo "would reuse $class (record $run)"
              found="$(jq -c --arg c "$class" --arg r "$run" '. + {($c): $r}' <<<"$found")"
              rows="$rows| $class | [$run]($GITHUB_SERVER_URL/$REPO/actions/runs/$run) |"$'\n'
            else
              echo "would run $class: the record is from run $run (${event:-?}, ${path:-?}, ${head:-?}), which does not count"
              rows="$rows| $class | none (run $run's does not count) |"$'\n'
            fi
          done
          echo "json=$found" >> "$GITHUB_OUTPUT"
          {
            echo "### Records these files match (a dry run)"
            echo
            echo "A class with a record would have been reused had skipping been on. Nothing was skipped: \`CI\`'s summary sets each against what ran here."
            echo
            echo "| Class | Record |"
            echo "| --- | --- |"
            printf '%s' "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The voice (www/checkwords.py)
        run: python3 www/checkwords.py

      # A change's changelog entry waits in changelog.d/ until a release
      # moves it into CHANGELOG.md (scripts/changelog.py). A PR whose entry
      # sits beside only a README change skips the web job, and so does one
      # that changes only the assembler, so the entries' shape and the
      # assembler's own tests are checked here, on every PR, in about three
      # seconds.
      - name: The changelog's entries and assembler (scripts/changelog.py)
        run: |
          python3 scripts/changelog.py --check
          python3 scripts/test_changelog.py

      # The engine for Site, Browser smoke, Worker protocol and the browser
      # runners, built once per run (see the web-engine action's comment):
      # restored from the cache when no crate changed, which is most PRs that
      # touch the app, and ~1.5 min of wasm build otherwise. Here rather than
      # in a job of its own: a job waits for a runner, and these steps start
      # on the runner this job already has (#580).
      #
      # It also reads the Playwright version tests/web/package-lock.json
      # locks, the tag of the image every browser job here runs in (the
      # browser tier, the Burn-in and the Browser smoke), so a bump of
      # @playwright/test moves the image with it; and main's browser
      # timings, once for the whole run (see the action): every browser
      # runner deals its tests from that one file.
      - id: playwright
        uses: ./.github/actions/playwright-version
      - if: steps.filter.outputs.site == 'true' || steps.filter.outputs.browser == 'true' || steps.filter.outputs.worker == 'true' || steps.filter.outputs.burnin == 'true'
        uses: ./.github/actions/web-engine
      - if: (steps.filter.outputs.browser == 'true' && steps.reuse.outputs.browser != 'true') || steps.filter.outputs.burnin == 'true'
        uses: ./.github/actions/browser-timings
        with:
          tier: fast

  # Formatting and lints share a job: `cargo fmt --check` needs no dependency
  # graph and finishes in seconds, so giving it its own runner spent more on
  # scheduling overhead than on the work. It runs first, before clippy pays for
  # a compile, so a stray tab still fails in seconds.
  lint:
    name: Lint
    needs: changes
    # The compiler that judged these files, for main's reuse record: a lint or
    # test verdict holds for the toolchain it ran on.
    outputs:
      rustc: ${{ steps.rustc.outputs.version }}
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_lint != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every Rust job builds with the one compiler rust-toolchain.toml pins,
      # as `make` does locally: given no toolchain, rustup installs the file's,
      # with its components and the wasm32 target (rustup 1.28 and later; the
      # runner image has 1.29.1). Not dtolnay/rust-toolchain, which does not
      # read the file. A new stable then changes nothing here until a PR
      # bumps the file.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The web app has no build step and no type system, so the only thing that
  # stands between a typo and a blank instrument is `node --check` — and one
  # failure mode nothing else catches at all: a backtick inside the worklet's
  # PROCESSOR template literal, which leaves a blob that silently never
  # registers (CONTRIBUTING § Sharp edges). Its own job rather than a step in
  # `lint`, because `lint` is gated on Rust having changed and a JS-only PR is
  # exactly the PR this check exists for. It also runs `make dev-check`, whose
  # film tools' tests need numpy and scipy (installed below), with no Rust
  # toolchain. dev-check's parts run side by side on the runner's four cores
  # (`-j4`, each part's output kept together by `-O`); the tokens check's own
  # tests run their cases one process per core, about 9 s on a runner's four.
  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.reuse_web != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its parents: the specs' lint compares
          # tests/web/eslint-suppressions.json with HEAD^1's, the branch a
          # PR's merge commit goes onto (main's previous commit on a push).
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The film tools' own tests need numpy and scipy for the mix (the rest
      # of dev-check is the standard library). Only those two, pinned as
      # www/video/requirements-tools.txt pins them: about half a minute,
      # where the voice's whole set would take minutes.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: grep -E '^(numpy|scipy)==' www/video/requirements-tools.txt | xargs python3 -m pip install --quiet
      # The specs' lint (in web-check) and its hook's test (in dev-check) run
      # tests/web's locked ESLint. npm is cut at three minutes, as in
      # .github/actions/playwright.
      - run: |
          cd tests/web
          timeout -k 10 180 npm ci --no-audit --no-fund || {
            s=$?
            if [ "$s" = 124 ] || [ "$s" = 137 ]; then
              echo "::error::npm ci took over three minutes: the npm registry (registry.npmjs.org) is slow or unreachable from this runner, not the change. Re-run the job."
            fi
            exit "$s"
          }
      # COVERAGE=1: the unit tests' coverage of apps/web as an lcov too
      # (target/js-cov/web.lcov), for Codecov (the Makefile's NODE_COV).
      - id: units
        run: make web-check BASE=HEAD^1 COVERAGE=1
      - run: make -j4 -O dev-check
      # Uploaded once the unit tests passed, whatever dev-check said: the
      # numbers are the tests', not the job's. The queue's run uploads
      # nothing and keeps the lcov for main's (the codecov-main job).
      - name: Coverage to Codecov (web)
        if: ${{ !cancelled() && steps.units.outcome == 'success' && needs.changes.outputs.lane != 'queue' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/codecov
        with:
          file: target/js-cov/web.lcov
          flag: web
          token: ${{ secrets.CODECOV_TOKEN }}
      - if: ${{ !cancelled() && steps.units.outcome == 'success' && needs.changes.outputs.lane == 'queue' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: target/js-cov/web.lcov
          retention-days: 7
          if-no-files-found: ignore

  # The doctests, which nextest does not run. There are none today, and this
  # is what keeps that a fact rather than an assumption. A job of its own:
  # in Coverage's build it would lengthen Coverage's path by a compile. It
  # restores the test cache the Slow suite saves from main (slow-suite.yml)
  # and builds the libraries in test-fast, as `make test` does.
  doctests:
    name: Doctests
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_doctests != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - run: cargo test --doc --workspace --profile test-fast

  # The Rust tests: the fast tier, instrumented by cargo-llvm-cov, then each
  # crate's line and function coverage against its floor
  # (crates/coverage-baseline.json, which only rises) and every line the PR
  # adds or changes in crates/ that no test ran (scripts/coverage_gate.py;
  # docs/architecture/testing.md § Coverage). One job, as `make coverage`
  # runs it on a workstation: the build, the tests and the report on one
  # runner. A failing test fails it, so this is the Rust tests' gate as well
  # as coverage's: there is no separate uninstrumented run.
  #
  # The slow tests (the search floor, `refinement_improves_pool`, ~100 s alone,
  # and nine more that took over a minute when they were named, ~260 s of test
  # time between them) are named in the Makefile (SEARCH_FLOOR, SLOW_TESTS)
  # and run in the Slow suite.
  # This job runs everything NOT named there, so the two tiers are exact
  # complements by construction: a new or renamed test lands here rather than
  # in neither, and `--no-tests=fail` turns a filter that empties the tier
  # into a red run rather than a silently skipped gate. The build names its
  # targets (the Makefile's TEST_TARGETS), so the 34 examples, which no test
  # runs, are not compiled here; Lint's clippy --all-targets still compiles
  # them. `make test-fast-tier` runs the same tier uninstrumented, locally.
  #
  # One runner, not a build, three runners by slice and a report (#580):
  # each of those five jobs waited for a runner of its own, one after
  # another, and on a busy account that chain, not the tests, set the
  # queue's length. On the queue runs of Oct 18 to Nov 1 the three slices'
  # tests took 4.5 minutes between them (median; 5.3 at most) and the build
  # 1.9, so the job takes about seven, beside the browser runners' 7.4 (the
  # slowest of twelve, median), and starts when they do.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_coverage != 'true'
    runs-on: ubuntu-24.04
    # About seven minutes; a cold build (a new compiler or a bumped
    # dependency) adds a few. A hung test is stopped at ten minutes of its
    # own (.config/nextest.toml's ci profile), so after a cold build and the
    # other tests it is still reported inside this limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to be reachable to diff against it.
          fetch-depth: 0
      # llvm-tools only here, not in rust-toolchain.toml: every Rust job
      # installs from the file, and the component is 41 MB.
      - name: Install Rust (rust-toolchain.toml) and llvm-tools
        run: rustup toolchain install --no-self-update && rustup component add llvm-tools && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The version the Makefile's LLVM_COV_VERSION names (0.7 and later
      # instrument only the workspace's crates; 0.6 took thirteen times as long).
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1,nextest
      # The tests' profiles only; the gate below reads them.
      - run: make coverage-run
      # The report: the floors, the changed lines, and the HTML report (an
      # artifact). Its tables and every uncovered changed line, linked, are
      # in the run's summary.
      - run: >-
          make coverage-report
          BASE=origin/${{ github.base_ref || 'main' }}
          COV_MARKDOWN="$GITHUB_STEP_SUMMARY"
          COV_LINK="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}"
      # The queue's run keeps it for main's too, which uploads it to Codecov
      # when it reuses this verdict (the codecov-main job).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/llvm-cov/
          retention-days: 7
          if-no-files-found: ignore
      # The same lcov the gate read, uploaded even when the gate failed: the
      # tests passed (a failing one stops the job before the report), so the
      # numbers are true. Not from the queue's run.
      - name: Coverage to Codecov (rust)
        if: ${{ !cancelled() && needs.changes.outputs.lane != 'queue' && hashFiles('target/llvm-cov/lcov.info') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/codecov
        with:
          file: target/llvm-cov/lcov.info
          flag: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  # No separate wasm32 check: when Rust changed, the cache key of the
  # engine's steps in What changed (crates/**, Cargo.*, the Makefile) misses
  # and they run `make wasm`, a full wasm32 build under this workflow's
  # -Dwarnings (the Makefile's WASM_RUSTFLAGS adds to RUSTFLAGS rather than
  # replacing them), which is more than `cargo check` for the target. The one change that
  # reaches neither is a workflow-only edit, which cannot change what the
  # compiler sees.

  # The site is built and link-checked on every PR that can affect it, not only
  # on deploy.
  #
  # Its failure modes are invisible to every other job here: a KaTeX macro that
  # renders as "Undefined control sequence" (a build *warning*), a cross-section
  # link that only exists once four sections are assembled, a root-absolute path
  # that works at a domain root and 404s under a project subpath. All of those
  # would otherwise be found on the live site by a reader.
  #
  # The instrument at /play/ is the engine What changed built or restored,
  # downloaded, not a second one: the same bytes the browser tier tests.
  # Rust is still needed here for the API reference (`cargo doc`), which is
  # why this job is not in Playwright's image and the browser smoke test is
  # a job of its own (`smoke`, below).
  #
  # The site's sources are the Rust, the app and everything under www/ and
  # docs/, so it runs in the fast lane when any of them changed, and always
  # in the queue's run and on main.
  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pages_artifact: ${{ steps.pages-name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache the doc toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: doc-tools-${{ runner.os }}-mdbook${{ env.MDBOOK_VERSION }}-katex${{ env.MDBOOK_KATEX_VERSION }}-admonish${{ env.MDBOOK_ADMONISH_VERSION }}

      - name: Install the doc toolchain
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v mdbook >/dev/null; then
            curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          if ! command -v mdbook-admonish >/dev/null; then
            curl -sSfL "https://github.com/tommilligan/mdbook-admonish/releases/download/v${MDBOOK_ADMONISH_VERSION}/mdbook-admonish-v${MDBOOK_ADMONISH_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          if ! command -v mdbook-katex >/dev/null; then
            cargo install mdbook-katex --version "$MDBOOK_KATEX_VERSION" --locked --root ~/.local
          fi

      # Tee'd so the grep below can read it: mdbook-katex reports an undefined
      # macro as a WARNING and exits 0, so a book full of raw `\E[u_\theta]` would
      # otherwise build, deploy and be discovered by a reader.
      - name: Build the site
        run: |
          set -euo pipefail
          make site WASM_PREBUILT=1 2>&1 | tee /tmp/site-build.log

      - name: Fail on unrendered math
        run: |
          if grep -q 'Rendering failed' /tmp/site-build.log; then
            echo "::error::mdbook-katex could not render some math — see the build log above"
            grep 'Rendering failed' /tmp/site-build.log | head -20
            exit 1
          fi
          echo "all math rendered"

      - name: Check every link and asset resolves
        run: make site-check

      # What the deploy job publishes once `CI` is green: this build, the one
      # just checked. Last, so a red Site never kept one; named for the
      # attempt, because deploy-pages refuses a run holding two artifacts of
      # one name, which a re-run of this job would otherwise leave.
      - name: Keep the site for the deploy
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 7
      - if: steps.pages.outcome == 'success'
        id: pages-name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  # The browser smoke test: boot the instrument against the engine the site
  # ships and require a clean console, a registered worklet and an engine
  # that reaches `playable` (tests/web/smoke.spec.js); then provoke the
  # audit's four failure flows (an unparseable save, an engine error, a
  # refused vote, a profile import) and require each to be reported and
  # contained (tests/web/failure_flows.spec.js). The numeric audio assertions
  # CONTRIBUTING describes are still run by hand.
  #
  # In the fast lane only, when anything the browser reads changed other than
  # spec files alone: the app, the engine, or what runs the specs. It is the
  # one browser check such a PR is sure of when its specs can't be told
  # (main.js, a crate). The full browser tier, in the queue's run and on
  # main, runs these two specs itself, so the job doesn't run there.
  #
  # A job of its own, in Playwright's image like every browser job (no apt
  # step and no browser download: .github/actions/playwright says why),
  # because Site needs Rust and mdBook, which the image does not have. It runs
  # against apps/web and What changed's engine, the bytes /play/ is made
  # from, so it needs nothing Site built. It waits for Site all the same: it
  # then takes Site's place rather than a runner beside it, and a red Site
  # stops it, as it did when the two were one job. Whatever sets `smoke` also
  # sets `site`, so Site runs before it.
  smoke:
    name: Browser smoke
    needs: [changes, site]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-24.04
    # The tag is the lockfile's Playwright, read by What changed.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --ipc=host --init
    # The six tests take about a minute; at the config's 90 s each, all six
    # hung would take nine. AURACLE_GLOBAL_TIMEOUT_MIN is Playwright's global
    # timeout (tests/web/playwright.config.js), five minutes under the job's
    # limit for the setup (the image's pull, which only this limit bounds,
    # and npm ci, cut at three) and the upload, as on the browser tier's
    # runners. Playwright then stops the run itself and its traces are kept,
    # rather than the job being cancelled with none. Unlike those runners,
    # no shard.mjs interrupts it first, so a test still running at the limit
    # is reported as not run. The two numbers move together.
    timeout-minutes: 15
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      # `make smoke`'s two specs, from the one list both read:
      # tests/web/package.json's `smoke` script (the image has no make).
      - name: Boot the instrument in a browser and exercise its failure flows
        run: cd tests/web && npm run --silent smoke

      # Always, a cancelled or timed-out job's too: test-results/ holds a
      # failed test's trace and nothing when every test passed (the config
      # keeps traces on failure only), so a green run uploads nothing. Named
      # for the attempt, so a re-run's traces never collide with the first's.
      - name: Keep the trace of a failed boot
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: tests/web/test-results/
          if-no-files-found: ignore

  # The worker-protocol tests (tests/worker, `make worker-test`):
  # apps/web/worker.js run as it is in a Node worker thread over this run's
  # engine, with no page, for what it answers and in what order. About a
  # minute, once the engine is built. In the fast lane, on a change to
  # apps/web or tests/worker (their prose aside) or the engine: changed.mjs
  # picks no spec for worker.js (the smoke only), so this is the fast lane's
  # real check of it.
  # In the full gate, always; on main, not again when the queue's run passed
  # it on these files (the changes job). Its files run side by side and a
  # test fails at 150 s, so the slowest file (three tests) is reported within
  # eight minutes, before the job's limit.
  worker:
    name: Worker protocol
    needs: changes
    if: needs.changes.outputs.worker == 'true' && needs.changes.outputs.reuse_worker != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg
      # COVERAGE=1: what the tests ran of apps/web (worker.js and what it
      # loads, render-store.js, in its thread) as an lcov too
      # (target/js-cov/worker.lcov), for Codecov. The time is the engine's
      # wasm, which JavaScript coverage does not instrument.
      - run: make worker-test COVERAGE=1
      # Not from the queue's run, which keeps the lcov for main's (the
      # codecov-main job).
      - name: Coverage to Codecov (worker)
        if: needs.changes.outputs.lane != 'queue'
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/codecov
        with:
          file: target/js-cov/worker.lcov
          flag: worker
          token: ${{ secrets.CODECOV_TOKEN }}
      - if: needs.changes.outputs.lane == 'queue'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-worker
          path: target/js-cov/worker.lcov
          retention-days: 7
          if-no-files-found: ignore

  # The fast browser tier: every spec in tests/web not tagged @slow or
  # @quarantine, against the engine What changed built or restored; in a
  # PR's fast lane, only the specs the change reaches (the changes job).
  #
  # About 75 minutes of test time in one worker (main at 42bd322, 284 tests,
  # a fresh boot each). tests/web/shard.mjs deals them to twelve runners by
  # main's last timings, longest first, so each is planned at about 6
  # minutes: with Playwright's own split by count, five runners took from 9
  # to 19. Twelve, not eight: simulated with the runners' observed spread of
  # speeds, eight finish the tier in a median 13.1 minutes and twelve in 9.4
  # (#177 § 3.1). The count is fixed and raised by hand. The queue's run at
  # its widest holds 18 runners, in its first minutes (these twelve,
  # Coverage, Site, Worker protocol, Lint, Web and the Doctests), then 13
  # once the short ones are done; a PR's fast lane holds at most four
  # browser runners, thirteen in all (testing.md § CI tiers, Runners, does
  # the sums).
  #
  # A slow runner may make a test slower, never wrong (ADR-022). A failure
  # that only appears here is still a finding about the app when it is about
  # correctness (a race the app loses, a state it never reaches): it is
  # fixed, or quarantined, never retried (docs/architecture/testing.md
  # § Flakes). How long something took is not asserted here: a spec records
  # it as a budget (fixtures.js `budget`), the run's summary lists those over
  # their limit, and the nightly Speed budgets job (flake-hunt.yml) judges
  # them.
  browser:
    name: Browser (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.reuse_browser != 'true'
    runs-on: ubuntu-24.04
    # In Playwright's image, with Chromium and its system libraries in it: no
    # apt step and no browser download (#162). The tag is the lockfile's
    # Playwright, read by What changed; .github/actions/playwright says why
    # the image and why these options.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --ipc=host --init
    # The planned ~6 minutes and room. AURACLE_GLOBAL_TIMEOUT_MIN is
    # Playwright's global timeout (tests/web/playwright.config.js), five
    # minutes under the job's limit for the setup (the image's pull, which
    # only this limit bounds, and npm ci, cut at three) and the upload. A
    # minute before it, shard.mjs interrupts the run: a shard that runs long
    # or hangs reports the test that was running as interrupted, with its
    # trace, and its blob reaches the merged report, rather than the runner
    # being cancelled before it can say which. The two numbers move together.
    timeout-minutes: 20
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 15
    strategy:
      fail-fast: false
      matrix:
        # Twelve, or in a PR's fast lane one per spec file the change
        # reaches, up to four (the changes job).
        shard: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - uses: ./.github/actions/browser-shard
        with:
          tier: fast
          name: fast
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: --grep-invert "@slow|@quarantine"
          files: ${{ needs.changes.outputs.specs }}

  # A PR's burn-in (#456): the spec files it adds or edits, three times
  # each, in the fast lane only (the changes job). A new spec that passes
  # once and fails one run in three is the queue's most expensive flake: it
  # turns a batch red, and the PRs beside it in the batch wait on it. Here it
  # keeps only its own PR out of the queue. Its runners are sized by main's
  # times (the changes job, tests/web/burnin.mjs: about six minutes each, up
  # to three), and dealt by time as the tier is; in the `CI` check, like the Browser shards,
  # and a failure is fixed, never retried (testing.md § Flakes).
  burnin:
    name: Burn-in (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.burnin == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --ipc=host --init
    # The Browser job's limits, and why (above): burnin.mjs plans each runner
    # no more than seven minutes of tests, repeats included, as the Browser
    # job plans about six.
    timeout-minutes: 20
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.burnin_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - uses: ./.github/actions/browser-shard
        with:
          tier: fast
          name: burnin
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: --grep-invert "@slow|@quarantine" --repeat-each=3
          files: ${{ needs.changes.outputs.burnin_specs }}

  # The burn-in's runners as one report, as `CI`'s report step does for the
  # tier's; it folds no times (three runs of a few files say nothing about
  # the deal). Not part of the `CI` check.
  burnin-report:
    name: Burn-in report
    needs: [changes, burnin]
    if: ${{ !cancelled() && needs.burnin.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: burnin
          failed: ${{ needs.burnin.result == 'failure' }}

  # One check that means "CI is green", whatever ran.
  #
  # The jobs above are conditional, and a skipped job reports neither success nor
  # failure — so requiring them individually in a branch ruleset would wedge every
  # documentation PR forever. This is the job to require instead: it distinguishes
  # "skipped because the change could not affect it" from "did not pass".
  # In a PR's fast lane it is what puts the PR in the merge queue, with
  # `PR checks` (pr-checks.yml) and `Mutants in the changed code`
  # (mutants.yml); in the queue's run it is the full gate's answer, beside
  # `Full gate` (below), the check the queue merges on.
  #
  # It runs whatever the jobs above did, except in a run cancelled before
  # every one of them had ended (a newer push to the PR; a reset batch,
  # whose next run waits on this group for whatever this run still runs:
  # the concurrency comment above), whose answer nothing reads. A run
  # cancelled after they had all ended (a red batch, once the queue's next
  # draft PR starts its run) still runs it to its end: the records and the
  # report below describe finished jobs, so their steps are `always()`, and
  # carry on through a cancel that comes while they run. They come after
  # the answer, the records first, which take seconds. A job that hit its
  # own limit reads as cancelled too, in a run that was not, and is red
  # here, as before.
  ci:
    name: CI
    if: ${{ !cancelled() || !contains(needs.*.result, 'cancelled') }}
    # `Full gate`'s list too (below): the two answer from the same results.
    needs: [changes, lint, web, doctests, coverage, site, smoke, worker, browser, burnin]
    runs-on: ubuntu-24.04
    # The answer and the records take seconds; the browser runners' report
    # has five minutes of its own (below).
    timeout-minutes: 10
    steps:
      - name: Check the results
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "green"

      # What main reuses (the changes job's reuse step): the files this run
      # tested, as a git tree, and the jobs that passed on them. From the
      # queue's run only, the full gate: a PR's fast lane runs part of it.
      # A pull_request run tests the draft PR merged into main, GITHUB_SHA,
      # so this is that merge's tree, the tree main has once the queue has
      # squash-merged every PR of the batch. A record that cannot be written
      # costs main a re-run, never the queue its green: both steps carry on
      # past an error.
      - name: Record what passed on these files
        id: record
        if: needs.changes.outputs.lane == 'queue' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          SPECS: ${{ needs.changes.outputs.specs }}
          RUSTC: ${{ needs.lint.outputs.rustc }}
        run: |
          set -euo pipefail
          # The tree it tested, and the main it tested it on (the merge's
          # first parent), from which main's run sees what the batch changed.
          IFS=$'\t' read -r tree base <<<"$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" -q '[.tree.sha, .parents[0].sha] | @tsv')"
          browser="$(jq -r .browser.result <<<"$RESULTS")"
          if [ "$browser" = success ]; then
            if [ -n "$SPECS" ]; then browser=partial; else browser=full; fi
          fi
          jq -n --arg tree "$tree" --arg base "$base" --arg run "$GITHUB_RUN_ID" --arg browser "$browser" --arg rustc "$RUSTC" --argjson r "$RESULTS" \
            '{tree: $tree, base: $base, run: $run, rustc: $rustc, ran: {lint: $r.lint.result, web: $r.web.result, doctests: $r.doctests.result, coverage: $r.coverage.result, site: $r.site.result, worker: $r.worker.result, browser: $browser}}' \
            > verified.json
          cat verified.json
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - if: steps.record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-tree-${{ steps.record.outputs.tree }}
          path: verified.json
          retention-days: 14

      # A record of each class of job that passed in full on these inputs
      # (#581), named by its key (What changed's keys step): Lint, the
      # Doctests and Coverage (`rust`); the whole browser tier, all twelve
      # runners and not a fast lane's few specs (`browser`); Worker protocol
      # (`worker`); Web (`web`); Site (`site`); and all of them (`tree`).
      # From a PR's own run and the queue's, from this repository; what a
      # class's jobs passed on byte-identical inputs is what a later run of
      # them would answer, but for a flake. The queue's run looks them up
      # and, for now, only says which it would reuse (What changed's lookup
      # step). Like the record above, one that cannot be written costs a
      # later run a reuse, never this one its green.
      - name: Record each class that passed on these inputs
        id: records
        if: ${{ always() && (needs.changes.outputs.lane == 'fast' || needs.changes.outputs.lane == 'queue') && needs.changes.outputs.keys != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
          KEYS: ${{ needs.changes.outputs.keys }}
          SPECS: ${{ needs.changes.outputs.specs }}
          LANE: ${{ needs.changes.outputs.lane }}
        run: |
          set -euo pipefail
          passed() {
            for j in "$@"; do [ "$(jq -r --arg j "$j" '.[$j].result' <<<"$RESULTS")" = success ] || return 1; done
          }
          ok=""
          if passed lint doctests coverage; then ok="$ok rust"; fi
          if passed browser && [ -z "$SPECS" ]; then ok="$ok browser"; fi
          if passed worker; then ok="$ok worker"; fi
          if passed web; then ok="$ok web"; fi
          if passed site; then ok="$ok site"; fi
          if [ "$ok" = " rust browser worker web site" ]; then ok="$ok tree"; fi
          mkdir -p records
          for class in $ok; do
            key="$(jq -r --arg c "$class" '.[$c] // empty' <<<"$KEYS")"
            [ -n "$key" ] || continue
            jq -n --arg class "$class" --arg key "$key" --arg run "$GITHUB_RUN_ID" --arg lane "$LANE" --arg sha "$GITHUB_SHA" \
              '{class: $class, key: $key, run: $run, lane: $lane, sha: $sha}' > "records/$class.json"
            echo "$class=$key" >> "$GITHUB_OUTPUT"
            echo "recorded $class (key ${key:0:12})"
          done
      - if: ${{ always() && steps.records.outputs.rust != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-record-rust-${{ steps.records.outputs.rust }}
          path: records/rust.json
          retention-days: 14
      - if: ${{ always() && steps.records.outputs.browser != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-record-browser-${{ steps.records.outputs.browser }}
          path: records/browser.json
          retention-days: 14
      - if: ${{ always() && steps.records.outputs.worker != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-record-worker-${{ steps.records.outputs.worker }}
          path: records/worker.json
          retention-days: 14
      - if: ${{ always() && steps.records.outputs.web != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-record-web-${{ steps.records.outputs.web }}
          path: records/web.json
          retention-days: 14
      - if: ${{ always() && steps.records.outputs.site != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-record-site-${{ steps.records.outputs.site }}
          path: records/site.json
          retention-days: 14
      - if: ${{ always() && steps.records.outputs.tree != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-record-tree-${{ steps.records.outputs.tree }}
          path: records/tree.json
          retention-days: 14

      # The dry run's other half (#581): beside each class the queue would
      # have reused, what its jobs did here. A class it would have reused
      # that went red here is what reuse would have hidden. Kept as
      # `reuse-dry-run` too, for the diff over a wave's batches.
      - name: What the dry run would have reused, and what ran
        if: ${{ always() && needs.changes.outputs.lane == 'queue' }}
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
          WOULD: ${{ needs.changes.outputs.would_reuse }}
          KEYS: ${{ needs.changes.outputs.keys }}
          SPECS: ${{ needs.changes.outputs.specs }}
        run: |
          set -euo pipefail
          r() { jq -r --arg j "$1" '.[$j].result' <<<"$RESULTS"; }
          # A class's answer here: success when each of its jobs passed,
          # else the first that did not.
          ran() {
            for j in "$@"; do
              x="$(r "$j")"
              [ "$x" = success ] || { echo "$j: $x"; return; }
            done
            echo success
          }
          here() {
            case "$1" in
              rust) ran lint doctests coverage ;;
              browser) if [ -n "$SPECS" ]; then echo partial; else ran browser; fi ;;
              tree) ran lint doctests coverage browser worker web site ;;
              *) ran "$1" ;;
            esac
          }
          out='{}'
          {
            echo "### What the dry run would have reused, and what ran"
            echo
            echo "| Class | Would reuse | Ran here |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          would="${WOULD:-}"
          [ -n "$would" ] || would='{}'
          for class in rust browser worker web site tree; do
            rec="$(jq -r --arg c "$class" '.[$c] // empty' <<<"$would")"
            if [ -n "$rec" ]; then shown="[run $rec]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$rec)"; else shown="no"; fi
            got="$(here "$class")"
            echo "| $class | $shown | $got |" >> "$GITHUB_STEP_SUMMARY"
            out="$(jq -c --arg c "$class" --arg rec "$rec" --arg ran "$got" '. + {($c): {record: $rec, ran: $ran}}' <<<"$out")"
          done
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson keys "${KEYS:-null}" --argjson classes "$out" \
            '{run: $run, sha: $sha, keys: $keys, classes: $classes}' > reuse-dry-run.json
          cat reuse-dry-run.json
      - if: ${{ always() && needs.changes.outputs.lane == 'queue' && hashFiles('reuse-dry-run.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reuse-dry-run
          path: reuse-dry-run.json
          retention-days: 30

      # The browser runners' reports as one: an HTML report of every test,
      # with the traces of what failed, uploaded when a runner failed (the
      # run's summary links it), the speed budgets recorded over their limit
      # listed in the summary (ADR-022), and the times folded into the
      # timings the next run deals by: on main, saved; in the queue's run,
      # kept for main's run to save once it reuses this one (the changes
      # job). A fast lane's few specs fold nothing.
      #
      # Steps here, not a job of its own, so the queue's answer waits for one
      # runner after the browser runners, not two (#580). It reports on the
      # answer and is not one: whatever happens to it (npm's registry slow,
      # a download failed), `CI` says what the results above said, as it
      # did when the report was a job beside it. Each step carries on past
      # an error, and the report has a limit of its own inside the job's.
      - id: checkout
        if: ${{ always() && needs.browser.result != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The browser runners' report
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/browser-report
        with:
          name: fast
          failed: ${{ needs.browser.result == 'failure' }}
          timings: ${{ (github.ref == 'refs/heads/main' || needs.changes.outputs.lane == 'queue') && 'fast' || '' }}

  # The check the merge queue merges on (.mergify.yml's merge_conditions):
  # green when this is the queue's run and every job `CI` needs passed. It
  # is a check of its own, not `CI`, because Mergify takes a queue whose
  # merge conditions match its queue conditions for a one-step queue, and
  # then merges a PR already on main's tip on the PR's own run, with no
  # draft PR: the fast lane would be the gate again. A PR's own run skips
  # it, so a skipped `Full gate` on a PR is expected.
  #
  # Beside `CI`, not after it (#580): the two need the same jobs and read
  # the same results, so the queue's run waits for at most three runners in
  # a row (What changed, the jobs that test, then these two at once) rather
  # than four. Mergify waits for `CI` on the draft PR as well: main's ruleset
  # requires it, and Mergify adds what the ruleset requires to the merge
  # conditions (`branch_protection_injection_mode`, at its default). So a
  # batch merges only once `CI` has also kept the run's browser times and
  # written its record, which main's run then reads (the changes job). Were
  # the ruleset to stop requiring `CI`, a merge could come before them, and
  # main's run would then run what it would have reused and deal by older
  # times: slower, never a wrong answer.
  #
  # A job, not a check run `CI` posts through the Checks API as its last
  # step, which would spare its runner, and on a red batch would end with
  # `CI` rather than before its report, so the next batch's run would not
  # wait on this one's `CI` (the concurrency comment above). GitHub lets the
  # run's token create a check run (it is the GitHub Actions app's), but
  # neither GitHub nor Mergify says that Mergify reads one so made as
  # `@github-actions/Full gate`, and were it not read, every batch would
  # wait out the queue's 45-minute checks_timeout. Until one PR has shown
  # that it is read, a job, which is read, as it has been since ADR-023.
  #
  # Its `if` reads the branch, not What changed's lane, so a What changed
  # that failed gives a red `Full gate` beside the red `CI`, not a skipped
  # one: the check the queue merges on says what happened (the queue leaves
  # on `CI`'s red either way). Never in a cancelled run, not even a red
  # batch's, as `CI` is: nothing reads it there, and it would hold the next
  # run back.
  # The prefix is .mergify.yml's queue_branch_prefix, as in the changes job
  # and the concurrency group.
  full-gate:
    name: Full gate
    needs: [changes, lint, web, doctests, coverage, site, smoke, worker, browser, burnin]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The queue's run passed the full gate
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job of the full gate did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "green"

  # The site, published from this run's build once `CI` is green: four
  # sections under one origin (/ the landing page, /play/ the instrument,
  # /docs/ the guide, /reference/ the technical reference with /reference/api/
  # rustdoc). Every asset path is relative, so it runs unchanged at the root
  # of its custom domain (auracle.alexnodeland.com, set in Settings → Pages)
  # or under a project subpath; `make site-check` enforces that.
  #
  # From main only: the github-pages environment permits deployments from
  # `main`, and the site tracks its tip, as the README promises. A release tag
  # is cut from a green main that has therefore already deployed
  # (CONTRIBUTING.md § Cutting a release). A red run deploys nothing; the last
  # green one stays live.
  #
  # `!cancelled()` because a run on main that reuses the queue's verdict skips
  # most of the jobs `ci` needs, and a job with no status function in its `if`
  # is skipped whenever any job upstream of it was, however far up: without it
  # every such run built the site and never deployed it. `ci`'s own result is
  # the verdict on those skips.
  deploy:
    name: Deploy to Pages
    needs: [ci, site]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.ci.result == 'success' && needs.site.result == 'success' && needs.site.outputs.pages_artifact != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, in order: a slow one is never cancelled by the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.site.outputs.pages_artifact }}

  # Codecov keeps coverage by commit, and a run on main that reuses the
  # queue's verdict runs none of Coverage, Web and Worker protocol, whose
  # steps upload it: main would have no report, and a PR's comment no base to
  # compare with. The queue's run kept its lcovs, measured on these exact
  # files (the `coverage-report`, `coverage-web` and `coverage-worker`
  # artifacts), so each reused job's is uploaded here, as this commit's. A
  # job not reused runs on main and uploads its own. (`reuse_run` is set on a
  # push to main only, by the changes job's reuse step.)
  #
  # A job of its own, which neither `CI` nor the deploy needs. Codecov, or a
  # host its action calls, can hold a connection open without answering, and
  # nothing in the action cuts that short but its step's limit; a step's
  # limit counts against its job's. Here a stall costs Codecov this commit's
  # report, and holds main's run open for up to this job's limit (a push
  # meanwhile waits for it: `queue: single`), never `CI`'s answer or the
  # deploy. The job's limit covers the download's and the three uploads',
  # and `continue-on-error` keeps a failure here off the run's conclusion,
  # which the README's CI badge shows.
  codecov-main:
    name: Codecov from the queue's run
    needs: changes
    if: needs.changes.outputs.reuse_run != '' && (needs.changes.outputs.reuse_coverage == 'true' || needs.changes.outputs.reuse_web == 'true' || needs.changes.outputs.reuse_worker == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    # actions: read, to download the queue run's artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      # The local action, and the files Codecov maps the lcovs' paths onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each lcov the queue's run kept, for each job main reused; an upload
      # runs only for an lcov that came down.
      - id: download
        name: The queue run's coverage
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ needs.changes.outputs.reuse_run }}
          RUST: ${{ needs.changes.outputs.reuse_coverage }}
          WEB: ${{ needs.changes.outputs.reuse_web }}
          WORKER: ${{ needs.changes.outputs.reuse_worker }}
        run: |
          get() {
            if gh run download "$RUN" --repo "$REPO" -n "$2" -D "$3"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "no $2 from run $RUN"
            fi
          }
          if [ "$RUST" = true ]; then get rust coverage-report target/llvm-cov; fi
          if [ "$WEB" = true ]; then get web coverage-web target/js-cov; fi
          if [ "$WORKER" = true ]; then get worker coverage-worker target/js-cov; fi
      - name: Coverage to Codecov (rust)
        if: steps.download.outputs.rust == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/codecov
        with:
          file: target/llvm-cov/lcov.info
          flag: rust
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Coverage to Codecov (web)
        if: steps.download.outputs.web == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/codecov
        with:
          file: target/js-cov/web.lcov
          flag: web
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Coverage to Codecov (worker)
        if: steps.download.outputs.worker == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/codecov
        with:
          file: target/js-cov/worker.lcov
          flag: worker
          token: ${{ secrets.CODECOV_TOKEN }}

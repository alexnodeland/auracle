name: CI

# The FAST tier: every test fast enough to gate a merge on. The tests too
# slow for that (the search floor, the other Rust tests over a minute, the
# browser specs tagged @slow, and any tagged @quarantine while a flake is
# fixed) run in the Slow suite workflow (slow-suite.yml): on main, nightly,
# and on a PR that carries the `full-ci` label. Each test runs in exactly one
# tier; docs/architecture/testing.md § CI tiers lists which and why.
#
# Two lanes, one workflow (ADR-023); the `changes` job picks the lane.
#
# - A PR's own run is the FAST LANE: Lint, the Rust tests (as Coverage) and
#   the Doctests when Rust changed; Web and Site when the site, the docs or
#   the app did (Web alone for a script's own tests); Browser smoke when the
#   app, the engine or what runs the specs did; Worker protocol when the
#   app, the engine or tests/worker did; and the browser specs the change
#   reaches (tests/web/changed.mjs), on up to four runners. A change whose
#   specs can't be told (main.js, worker.js, a crate) runs the smoke only,
#   with Worker protocol beside it, and a change to CI itself runs the full
#   gate. About five minutes
#   for docs; up to about ten when Rust changed (Coverage sets the length,
#   about nine, an estimate) or an app module's specs run (patch.js reaches
#   about 23 test-minutes, on four runners). A green fast lane, with the PR's
#   `PR checks` (pr-checks.yml), puts the PR in the merge queue. It is not
#   the whole gate.
# - The merge queue's run (Mergify's draft PR, from a branch under
#   mergify/merge-queue/: .mergify.yml) is the FULL GATE, about twelve
#   minutes: everything, as on main, the browser tier on twelve runners. It
#   tests the tree that lands, up to three queued PRs at once (a release PR
#   alone), and its `Full gate` job is the check the queue merges on.
#
# The branch ruleset requires one check, `CI`, in both lanes. The browser
# shards are inside it; the Slow suite is not.
#
# On main the jobs the queue's run passed on these exact files are not run
# again (the `changes` job says which), and the site deploys from this run's
# own build once `CI` is green (the `deploy` job).
#
# Every job in every workflow runs on `ubuntu-24.04`, not `ubuntu-latest`:
# the label's move to a new image is its own PR, with a Flake hunt run, not a
# change that lands under whichever PR happens to be in CI that day. The jobs
# that run a browser run on it in Playwright's image, pinned to the version
# tests/web/package-lock.json locks (.github/actions/playwright).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run for that PR obsolete, so stop it
# rather than paying for two answers to the same question. On main, the
# latest push only: a run in progress is not cancelled, and of the pushes
# that arrive meanwhile only the newest waits (`queue: single`, which
# replaces a waiting run with a newer one). A batch from the merge queue
# lands as two or three merges seconds apart, and the newest one's tree is
# the tree the queue tested, so that is the run worth having; it covers
# everything before it. A run that finds main already moved past its commit
# runs nothing (the changes job). A run on main reuses the queue's verdict
# on the same files, so the runs are short.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: single

# Read the code, nothing else: no job here writes to the repository. The
# Actions cache and artifacts use the runner's own token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Release-profile builds ignore it, but leaving it on has cargo write
  # incremental state into target/ that then bloats every cache upload.
  CARGO_INCREMENTAL: 0
  # A blipped crates.io fetch should not cost a whole rerun.
  CARGO_NET_RETRY: 10
  # Keep in sync with the Makefile. mdBook stays on 0.4: mdbook-katex and
  # mdbook-admonish at these versions build against its preprocessor API.
  MDBOOK_VERSION: 0.4.52
  MDBOOK_KATEX_VERSION: 0.9.4
  MDBOOK_ADMONISH_VERSION: 1.20.0

jobs:
  # Which lane is this run, and what does the change reach?
  #
  # The lane comes from the event and the branch (the header says what each
  # runs). A queue run, a push and a run by hand run everything: main is what
  # the site deploys from and what releases are cut from, and the queue's run
  # is the verdict main reuses, so neither is ever partly verified. Only a
  # PR's fast lane is narrowed, by the paths it changed.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read, to find and download the queue run's record (the reuse
    # step) and its browser times.
    permissions:
      contents: read
      actions: read
    outputs:
      lane: ${{ steps.filter.outputs.lane }}
      rust: ${{ steps.filter.outputs.rust }}
      site: ${{ steps.filter.outputs.site }}
      web: ${{ steps.filter.outputs.web }}
      smoke: ${{ steps.filter.outputs.smoke }}
      worker: ${{ steps.filter.outputs.worker }}
      browser: ${{ steps.filter.outputs.browser }}
      specs: ${{ steps.filter.outputs.specs }}
      browser_matrix: ${{ steps.filter.outputs.browser_matrix }}
      reuse_lint: ${{ steps.reuse.outputs.lint }}
      reuse_web: ${{ steps.reuse.outputs.web }}
      reuse_worker: ${{ steps.reuse.outputs.worker }}
      reuse_doctests: ${{ steps.reuse.outputs.doctests }}
      reuse_coverage: ${{ steps.reuse.outputs.coverage }}
      reuse_browser: ${{ steps.reuse.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to be reachable to diff against it.
          fetch-depth: 0

      - id: filter
        name: Pick the lane and classify the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          twelve='["1/12","2/12","3/12","4/12","5/12","6/12","7/12","8/12","9/12","10/12","11/12","12/12"]'
          # Every lane writes every output. The browser job's matrix is read
          # even when the job is skipped, and an empty one is an error.
          full() {
            {
              echo "rust=true"
              echo "site=true"
              echo "web=true"
              echo "browser=true"
              echo "smoke=false"
              echo "worker=true"
              echo "specs="
              echo "browser_matrix=$twelve"
            } >> "$GITHUB_OUTPUT"
          }

          # The queue's draft PRs come from branches under Mergify's prefix
          # (.mergify.yml's queue_branch_prefix, its default). Any other
          # pull_request run is a PR's own.
          lane=full
          if [ "$EVENT" = pull_request ]; then
            case "$HEAD_REF" in
              mergify/merge-queue/*) lane=queue ;;
              *) lane=fast ;;
            esac
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

          if [ "$lane" != fast ]; then
            # On main, latest only: a batch lands as two or three merges
            # seconds apart, and only the last one's files are the files the
            # queue tested. A run whose commit main has already moved past
            # runs nothing; the run of the newest push, which the concurrency
            # queue always keeps, tests these changes with the ones after
            # them. "Moved past" is main being ahead of this commit, which
            # it then contains, not merely elsewhere. An answer the API
            # can't give is no reason to skip: run everything.
            if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              read -r status tip <<<"$(gh api "repos/$REPO/compare/$GITHUB_SHA...main" -q '"\(.status) \(.commits[-1].sha // "")"' || true)"
              if [ "${status:-}" = ahead ] && [ -n "${tip:-}" ]; then
                echo "superseded: main is at ${tip:0:12} now, and that push's run tests this one's changes with it"
                {
                  echo "rust=false"
                  echo "site=false"
                  echo "web=false"
                  echo "browser=false"
                  echo "smoke=false"
                  echo "worker=false"
                  echo "specs="
                  echo "browser_matrix=$twelve"
                  echo "superseded=true"
                } >> "$GITHUB_OUTPUT"
                {
                  echo "### Superseded"
                  echo
                  echo "main moved on to \`${tip:0:12}\` before this run began, so nothing here runs: that push's run tests these changes with the ones after them, and deploys."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "$lane: running everything"
            full
            exit 0
          fi

          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"
          echo "$files" | awk '{ print "  " $0 }'

          # A change to CI itself runs the full gate here too: a workflow or
          # an action the queue would trip on proves itself before it
          # reaches the queue, where it would hold up a batch.
          if echo "$files" | grep -qE '^\.github/(workflows|actions)/'; then
            echo "a change to CI itself: the full gate, as the queue runs it"
            full
            exit 0
          fi

          # Anything that can change what the compiler sees or how CI builds.
          # The Makefile is in here deliberately: it defines every build, so a
          # change to it is treated as touching everything. So are the
          # coverage gate's own scripts, which only the Coverage jobs run on
          # real numbers (their tests run in Web's dev-check), and setup.sh:
          # a change to either used to reach no job at all. Only those:
          # another script under scripts/ is no reason to run the Rust.
          if echo "$files" | grep -qE '^(crates/|Cargo\.(toml|lock)$|Makefile$|rust-toolchain|scripts/(coverage_gate|test_coverage_gate)\.py$|scripts/setup\.sh$)'; then
            rust=true
          else
            rust=false
          fi

          # The site embeds the wasm engine and rustdoc for every crate, so a
          # Rust change is also a site change. The agent docs, the Claude
          # Code setup and the engineering record are checked in the web job
          # (make dev-check), so they count too, and so do the app and its
          # specs, whose smoke test runs after Site.
          if [ "$rust" = true ] || echo "$files" | grep -qE '^(www/|apps/web/|tests/web/|docs/|\.claude/)|(^|/)(AGENTS|CLAUDE)\.md$'; then
            site=true
          else
            site=false
          fi

          # Web (make web-check, make dev-check) checks all of the above, and
          # the scripts' own tests too (scripts/*.py: the changelog's
          # assembler, the coverage gate, each with its tests; and the
          # operator's scripts in scripts/ops/, with their tests and the
          # check of the saved workflows), which reach no other job. A changelog entry (changelog.d/) reaches none: the
          # entries' check and the voice run in this job, on every PR, and
          # the site doesn't read them.
          if [ "$site" = true ] || echo "$files" | grep -qE '^scripts/([^/]+\.py$|ops/)'; then
            web=true
          else
            web=false
          fi

          # What the browser reads: the app, its specs and what runs them,
          # and the engine. Their prose aside, and what Web runs and no
          # browser reads: the specs' lint (its config, its suppressions, its
          # own tests), CI's flake routing (flakes.mjs and its tests) and the
          # timings fold's tests. A change to them alone, or beside spec
          # files, runs what a spec-only change runs.
          reach="$(echo "$files" | grep -E '^(apps/web/|tests/web/|crates/|Cargo\.(toml|lock)$|Makefile$|rust-toolchain)' | grep -vE '\.md$' | grep -vE '^tests/web/(eslint\.config\.mjs|eslint-suppressions\.json|eslint\.test\.mjs|suppressions\.mjs|flakes(\.test)?\.mjs|shard\.test\.mjs)$' || true)"

          # Browser smoke: anything the browser reads changed, other than
          # spec files alone (a spec runs against main's app, and runs
          # itself below).
          smoke=false
          if [ -n "$reach" ] && echo "$reach" | grep -qvE '^tests/web/[^/]+\.spec\.js$'; then
            smoke=true
          fi

          # Worker protocol: worker.js (in apps/web), the engine it runs
          # over, or the tests themselves, their prose aside. changed.mjs
          # picks no spec for worker.js, so this is the fast lane's check of it.
          wreach="$(echo "$files" | grep -E '^(apps/web/|tests/worker/)' | grep -vE '\.md$' || true)"
          if [ "$rust" = true ] || [ -n "$wreach" ]; then
            worker=true
          else
            worker=false
          fi

          # The specs the change reaches, as `make browser-changed` picks
          # them (tests/web/changed.mjs): a changed spec, the specs that
          # require a changed helper, the specs named for a changed app
          # module. main.js, worker.js, index.html, style.css, the config and
          # the engine reach every level and select nothing, and say so
          # below. More than twenty files (a helper nearly every spec
          # requires, or that many specs changed at once) is the tier in all
          # but name: the smoke pair runs here instead, whatever changed, and
          # the queue runs them all. One runner per spec file, at most four,
          # dealt by time like the full tier.
          browser=false
          specs=""
          n=1
          if [ -n "$reach" ]; then
            sel="$(cd tests/web && node changed.mjs "origin/$BASE_REF")" || { echo "changed.mjs could not say: smoke only"; sel=""; }
            count="$(echo "$sel" | grep -c . || true)"
            if [ "$count" -gt 20 ]; then
              echo "the change reaches $count spec files: the smoke pair here, and the queue runs them all"
              smoke=true
            elif [ "$count" -gt 0 ]; then
              browser=true
              # Anchored at a path separator, as shard.mjs does, so a spec's
              # name never also selects another file ending in it.
              specs="$(echo "$sel" | sed 's#^#/#' | paste -sd' ' -)"
              n="$count"
              [ "$n" -gt 4 ] && n=4
            fi
          fi
          matrix="[$(seq 1 "$n" | sed "s#.*#\"&/$n\"#" | paste -sd, -)]"

          {
            echo "rust=$rust"
            echo "site=$site"
            echo "web=$web"
            echo "smoke=$smoke"
            echo "worker=$worker"
            echo "browser=$browser"
            echo "specs=$specs"
            echo "browser_matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          printf '\n  rust=%s site=%s web=%s smoke=%s worker=%s browser=%s\n  specs=%s\n  browser runners=%s\n' "$rust" "$site" "$web" "$smoke" "$worker" "$browser" "${specs:-none}" "$matrix"

      # A push to main is a squash merge by the merge queue. The last merge
      # of a batch has exactly the files the queue's run tested (a
      # pull_request run tests the draft PR merged into main), and that run
      # left a record of the jobs it passed on them (the `ci` job). Those
      # jobs are not run again: same files, same answer, and one more chance
      # to flake for nothing. Everything runs when no record matches (a merge
      # by hand, outside the queue), on a manual run, and when the record is
      # missing or expired. Only a queue run's record counts: a PR's fast
      # lane runs part of the gate, and leaves none.
      # Any error here (the API, a download, a record it cannot read) means no
      # reuse, not a red run: the jobs then simply run.
      - id: reuse
        name: Reuse the queue's verdict on the same files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.filter.outputs.superseded != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "files: tree $tree"
          art="$(gh api "repos/$REPO/actions/artifacts?name=verified-tree-$tree&per_page=10" \
            -q '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')"
          if [ -z "$art" ]; then
            echo "no queue run verified these exact files; running everything"; exit 0
          fi
          # Only a pull_request run of this workflow from the queue's branch
          # in this repository: a fork's run executes the fork's copy of the
          # workflow, and a PR's own run is the fast lane.
          IFS=$'\t' read -r event path head branch <<<"$(gh api "repos/$REPO/actions/runs/$art" \
            -q '[.event, .path, .head_repository.full_name, .head_branch] | @tsv')"
          if [ "$event" != pull_request ] || [ "$path" != .github/workflows/ci.yml ] || [ "$head" != "$REPO" ] || [ "${branch#mergify/merge-queue/}" = "$branch" ]; then
            echo "the record is from run $art ($event, $path, $head, $branch), which does not count; running everything"; exit 0
          fi
          gh run download "$art" --repo "$REPO" -n "verified-tree-$tree" -D verified
          cat verified/verified.json
          # Lint, the Rust tests and their coverage, and the doctests hold for
          # the compiler they ran on: reused only while rust-toolchain.toml
          # pins that release. The record keeps what `rustc --version` prints
          # after "rustc", so its first word is the release ("1.99.0
          # (b940084d7 2026-09-28)").
          pinned="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          recorded="$(jq -r '.rustc // ""' verified/verified.json)"
          echo "rustc: recorded '$recorded', pinned '$pinned'"
          # Lint and Coverage run here anyway after a batch that changed
          # rust-toolchain.toml or Cargo.lock, for their caches, which these
          # jobs save from main only. rust-cache keys a cache by the rustc
          # release and the lockfile: reused, nothing would save under a new
          # release's key, and both jobs would build cold on every run after;
          # nothing would save a bumped dependency either, which every run
          # after would build again. (The test cache is the Slow suite's to
          # save.) The batch is everything since main's tip when the queue
          # tested it (the record's `base`; the push's `before` for a record
          # without one). A diff that can't be read runs them too.
          since="$(jq -r '.base // empty' verified/verified.json)"
          since="${since:-$BEFORE}"
          fresh=""
          if ! git diff --quiet "$since" HEAD -- rust-toolchain.toml Cargo.lock; then
            echo "rust-toolchain.toml or Cargo.lock changed since ${since:0:12} (or the diff failed): Lint and Coverage run, to save their caches"
            fresh=" lint coverage "
          fi
          # Web and Worker protocol hold whatever compiler Lint ran on: Web
          # compiles nothing, and Worker protocol's engine is built from
          # these files, rust-toolchain.toml included.
          reused=""
          for job in lint web doctests coverage worker; do
            r="$(jq -r ".ran.$job" verified/verified.json)"
            if [ "$job" != web ] && [ "$job" != worker ] && { [ -z "$pinned" ] || [ "${recorded%% *}" != "$pinned" ]; }; then continue; fi
            case "$fresh" in *" $job "*) continue ;; esac
            if [ "$r" = success ]; then echo "$job=true" >> "$GITHUB_OUTPUT"; reused="$reused, $job"; fi
          done
          if [ "$(jq -r .ran.browser verified/verified.json)" = full ]; then echo "browser=true" >> "$GITHUB_OUTPUT"; reused="$reused, browser"; fi
          echo "run=$art" >> "$GITHUB_OUTPUT"
          {
            echo "### Reused from the merge queue"
            echo
            echo "Queue run [$art]($GITHUB_SERVER_URL/$REPO/actions/runs/$art) passed these jobs on these exact files (tree \`${tree:0:12}\`), and they are not run again: ${reused#, }."
          } >> "$GITHUB_STEP_SUMMARY"

      # The queue run's browser times, folded into main's timings by its
      # Browser report job, saved here for the next run's deal: a cache
      # saved by a pull_request run is that PR's alone, and main never runs
      # the tier itself when it reuses the queue's verdict. Without this, the
      # timings would stop at the last tier main ran. An error costs the next
      # run its balance, never this run its answer.
      - id: times
        name: Keep the queue run's browser times
        if: steps.reuse.outputs.browser == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ steps.reuse.outputs.run }}
        run: gh run download "$RUN" --repo "$REPO" -n browser-timings-folded-fast -D tests/web
      - if: steps.times.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/web/timings-fast.json
          key: browser-timings-fast-${{ github.run_id }}-${{ github.run_attempt }}

      # The voice check (www/brand/voice.md) reads the README and the
      # changelog as well as the site and the app, and a PR that touches only
      # those skips the web job's `make dev-check`. It takes a second, so it
      # runs here, on every PR.
      - name: The voice (www/checkwords.py)
        run: python3 www/checkwords.py

      # A change's changelog entry waits in changelog.d/ until a release
      # moves it into CHANGELOG.md (scripts/changelog.py). A PR whose entry
      # sits beside only a README change skips the web job, and so does one
      # that changes only the assembler, so the entries' shape and the
      # assembler's own tests are checked here, on every PR, in about three
      # seconds.
      - name: The changelog's entries and assembler (scripts/changelog.py)
        run: |
          python3 scripts/changelog.py --check
          python3 scripts/test_changelog.py

  # Formatting and lints share a job: `cargo fmt --check` needs no dependency
  # graph and finishes in seconds, so giving it its own runner spent more on
  # scheduling overhead than on the work. It runs first, before clippy pays for
  # a compile, so a stray tab still fails in seconds.
  lint:
    name: Lint
    needs: changes
    # The compiler that judged these files, for main's reuse record: a lint or
    # test verdict holds for the toolchain it ran on.
    outputs:
      rustc: ${{ steps.rustc.outputs.version }}
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_lint != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every Rust job builds with the one compiler rust-toolchain.toml pins,
      # as `make` does locally: given no toolchain, rustup installs the file's,
      # with its components and the wasm32 target (rustup 1.28 and later; the
      # runner image has 1.29.1). Not dtolnay/rust-toolchain, which does not
      # read the file. A new stable then changes nothing here until a PR
      # bumps the file.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The web app has no build step and no type system, so the only thing that
  # stands between a typo and a blank instrument is `node --check` — and one
  # failure mode nothing else catches at all: a backtick inside the worklet's
  # PROCESSOR template literal, which leaves a blob that silently never
  # registers (CONTRIBUTING § Sharp edges). Its own job rather than a step in
  # `lint`, because `lint` is gated on Rust having changed and a JS-only PR is
  # exactly the PR this check exists for. It also runs `make dev-check`, whose
  # film tools' tests need numpy and scipy (installed below), with no Rust
  # toolchain. dev-check's parts run side by side on the runner's four cores
  # (`-j4`, each part's output kept together by `-O`); the tokens check's own
  # tests run their cases one process per core, about 9 s on a runner's four.
  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.reuse_web != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its parents: the specs' lint compares
          # tests/web/eslint-suppressions.json with HEAD^1's, the branch a
          # PR's merge commit goes onto (main's previous commit on a push).
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The film tools' own tests need numpy and scipy for the mix (the rest
      # of dev-check is the standard library). Only those two, pinned as
      # www/video/requirements-tools.txt pins them: about half a minute,
      # where the voice's whole set would take minutes.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: grep -E '^(numpy|scipy)==' www/video/requirements-tools.txt | xargs python3 -m pip install --quiet
      # The specs' lint (in web-check) and its hook's test (in dev-check) run
      # tests/web's locked ESLint. npm is cut at three minutes, as in
      # .github/actions/playwright.
      - run: |
          cd tests/web
          timeout -k 10 180 npm ci --no-audit --no-fund || {
            s=$?
            if [ "$s" = 124 ] || [ "$s" = 137 ]; then
              echo "::error::npm ci took over three minutes: the npm registry (registry.npmjs.org) is slow or unreachable from this runner, not the change. Re-run the job."
            fi
            exit "$s"
          }
      - run: make web-check BASE=HEAD^1
      - run: make -j4 -O dev-check

  # The doctests, which nextest does not run. There are none today, and this
  # is what keeps that a fact rather than an assumption. A job of its own:
  # in Coverage's build it would lengthen Coverage's path by a compile. It
  # restores the test cache the Slow suite saves from main (slow-suite.yml)
  # and builds the libraries in test-fast, as `make test` does.
  doctests:
    name: Doctests
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_doctests != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false
      - run: cargo test --doc --workspace --profile test-fast

  # The Rust tests: the fast tier, instrumented by cargo-llvm-cov, then each
  # crate's line and function coverage against its floor
  # (crates/coverage-baseline.json, which only rises) and every line the PR
  # adds or changes in crates/ that no test ran (scripts/coverage_gate.py;
  # docs/architecture/testing.md § Coverage). Three jobs, the way
  # cargo-llvm-cov merges runs made on several machines: one build into a
  # nextest archive, three runners that each run a slice of it and keep
  # their profiles, and one report that reads them all against the archive.
  # A failing test fails its Coverage runner, so these are the Rust tests'
  # gate as well as coverage's: there is no separate uninstrumented run.
  #
  # The slow tests (the search floor, `refinement_improves_pool`, ~330 s alone,
  # and ten more over a minute each, ~1030 s of test time between them) are
  # named in the Makefile (SEARCH_FLOOR, SLOW_TESTS) and run in the Slow suite.
  # These jobs run everything NOT named there, so the two tiers are exact
  # complements by construction: a new or renamed test lands here rather than
  # in neither, and `--no-tests=fail` turns a filter that empties a slice into
  # a red run rather than a silently skipped gate. By `slice`, which deals the
  # filtered list out in turn, each runner gets a third of the tests. The
  # build names its targets (the Makefile's TEST_TARGETS), so the 34
  # examples, which no test runs, are not compiled here; Lint's clippy
  # --all-targets still compiles them. `make test-fast-tier` runs the same
  # tier uninstrumented, locally.
  #
  # Instrumented, the tier takes about 1.2 times its plain time (measured
  # locally, Oct 5: 1,257 test-seconds against 1,029), so about 2,700
  # test-seconds here, about twelve minutes on one runner. On three, with
  # the build and the report around them, about nine (an estimate until a
  # run measures it), inside the browser tier's path in the queue's run.
  #
  # The three jobs agree on paths because every runner checks the repository
  # out at the same place: the archive's binaries, the profiles and the
  # report all name /home/runner/work/auracle/auracle, so no job passes
  # --workspace-remap. A job that checked out elsewhere would need it.
  coverage-build:
    name: Coverage build
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_coverage != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # llvm-tools only here, not in rust-toolchain.toml: every Rust job
      # installs from the file, and the component is 41 MB.
      - name: Install Rust (rust-toolchain.toml) and llvm-tools
        run: rustup toolchain install --no-self-update && rustup component add llvm-tools && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The version the Makefile's LLVM_COV_VERSION names (0.7 and later
      # instrument only the workspace's crates; 0.6 took thirteen times as long).
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov@0.9.1,nextest
      - run: make coverage-archive COV_ARCHIVE=coverage.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-archive
          path: coverage.tar.zst
          retention-days: 3
          if-no-files-found: error
          # Already zstd.
          compression-level: 0

  coverage:
    name: Coverage (${{ matrix.partition }})
    needs: [changes, coverage-build]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_coverage != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml) and llvm-tools
        run: rustup toolchain install --no-self-update && rustup component add llvm-tools && rustc --version
      # Nothing is compiled here, and nothing is fetched: the archive holds
      # the binaries and the metadata nextest needs (no Rust cache either).
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov@0.9.1,nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-archive
      - run: make coverage-run COV_ARCHIVE=coverage.tar.zst NEXTEST_ARGS='--partition slice:${{ matrix.partition }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profiles-${{ strategy.job-index }}
          path: target/llvm-cov-target/*.profraw
          retention-days: 3
          if-no-files-found: error

  # The report: the floors, the changed lines, and the HTML report (an
  # artifact). Its tables and every uncovered changed line, linked, are in
  # the run's summary.
  coverage-report:
    name: Coverage
    needs: [changes, coverage]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_coverage != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to be reachable to diff against it.
          fetch-depth: 0
      # llvm-profdata and llvm-cov come from the pinned compiler's
      # llvm-tools, so they read what that compiler wrote. Nothing is compiled.
      - name: Install Rust (rust-toolchain.toml) and llvm-tools
        run: rustup toolchain install --no-self-update && rustup component add llvm-tools && rustc --version
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov@0.9.1,nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-profiles-*
          path: profiles
      # The binaries where `report --nextest-archive-file` reads them, and
      # every runner's profiles beside them. A profile is named for its
      # process id, which two runners can share, so each keeps its runner's
      # artifact name in front.
      - name: Gather the binaries and the runners' profiles
        run: |
          set -euo pipefail
          mkdir -p target/llvm-cov-target
          tar --zstd -xf coverage.tar.zst -C target/llvm-cov-target
          for dir in profiles/*/; do
            run="$(basename "$dir")"
            for f in "$dir"*.profraw; do mv "$f" "target/llvm-cov-target/$run-$(basename "$f")"; done
          done
          echo "$(find target/llvm-cov-target -maxdepth 1 -name '*.profraw' | wc -l) profiles from $(find profiles -mindepth 1 -maxdepth 1 -type d | wc -l) runners"
      - run: >-
          make coverage-report COV_ARCHIVE=coverage.tar.zst
          BASE=origin/${{ github.base_ref || 'main' }}
          COV_MARKDOWN="$GITHUB_STEP_SUMMARY"
          COV_LINK="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/llvm-cov/
          retention-days: 7
          if-no-files-found: ignore

  # No separate wasm32 check: when Rust changed, the cache key of the engine
  # job below (crates/**, Cargo.*, the Makefile) misses and it runs
  # `make wasm`, a full wasm32 build under this workflow's -Dwarnings (the
  # Makefile's WASM_RUSTFLAGS adds to RUSTFLAGS rather than replacing them),
  # which is more than `cargo check` for the target. The one change that
  # reaches neither is a workflow-only edit, which cannot change what the
  # compiler sees.

  # The site is built and link-checked on every PR that can affect it, not only
  # on deploy.
  #
  # Its failure modes are invisible to every other job here: a KaTeX macro that
  # renders as "Undefined control sequence" (a build *warning*), a cross-section
  # link that only exists once four sections are assembled, a root-absolute path
  # that works at a domain root and 404s under a project subpath. All of those
  # would otherwise be found on the live site by a reader.
  #
  # The instrument at /play/ is the engine job's build, downloaded, not a
  # second one: the same bytes the browser tier tests. Rust is still needed
  # here for the API reference (`cargo doc`), which is why this job is not in
  # Playwright's image and the browser smoke test is a job of its own
  # (`smoke`, below).
  #
  # The site's sources are the Rust, the app and everything under www/ and
  # docs/, so it runs in the fast lane when any of them changed, and always
  # in the queue's run and on main.
  site:
    name: Site
    needs: [changes, engine]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pages_artifact: ${{ steps.pages-name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache the doc toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: doc-tools-${{ runner.os }}-mdbook${{ env.MDBOOK_VERSION }}-katex${{ env.MDBOOK_KATEX_VERSION }}-admonish${{ env.MDBOOK_ADMONISH_VERSION }}

      - name: Install the doc toolchain
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v mdbook >/dev/null; then
            curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          if ! command -v mdbook-admonish >/dev/null; then
            curl -sSfL "https://github.com/tommilligan/mdbook-admonish/releases/download/v${MDBOOK_ADMONISH_VERSION}/mdbook-admonish-v${MDBOOK_ADMONISH_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          if ! command -v mdbook-katex >/dev/null; then
            cargo install mdbook-katex --version "$MDBOOK_KATEX_VERSION" --locked --root ~/.local
          fi

      # Tee'd so the grep below can read it: mdbook-katex reports an undefined
      # macro as a WARNING and exits 0, so a book full of raw `\E[u_\theta]` would
      # otherwise build, deploy and be discovered by a reader.
      - name: Build the site
        run: |
          set -euo pipefail
          make site WASM_PREBUILT=1 2>&1 | tee /tmp/site-build.log

      - name: Fail on unrendered math
        run: |
          if grep -q 'Rendering failed' /tmp/site-build.log; then
            echo "::error::mdbook-katex could not render some math — see the build log above"
            grep 'Rendering failed' /tmp/site-build.log | head -20
            exit 1
          fi
          echo "all math rendered"

      - name: Check every link and asset resolves
        run: make site-check

      # What the deploy job publishes once `CI` is green: this build, the one
      # just checked. Last, so a red Site never kept one; named for the
      # attempt, because deploy-pages refuses a run holding two artifacts of
      # one name, which a re-run of this job would otherwise leave.
      - name: Keep the site for the deploy
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 7
      - if: steps.pages.outcome == 'success'
        id: pages-name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  # The browser smoke test: boot the instrument against the engine the site
  # ships and require a clean console, a registered worklet and an engine
  # that reaches `playable` (tests/web/smoke.spec.js); then provoke the
  # audit's four failure flows (an unparseable save, an engine error, a
  # refused vote, a profile import) and require each to be reported and
  # contained (tests/web/failure_flows.spec.js). The numeric audio assertions
  # CONTRIBUTING describes are still run by hand.
  #
  # In the fast lane only, when anything the browser reads changed other than
  # spec files alone: the app, the engine, or what runs the specs. It is the
  # one browser check such a PR is sure of when its specs can't be told
  # (main.js, a crate). The full browser tier, in the queue's run and on
  # main, runs these two specs itself, so the job doesn't run there.
  #
  # A job of its own, in Playwright's image like every browser job (no apt
  # step and no browser download: .github/actions/playwright says why),
  # because Site needs Rust and mdBook, which the image does not have. It runs
  # against apps/web and the engine job's build, the bytes /play/ is made
  # from, so it needs nothing Site built. It waits for Site all the same: it
  # then takes Site's place rather than a runner beside it, and a red Site
  # stops it, as it did when the two were one job. Whatever sets `smoke` also
  # sets `site`, so Site runs before it.
  smoke:
    name: Browser smoke
    needs: [changes, engine, site]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-24.04
    # The tag is the lockfile's Playwright, read by the engine job.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    # The six tests take about a minute; at the config's 90 s each, all six
    # hung would take nine. AURACLE_GLOBAL_TIMEOUT_MIN is Playwright's global
    # timeout (tests/web/playwright.config.js), five minutes under the job's
    # limit for the setup (the image's pull, which only this limit bounds,
    # and npm ci, cut at three) and the upload, as on the browser tier's
    # runners. Playwright then stops the run itself and its traces are kept,
    # rather than the job being cancelled with none. Unlike those runners,
    # no shard.mjs interrupts it first, so a test still running at the limit
    # is reported as not run. The two numbers move together.
    timeout-minutes: 15
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      # `make smoke`'s two specs, from the one list both read:
      # tests/web/package.json's `smoke` script (the image has no make).
      - name: Boot the instrument in a browser and exercise its failure flows
        run: cd tests/web && npm run --silent smoke

      # Always, a cancelled or timed-out job's too: test-results/ holds a
      # failed test's trace and nothing when every test passed (the config
      # keeps traces on failure only), so a green run uploads nothing. Named
      # for the attempt, so a re-run's traces never collide with the first's.
      - name: Keep the trace of a failed boot
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: tests/web/test-results/
          if-no-files-found: ignore

  # The worker-protocol tests (tests/worker, `make worker-test`):
  # apps/web/worker.js run as it is in a Node worker thread over this run's
  # engine, with no page, for what it answers and in what order. About a
  # minute, once the engine is built. In the fast lane, on a change to
  # apps/web or tests/worker (their prose aside) or the engine: changed.mjs
  # picks no spec for worker.js (the smoke only), so this is the fast lane's
  # real check of it.
  # In the full gate, always; on main, not again when the queue's run passed
  # it on these files (the changes job). Its files run side by side and a
  # test fails at 150 s, so the slowest file (three tests) is reported within
  # eight minutes, before the job's limit.
  worker:
    name: Worker protocol
    needs: [changes, engine]
    if: needs.changes.outputs.worker == 'true' && needs.changes.outputs.reuse_worker != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg
      - run: make worker-test

  # The engine for the fast browser tier and Worker protocol, built once per
  # run (see the action's comment): restored from the cache when no crate
  # changed, which is most PRs that touch the app, and ~1.5 min of wasm build
  # otherwise.
  #
  # It also reads main's browser timings once for the whole run (see the
  # action): every browser runner deals its tests from that one file. And it
  # reads the Playwright version tests/web/package-lock.json locks, the tag
  # of the image every browser job here runs in (the browser tier and the
  # Browser smoke), so a bump of @playwright/test moves the image with it.
  engine:
    name: Engine for the browser
    needs: changes
    if: needs.changes.outputs.site == 'true' || needs.changes.outputs.browser == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: playwright
        uses: ./.github/actions/playwright-version
      - uses: ./.github/actions/web-engine
      - if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.reuse_browser != 'true'
        uses: ./.github/actions/browser-timings
        with:
          tier: fast

  # The fast browser tier: every spec in tests/web not tagged @slow or
  # @quarantine, against the engine built above; in a PR's fast lane, only
  # the specs the change reaches (the changes job).
  #
  # About 75 minutes of test time in one worker (main at 42bd322, 284 tests,
  # a fresh boot each). tests/web/shard.mjs deals them to twelve runners by
  # main's last timings, longest first, so each is planned at about 6
  # minutes: with Playwright's own split by count, five runners took from 9
  # to 19. Twelve, not eight: simulated with the runners' observed spread of
  # speeds, eight finish the tier in a median 13.1 minutes and twelve in 9.4
  # (#177 § 3.1). The count is fixed and raised by hand. The queue's run at
  # its widest holds about 18 runners (these twelve, Site, Worker protocol,
  # Coverage's three, and one more); a PR's fast lane holds at most four
  # browser runners, twelve in all (testing.md § CI tiers, Runners, does
  # the sums).
  #
  # A slow runner may make a test slower, never wrong (ADR-022). A failure
  # that only appears here is still a finding about the app when it is about
  # correctness (a race the app loses, a state it never reaches): it is
  # fixed, or quarantined, never retried (docs/architecture/testing.md
  # § Flakes). How long something took is not asserted here: a spec records
  # it as a budget (fixtures.js `budget`), the run's summary lists those over
  # their limit, and the nightly Speed budgets job (flake-hunt.yml) judges
  # them.
  browser:
    name: Browser (${{ matrix.shard }})
    needs: [changes, engine]
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.reuse_browser != 'true'
    runs-on: ubuntu-24.04
    # In Playwright's image, with Chromium and its system libraries in it: no
    # apt step and no browser download (#162). The tag is the lockfile's
    # Playwright, read by the engine job; .github/actions/playwright says why
    # the image and why these options.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    # The planned ~6 minutes and room. AURACLE_GLOBAL_TIMEOUT_MIN is
    # Playwright's global timeout (tests/web/playwright.config.js), five
    # minutes under the job's limit for the setup (the image's pull, which
    # only this limit bounds, and npm ci, cut at three) and the upload. A
    # minute before it, shard.mjs interrupts the run: a shard that runs long
    # or hangs reports the test that was running as interrupted, with its
    # trace, and its blob reaches the merged report, rather than the runner
    # being cancelled before it can say which. The two numbers move together.
    timeout-minutes: 20
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 15
    strategy:
      fail-fast: false
      matrix:
        # Twelve, or in a PR's fast lane one per spec file the change
        # reaches, up to four (the changes job).
        shard: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - uses: ./.github/actions/browser-shard
        with:
          tier: fast
          name: fast
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: --grep-invert "@slow|@quarantine"
          files: ${{ needs.changes.outputs.specs }}

  # The runners' reports as one: an HTML report of every test, with the traces
  # of what failed, uploaded when a runner failed (the run's summary links
  # it), the speed budgets recorded over their limit listed in the summary
  # (ADR-022), and the times folded into the timings the next run deals by:
  # on main, saved; in the queue's run, kept for main's run to save once it
  # reuses this one (the changes job). A fast lane's few specs fold nothing.
  # Not part of the `CI` check: it reports on the answer, it is not one.
  report:
    name: Browser report
    needs: [changes, browser]
    if: ${{ !cancelled() && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: fast
          failed: ${{ needs.browser.result == 'failure' }}
          timings: ${{ (github.ref == 'refs/heads/main' || needs.changes.outputs.lane == 'queue') && 'fast' || '' }}

  # One check that means "CI is green", whatever ran.
  #
  # The jobs above are conditional, and a skipped job reports neither success nor
  # failure — so requiring them individually in a branch ruleset would wedge every
  # documentation PR forever. This is the job to require instead: it distinguishes
  # "skipped because the change could not affect it" from "did not pass".
  # In a PR's fast lane it is what puts the PR in the merge queue, with
  # `PR checks` (pr-checks.yml); in the queue's run it is the full gate's
  # answer (and `Full gate`, below, the check the queue merges on).
  ci:
    name: CI
    if: always()
    needs: [changes, lint, web, doctests, coverage-build, coverage, coverage-report, site, smoke, worker, engine, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "green"

      # What main reuses (the changes job's reuse step): the files this run
      # tested, as a git tree, and the jobs that passed on them. From the
      # queue's run only, the full gate: a PR's fast lane runs part of it.
      # A pull_request run tests the draft PR merged into main, GITHUB_SHA,
      # so this is that merge's tree, the tree main has once the queue has
      # squash-merged every PR of the batch. A record that cannot be written
      # costs main a re-run, never the queue its green: both steps carry on
      # past an error.
      - name: Record what passed on these files
        id: record
        if: needs.changes.outputs.lane == 'queue' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          SPECS: ${{ needs.changes.outputs.specs }}
          RUSTC: ${{ needs.lint.outputs.rustc }}
        run: |
          set -euo pipefail
          # The tree it tested, and the main it tested it on (the merge's
          # first parent), from which main's run sees what the batch changed.
          IFS=$'\t' read -r tree base <<<"$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" -q '[.tree.sha, .parents[0].sha] | @tsv')"
          browser="$(jq -r .browser.result <<<"$RESULTS")"
          if [ "$browser" = success ]; then
            if [ -n "$SPECS" ]; then browser=partial; else browser=full; fi
          fi
          jq -n --arg tree "$tree" --arg base "$base" --arg run "$GITHUB_RUN_ID" --arg browser "$browser" --arg rustc "$RUSTC" --argjson r "$RESULTS" \
            '{tree: $tree, base: $base, run: $run, rustc: $rustc, ran: {lint: $r.lint.result, web: $r.web.result, doctests: $r.doctests.result, coverage: $r["coverage-report"].result, site: $r.site.result, worker: $r.worker.result, browser: $browser}}' \
            > verified.json
          cat verified.json
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - if: steps.record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-tree-${{ steps.record.outputs.tree }}
          path: verified.json
          retention-days: 14

  # The check the merge queue merges on (.mergify.yml's merge_conditions):
  # green when this is the queue's run and `CI` is green. It is a check of
  # its own, not `CI`, because Mergify takes a queue whose merge conditions
  # match its queue conditions for a one-step queue, and then merges a PR
  # already on main's tip on the PR's own run, with no draft PR: the fast
  # lane would be the gate again. A PR's own run skips it, so a skipped
  # `Full gate` on a PR is expected.
  #
  # It also waits for the Browser report, which keeps the run's browser times
  # for main's run to save (the changes job): the queue merges once this is
  # green, and main's run then finds them there.
  full-gate:
    name: Full gate
    needs: [changes, ci, report]
    if: always() && needs.changes.outputs.lane == 'queue'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The queue's run passed the full gate
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          echo "CI: $CI_RESULT"
          test "$CI_RESULT" = success

  # The site, published from this run's build once `CI` is green: four
  # sections under one origin (/ the landing page, /play/ the instrument,
  # /docs/ the guide, /reference/ the technical reference with /reference/api/
  # rustdoc). Every asset path is relative, so it runs unchanged at the root
  # of its custom domain (auracle.alexnodeland.com, set in Settings → Pages)
  # or under a project subpath; `make site-check` enforces that.
  #
  # From main only: the github-pages environment permits deployments from
  # `main`, and the site tracks its tip, as the README promises. A release tag
  # is cut from a green main that has therefore already deployed
  # (CONTRIBUTING.md § Cutting a release). A red run deploys nothing; the last
  # green one stays live.
  deploy:
    name: Deploy to Pages
    needs: [ci, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.ci.result == 'success' && needs.site.outputs.pages_artifact != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, in order: a slow one is never cancelled by the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.site.outputs.pages_artifact }}

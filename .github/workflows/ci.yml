name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Path deps expect sibling checkouts (../quiver,
# ../fugue-ecosystem/{fugue,fugue-evo}); every job clones them alongside the
# workspace, mirroring fugue-evo's own CI.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sibling path dependencies
        run: |
          git clone --depth 1 https://github.com/alexnodeland/quiver.git "$GITHUB_WORKSPACE/../quiver"
          mkdir -p "$GITHUB_WORKSPACE/../fugue-ecosystem"
          git clone --depth 1 https://github.com/alexnodeland/fugue.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue"
          git clone --depth 1 https://github.com/alexnodeland/fugue-evo.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue-evo"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sibling path dependencies
        run: |
          git clone --depth 1 https://github.com/alexnodeland/quiver.git "$GITHUB_WORKSPACE/../quiver"
          mkdir -p "$GITHUB_WORKSPACE/../fugue-ecosystem"
          git clone --depth 1 https://github.com/alexnodeland/fugue.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue"
          git clone --depth 1 https://github.com/alexnodeland/fugue-evo.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue-evo"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sibling path dependencies
        run: |
          git clone --depth 1 https://github.com/alexnodeland/quiver.git "$GITHUB_WORKSPACE/../quiver"
          mkdir -p "$GITHUB_WORKSPACE/../fugue-ecosystem"
          git clone --depth 1 https://github.com/alexnodeland/fugue.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue"
          git clone --depth 1 https://github.com/alexnodeland/fugue-evo.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue-evo"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release mode: the grammar/features/session tests render real audio
      # sample-by-sample; debug-mode DSP is ~20× slower.
      - run: cargo test --workspace --release

  wasm:
    name: Wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sibling path dependencies
        run: |
          git clone --depth 1 https://github.com/alexnodeland/quiver.git "$GITHUB_WORKSPACE/../quiver"
          mkdir -p "$GITHUB_WORKSPACE/../fugue-ecosystem"
          git clone --depth 1 https://github.com/alexnodeland/fugue.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue"
          git clone --depth 1 https://github.com/alexnodeland/fugue-evo.git "$GITHUB_WORKSPACE/../fugue-ecosystem/fugue-evo"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ricercar-wasm --target wasm32-unknown-unknown --release

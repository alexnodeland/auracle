name: CI

# The FAST tier: what a PR must pass to merge, about ten minutes of wall time
# (the browser tier's eight runners set it). The tests too slow for that (the
# search floor, the other Rust tests over a minute, the browser specs tagged
# @slow, and any tagged @quarantine while a flake is fixed) run in the Slow
# suite workflow (slow-suite.yml): on main, nightly, and on a PR that touches
# what they cover or carries the `full-ci` label. Each test runs in exactly one
# tier; docs/architecture/testing.md § CI tiers lists which and why.
#
# The branch ruleset requires one check, `CI`. The fast browser shards are
# inside it; the Slow suite is not.
#
# On main a job the merged PR already passed on these exact files is not run
# again (the `changes` job says which), and the site deploys from this run's
# own build once `CI` is green (the `deploy` job).
#
# Every job in every workflow runs on `ubuntu-24.04`, not `ubuntu-latest`:
# the label's move to a new image is its own PR, with a Flake hunt run, not a
# change that lands under whichever PR happens to be in CI that day.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run for that PR obsolete, so stop it
# rather than paying for two answers to the same question. A run on main is
# not cancelled by the next push: it finishes, and the next waits. (GitHub
# keeps one waiting run per group, so of three merges inside one run's length
# the middle one is skipped, and the newest run covers its files.) With the
# merged PR's jobs reused (the changes job), main's runs are short.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read the code, nothing else: no job here writes to the repository. The
# Actions cache and artifacts use the runner's own token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Release-profile builds ignore it, but leaving it on has cargo write
  # incremental state into target/ that then bloats every cache upload.
  CARGO_INCREMENTAL: 0
  # A blipped crates.io fetch should not cost a whole rerun.
  CARGO_NET_RETRY: 10
  # Keep in sync with the Makefile. mdBook stays on 0.4: mdbook-katex and
  # mdbook-admonish at these versions build against its preprocessor API.
  MDBOOK_VERSION: 0.4.52
  MDBOOK_KATEX_VERSION: 0.9.4
  MDBOOK_ADMONISH_VERSION: 1.20.0

jobs:
  # Which halves of the tree does this change actually reach?
  #
  # Most PRs in this repo are documentation, brand and site copy — the same
  # observation search-health.yml makes about where a PR budget goes. Compiling
  # the workspace and re-running a 16-seed MH walk to land a paragraph is pure
  # waste, so the Rust jobs are gated on Rust actually having changed.
  #
  # Narrowing happens on `pull_request` ONLY. Pushes to `main` and manual runs
  # always run everything: `main` is what the site deploys from and what
  # releases are cut from, so it is never allowed to be partially verified.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read, to find and download a merged PR's record (the reuse step).
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      site: ${{ steps.filter.outputs.site }}
      browser: ${{ steps.filter.outputs.browser }}
      specs: ${{ steps.filter.outputs.specs }}
      browser_matrix: ${{ steps.filter.outputs.browser_matrix }}
      reuse_lint: ${{ steps.reuse.outputs.lint }}
      reuse_web: ${{ steps.reuse.outputs.web }}
      reuse_test: ${{ steps.reuse.outputs.test }}
      reuse_browser: ${{ steps.reuse.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to be reachable to diff against it.
          fetch-depth: 0

      - id: filter
        name: Classify the changed paths
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — running everything"
            {
              echo "rust=true"
              echo "site=true"
              echo "browser=true"
              echo 'browser_matrix=["1/8","2/8","3/8","4/8","5/8","6/8","7/8","8/8"]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"
          echo "$files" | awk '{ print "  " $0 }'

          # Anything that can change what the compiler sees or how CI runs.
          # The Makefile and the workflows are in here deliberately: they define
          # every build, so a change to one is treated as touching everything.
          if echo "$files" | grep -qE '^(crates/|Cargo\.(toml|lock)$|Makefile$|rust-toolchain|\.github/(workflows|actions)/)'; then
            rust=true
          else
            rust=false
          fi

          # The site embeds the wasm engine and rustdoc for every crate, so a
          # Rust change is also a site change. The browser smoke test runs in
          # the site job, so its own sources count as site changes too.
          # The agent docs, the Claude Code setup and the engineering record
          # are checked in the web job (make dev-check), so they count too.
          if [ "$rust" = true ] || echo "$files" | grep -qE '^(www/|apps/web/|tests/web/|docs/|\.claude/)|(^|/)(AGENTS|CLAUDE)\.md$'; then
            site=true
          else
            site=false
          fi

          # The fast browser tier: the app, its specs, and the engine it runs.
          if [ "$rust" = true ] || echo "$files" | grep -qE '^(apps/web/|tests/web/)'; then
            browser=true
          else
            browser=false
          fi

          # A PR whose only change the browser tier can see is to spec files
          # runs those specs and nothing else: no other spec's code changed,
          # and the app it runs against is main's. A change to a spec's
          # helpers, the config or anything else the tier reads runs it all.
          # On main every run is the whole tier.
          specs=""
          reach="$(echo "$files" | grep -E '^(apps/web/|tests/web/|crates/|Cargo\.(toml|lock)$|Makefile$|rust-toolchain|\.github/(workflows|actions)/)' | grep -vE '^tests/web/[^/]+\.md$' || true)"
          if [ "$browser" = true ] && [ -n "$reach" ] && ! echo "$reach" | grep -qvE '^tests/web/[^/]+\.spec\.js$'; then
            # Anchored at a path separator, as shard.mjs does, so a spec's
            # name never also selects another file ending in it.
            for f in $reach; do [ -f "$f" ] && specs="$specs /${f#tests/web/}"; done
          fi
          specs="${specs# }"
          n=8
          if [ -n "$specs" ]; then
            n=$(echo "$specs" | wc -w | tr -d " ")
            [ "$n" -gt 8 ] && n=8
          fi
          matrix="[$(seq 1 "$n" | sed "s#.*#\"&/$n\"#" | paste -sd, -)]"

          {
            echo "rust=$rust"
            echo "site=$site"
            echo "browser=$browser"
            echo "specs=$specs"
            echo "browser_matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          printf '\n  rust=%s site=%s browser=%s\n  specs=%s\n  browser runners=%s\n' "$rust" "$site" "$browser" "${specs:-all}" "$matrix"

      # A push to main is a squash merge. When the PR was up to date with main,
      # the merge's files are exactly the files the PR's run tested (a
      # pull_request run tests the PR merged into main), and that run left a
      # record of the jobs it passed on them (the `ci` job). Those jobs are not
      # run again: same files, same answer, and one more chance to flake for
      # nothing. A job the PR skipped or ran in part (a spec-only PR's browser
      # tier) runs here as before, and so does everything when the files
      # differ (main moved on after the PR's run), on a manual run, and when
      # the record is missing or expired.
      # Any error here (the API, a download, a record it cannot read) means no
      # reuse, not a red run: the jobs then simply run.
      - id: reuse
        name: Reuse the merged PR's verdict on the same files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "files: tree $tree"
          art="$(gh api "repos/$REPO/actions/artifacts?name=verified-tree-$tree&per_page=10" \
            -q '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')"
          if [ -z "$art" ]; then
            echo "no PR run verified these exact files; running everything"; exit 0
          fi
          # Only a pull_request run of this workflow, from a branch of this
          # repository: a fork's run executes the fork's copy of the workflow.
          read -r event path head <<<"$(gh api "repos/$REPO/actions/runs/$art" \
            -q '[.event, .path, .head_repository.full_name] | @tsv')"
          if [ "$event" != pull_request ] || [ "$path" != .github/workflows/ci.yml ] || [ "$head" != "$REPO" ]; then
            echo "the record is from run $art ($event, $path, $head), which does not count; running everything"; exit 0
          fi
          gh run download "$art" --repo "$REPO" -n "verified-tree-$tree" -D verified
          cat verified/verified.json
          # Lint and the Rust tests hold for the compiler they ran on: reused
          # only while rust-toolchain.toml pins that release. The record
          # keeps what `rustc --version` prints after "rustc", so its first
          # word is the release ("1.99.0 (b940084d7 2026-09-28)").
          pinned="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          recorded="$(jq -r '.rustc // ""' verified/verified.json)"
          echo "rustc: recorded '$recorded', pinned '$pinned'"
          for job in lint web test; do
            r="$(jq -r ".ran.$job" verified/verified.json)"
            if [ "$job" != web ] && { [ -z "$pinned" ] || [ "${recorded%% *}" != "$pinned" ]; }; then continue; fi
            if [ "$r" = success ]; then echo "$job=true" >> "$GITHUB_OUTPUT"; fi
          done
          [ "$(jq -r .ran.browser verified/verified.json)" = full ] && echo "browser=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Reused from the merged PR"
            echo
            echo "PR run [$art]($GITHUB_SERVER_URL/$REPO/actions/runs/$art) passed these jobs on these exact files (tree \`${tree:0:12}\`): $(jq -r '[.ran | to_entries[] | select(.value == "success" or .value == "full") | .key] | join(", ")' verified/verified.json). They are not run again."
          } >> "$GITHUB_STEP_SUMMARY"

      # The voice check (www/brand/voice.md) reads the README and the
      # changelog as well as the site and the app, and a PR that touches only
      # those skips the web job's `make dev-check`. It takes a second, so it
      # runs here, on every PR.
      - name: The voice (www/checkwords.py)
        run: python3 www/checkwords.py

  # Formatting and lints share a job: `cargo fmt --check` needs no dependency
  # graph and finishes in seconds, so giving it its own runner spent more on
  # scheduling overhead than on the work. It runs first, before clippy pays for
  # a compile, so a stray tab still fails in seconds.
  lint:
    name: Lint
    needs: changes
    # The compiler that judged these files, for main's reuse record: a lint or
    # test verdict holds for the toolchain it ran on.
    outputs:
      rustc: ${{ steps.rustc.outputs.version }}
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_lint != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every Rust job builds with the one compiler rust-toolchain.toml pins,
      # as `make` does locally: given no toolchain, rustup installs the file's,
      # with its components and the wasm32 target (rustup 1.28 and later; the
      # runner image has 1.29.1). Not dtolnay/rust-toolchain, which does not
      # read the file. A new stable then changes nothing here until a PR
      # bumps the file.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The web app has no build step and no type system, so the only thing that
  # stands between a typo and a blank instrument is `node --check` — and one
  # failure mode nothing else catches at all: a backtick inside the worklet's
  # PROCESSOR template literal, which leaves a blob that silently never
  # registers (CONTRIBUTING § Sharp edges). Its own job rather than a step in
  # `lint`, because `lint` is gated on Rust having changed and a JS-only PR is
  # exactly the PR this check exists for. It also runs `make dev-check`, whose
  # film tools' tests need numpy and scipy (installed below), with no Rust
  # toolchain. dev-check's parts run side by side on the runner's four cores
  # (`-j4`, each part's output kept together by `-O`); the longest, the tokens
  # check's own tests, sets its time, about a minute.
  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.site == 'true' && needs.changes.outputs.reuse_web != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The film tools' own tests need numpy and scipy for the mix (the rest
      # of dev-check is the standard library). Only those two, pinned as
      # www/video/requirements-tools.txt pins them: about half a minute,
      # where the voice's whole set would take minutes.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: grep -E '^(numpy|scipy)==' www/video/requirements-tools.txt | xargs python3 -m pip install --quiet
      - run: make web-check
      - run: make -j4 -O dev-check

  # The fast tier of the Rust tests, split across two runners.
  #
  # The slow tests (the search floor, `refinement_improves_pool`, ~330 s alone,
  # and ten more over a minute each, ~1030 s of test time between them) are
  # named in the Makefile (SEARCH_FLOOR, SLOW_TESTS) and run in the Slow suite.
  # This job runs everything NOT named there, so the two tiers are exact
  # complements by construction: a new or renamed test lands here rather than
  # in neither, and `--no-tests=fail` turns a filter that empties a shard into
  # a red run rather than a silently skipped gate.
  #
  # What is left, 262 tests, is ~1120 s of test time that nextest runs about
  # 3.7 wide on a 4-core runner; split in two by hash, each runner takes ~2.5 min
  # of tests after its ~2 min compile, instead of one runner taking ~5.
  #
  # nextest rather than `cargo test` for the filtering and the partitioning,
  # and because it pools every test binary into one scheduler; `cargo test`
  # runs the five binaries strictly one after another.
  test:
    name: Test (${{ matrix.partition }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse_test != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One shard failing should not hide the other shard's result.
      fail-fast: false
      matrix:
        partition: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      # One cache for every test job, here and in slow-suite.yml, saved from
      # main by this job only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: nextest

      # test-fast, not release: the tests need release-grade codegen for the DSP
      # but none of release's shipping flags. Measured on the three heaviest
      # tests, dropping fat LTO and codegen-units=1 changed their runtime by
      # under a tenth of a second while cutting compile CPU ~40% — the LTO was
      # buying the test suite nothing and costing it a serialized link. See the
      # profile's comment in Cargo.toml.
      - run: make test-fast-tier NEXTEST_ARGS='--partition hash:${{ matrix.partition }}'

      # nextest does not run doctests. There are none today, and this is what
      # keeps that a fact rather than an assumption.
      - name: Doctests
        if: matrix.partition == '1/2'
        run: cargo test --doc --workspace --profile test-fast

  # No separate wasm32 check: when Rust changed, the cache key of the engine
  # job below (crates/**, Cargo.*, the Makefile) misses and it runs
  # `make wasm`, a full wasm32 build under this workflow's -Dwarnings (the
  # Makefile's WASM_RUSTFLAGS adds to RUSTFLAGS rather than replacing them),
  # which is more than `cargo check` for the target. The one change that
  # reaches neither is a workflow-only edit, which cannot change what the
  # compiler sees.

  # The site is built and link-checked on every PR that can affect it, not only
  # on deploy.
  #
  # Its failure modes are invisible to every other job here: a KaTeX macro that
  # renders as "Undefined control sequence" (a build *warning*), a cross-section
  # link that only exists once four sections are assembled, a root-absolute path
  # that works at a domain root and 404s under a project subpath. All of those
  # would otherwise be found on the live site by a reader.
  #
  # The instrument at /play/ is the engine job's build, downloaded, not a
  # second one: the same bytes the browser tier tests. Rust is still needed
  # here for the API reference (`cargo doc`).
  site:
    name: Site
    needs: [changes, engine]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pages_artifact: ${{ steps.pages-name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache the doc toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: doc-tools-${{ runner.os }}-mdbook${{ env.MDBOOK_VERSION }}-katex${{ env.MDBOOK_KATEX_VERSION }}-admonish${{ env.MDBOOK_ADMONISH_VERSION }}

      - name: Install the doc toolchain
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v mdbook >/dev/null; then
            curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          if ! command -v mdbook-admonish >/dev/null; then
            curl -sSfL "https://github.com/tommilligan/mdbook-admonish/releases/download/v${MDBOOK_ADMONISH_VERSION}/mdbook-admonish-v${MDBOOK_ADMONISH_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xz -C ~/.local/bin
          fi
          if ! command -v mdbook-katex >/dev/null; then
            cargo install mdbook-katex --version "$MDBOOK_KATEX_VERSION" --locked --root ~/.local
          fi

      # Tee'd so the grep below can read it: mdbook-katex reports an undefined
      # macro as a WARNING and exits 0, so a book full of raw `\E[u_\theta]` would
      # otherwise build, deploy and be discovered by a reader.
      - name: Build the site
        run: |
          set -euo pipefail
          make site WASM_PREBUILT=1 2>&1 | tee /tmp/site-build.log

      - name: Fail on unrendered math
        run: |
          if grep -q 'Rendering failed' /tmp/site-build.log; then
            echo "::error::mdbook-katex could not render some math — see the build log above"
            grep 'Rendering failed' /tmp/site-build.log | head -20
            exit 1
          fi
          echo "all math rendered"

      - name: Check every link and asset resolves
        run: make site-check


      # The browser tests: boot the instrument against the wasm the site
      # ships and require a clean console, a registered worklet and an
      # engine that reaches `playable` (tests/web/smoke.spec.js); then provoke
      # the audit's four failure flows — an unparseable save, an engine error,
      # a refused vote, a profile import — and require each to be reported and
      # contained (tests/web/failure_flows.spec.js). The fast browser tier runs
      # these two as well, but only when the app or the engine changed; here
      # they also guard a site-only PR, whose `make site` ships this very
      # engine as /play/, and cost seconds against the engine already built.
      # The numeric audio assertions CONTRIBUTING describes are still run by
      # hand.
      - uses: ./.github/actions/playwright

      - name: Boot the instrument in a browser and exercise its failure flows
        run: make smoke

      - name: Keep the trace of a failed boot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-results-${{ github.sha }}
          path: tests/web/test-results/
          if-no-files-found: ignore

      # What the deploy job publishes once `CI` is green: this build, the one
      # just checked and booted. Last, so a red Site never kept one; named for
      # the attempt, because deploy-pages refuses a run holding two artifacts
      # of one name, which a re-run of this job would otherwise leave.
      - name: Keep the site for the deploy
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 7
      - if: steps.pages.outcome == 'success'
        id: pages-name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  # The engine for the fast browser tier, built once per run (see the
  # action's comment): restored from the cache when no crate changed, which is
  # most PRs that touch the app, and ~1.5 min of wasm build otherwise.
  #
  # It also reads main's browser timings once for the whole run (see the
  # action): every browser runner deals its tests from that one file.
  engine:
    name: Engine for the browser
    needs: changes
    if: needs.changes.outputs.site == 'true' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-engine
      - if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.reuse_browser != 'true'
        uses: ./.github/actions/browser-timings
        with:
          tier: fast

  # The fast browser tier: every spec in tests/web not tagged @slow or
  # @quarantine, against the engine built above.
  #
  # About 70 minutes of test time in one worker (main at f6f4612, 272 tests,
  # a fresh boot each). tests/web/shard.mjs deals them to eight runners by
  # main's last timings, longest first, so each runs about 9 minutes: with
  # Playwright's own split by count, five runners took from 9 to 19.
  #
  # Several specs assert on timing (a toast within 1.5 s, a ▶ answered while
  # the engine works). A failure that only appears here is still a finding
  # about the app on a slower machine. It is fixed, or quarantined, never
  # retried (docs/architecture/testing.md § Flakes).
  browser:
    name: Browser (${{ matrix.shard }})
    needs: [changes, engine]
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.reuse_browser != 'true'
    runs-on: ubuntu-24.04
    # The planned ~9 minutes, a test's own five-minute timeout and room: a
    # test that times out is reported as a failure, with its trace, rather
    # than the whole runner being cancelled before it can say which.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Eight, or one per changed spec up to eight on a PR that changed
        # only specs (the changes job).
        shard: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - uses: ./.github/actions/browser-shard
        with:
          tier: fast
          name: fast
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: --grep-invert "@slow|@quarantine"
          files: ${{ needs.changes.outputs.specs }}

  # The runners' reports as one: an HTML report of every test, with the traces
  # of what failed, uploaded when a runner failed (the run's summary links
  # it), and on main the times folded into the timings the next run deals by.
  # Not part of the `CI` check: it reports on the answer, it is not one.
  report:
    name: Browser report
    needs: [changes, browser]
    if: ${{ !cancelled() && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: fast
          failed: ${{ needs.browser.result == 'failure' }}
          timings: fast

  # One check that means "CI is green", whatever ran.
  #
  # The jobs above are conditional, and a skipped job reports neither success nor
  # failure — so requiring them individually in a branch ruleset would wedge every
  # documentation PR forever. This is the job to require instead: it distinguishes
  # "skipped because the change could not affect it" from "did not pass".
  ci:
    name: CI
    if: always()
    needs: [changes, lint, web, test, site, engine, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "green"

      # What main reuses (the changes job's reuse step): the files this run
      # tested, as a git tree, and the jobs that passed on them. A
      # pull_request run tests the PR merged into main, GITHUB_SHA, so this is
      # that merge's tree, the tree a squash merge of an up-to-date PR makes.
      # Not from a fork: its run executes the fork's copy of this workflow.
      # A record that cannot be written costs main a re-run, never the PR its
      # green: both steps carry on past an error.
      - name: Record what passed on these files
        id: record
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          SPECS: ${{ needs.changes.outputs.specs }}
          RUSTC: ${{ needs.lint.outputs.rustc }}
        run: |
          set -euo pipefail
          tree="$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" -q .tree.sha)"
          browser="$(jq -r .browser.result <<<"$RESULTS")"
          if [ "$browser" = success ]; then
            if [ -n "$SPECS" ]; then browser=partial; else browser=full; fi
          fi
          jq -n --arg tree "$tree" --arg run "$GITHUB_RUN_ID" --arg browser "$browser" --arg rustc "$RUSTC" --argjson r "$RESULTS" \
            '{tree: $tree, run: $run, rustc: $rustc, ran: {lint: $r.lint.result, web: $r.web.result, test: $r.test.result, site: $r.site.result, browser: $browser}}' \
            > verified.json
          cat verified.json
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - if: steps.record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-tree-${{ steps.record.outputs.tree }}
          path: verified.json
          retention-days: 14

  # The site, published from this run's build once `CI` is green: four
  # sections under one origin (/ the landing page, /play/ the instrument,
  # /docs/ the guide, /reference/ the technical reference with /reference/api/
  # rustdoc). Every asset path is relative, so it runs unchanged at the root
  # of its custom domain (auracle.alexnodeland.com, set in Settings → Pages)
  # or under a project subpath; `make site-check` enforces that.
  #
  # From main only: the github-pages environment permits deployments from
  # `main`, and the site tracks its tip, as the README promises. A release tag
  # is cut from a green main that has therefore already deployed
  # (CONTRIBUTING.md § Cutting a release). A red run deploys nothing; the last
  # green one stays live.
  deploy:
    name: Deploy to Pages
    needs: [ci, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.ci.result == 'success' && needs.site.outputs.pages_artifact != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, in order: a slow one is never cancelled by the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.site.outputs.pages_artifact }}

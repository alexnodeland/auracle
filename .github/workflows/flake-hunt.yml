name: Flake hunt

# Every night, the gate's browser tests three times each, against main, where
# nothing changed but the machine.
#
# The gate (ci.yml) runs each test once with no retries, so a test that fails
# one run in thirty shows up only as a red PR now and then, and is easy to
# re-run past. Here it fails three times as often, and each test that fails
# gets an issue of its own, `Flaky: <file> '<test title>'`, or a comment on
# the one already open (tests/web/flakes.mjs finds it). Every test here passed
# the gate on this very commit, so even one that failed all three runs is a
# flake to the gate: the hunt boots unseeded, and the gate's seed may be the
# one it holds for. The fix is to the test or the app; while it is being
# fixed the test can be tagged @quarantine with its issue named, which moves
# it from the gate to the Slow suite (docs/architecture/testing.md § Flakes).
#
# Its passing runs also keep the fast tier's timings current: the median of
# each test's three, folded into the timings the gate deals by, whether or
# not main's last push ran the tier.
#
# Its own workflow, not a job in the Slow suite, so its hour never holds that
# workflow's queue on main.
#
# Beside it, the speed budgets (ADR-022): the gate records each as an
# annotation and never fails on one; here they are judged, once a night, on
# main, on the reference profile (ADR-025), in Chromium and in Firefox, and
# the ones over their limit file an issue of their own.
#
# CI's own health (scripts/ci_stats.py) is a workflow of its own,
# ci-health.yml, after this one each night: a stop at the API's rate limit
# there is a red CI health run, not a red hunt.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-hunt
  cancel-in-progress: false

env:
  # The tests the hunt runs, the gate's: its runners are dealt them, and its
  # report lists them to find any no runner reported.
  HUNT_TESTS: '--grep-invert "@slow|@quarantine"'

jobs:
  # The engine, the fast tier's timings and the image's tag (the Playwright
  # version tests/web/package-lock.json locks), once for the run, as in
  # ci.yml.
  engine:
    name: Engine for the browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: playwright
        uses: ./.github/actions/playwright-version
      - uses: ./.github/actions/web-engine
      - uses: ./.github/actions/browser-timings
        with:
          tier: fast

  # The gate's twelve shards, each run three times over: about twenty
  # minutes a shard, so the job limit leaves room for a slow runner. Four at a
  # time (`max-parallel`), in three rounds of about twenty minutes: it runs at
  # night beside Search health, which holds three runners for hours, and the
  # speed budgets' two, so together they hold nine of the account's 20, and a
  # PR pushed then can wait for runners at its widest (slow-suite.yml counts
  # the lanes'). At eight wide the hunt would be over sooner but hold
  # thirteen, and a PR pushed then would wait for more. The Slow suite's
  # nightly run (04:23 UTC, about twenty minutes) is over before this one
  # starts (05:41 UTC).
  hunt:
    name: Flake hunt (${{ matrix.shard }})
    needs: engine
    runs-on: ubuntu-24.04
    # In Playwright's image, as the gate's browser job: the same Chromium and
    # libraries (.github/actions/playwright says why).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    # Playwright's global timeout, five minutes under the job's limit; the
    # shard interrupts the run a minute before it, so a shard that runs long
    # still reports its tests and the one it was running (ci.yml's browser
    # job says why). The two numbers move together.
    timeout-minutes: 45
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      # Unseeded: on the gate, a spec on the fixture that names no seed of
      # its own boots seeded (tests/web/fixtures.js SEED, the same pool and
      # sides each run). Here those boot unseeded, so a spec meets pools and
      # offers it has not seen before. A spec that names its own `random:`
      # seed keeps it.
      - uses: ./.github/actions/browser-shard
        env:
          AURACLE_SEED: random
        with:
          tier: fast
          name: hunt
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: ${{ env.HUNT_TESTS }} --repeat-each=3

  # The speed budgets, judged (AURACLE_PERF=1): every spec file that records
  # one (`budget(` in it), each test once, its @slow ones too, seeded as on
  # the gate. On the reference profile (AURACLE_PROFILE=air, ADR-025,
  # tests/web/profile.js): each runner times a calibration render at its
  # first boot and slows the engine worker and every farm worker until a
  # render takes the reference machine's time, boots with ?farm=2, and in
  # Chromium throttles the page by the same rate; each shard's summary says
  # what it measured, and each budget names the profile beside its figure. A
  # spec's own slowed worker.js is kept on it (the fixture serves a spec's
  # `workerPrefix` after its own slowed engine; patch_audible's, #166).
  # In Chromium and in Firefox (D10): Firefox has no throttle for a page, so
  # there the engine and the farm are slowed and the page is not, and it
  # needs an audio server the image lacks (a step below starts one). The
  # run's project is named for its browser, so the merged report says which
  # each test ran in. Three runners a browser, where two ran at the runner's
  # own speed (about twenty minutes each): the profile slows what waits on
  # the engine on a runner faster than the reference, and a shard must end
  # inside its 40 minutes. Two at a time, as before the Firefox run, so the
  # night's count above holds.
  #
  # TODO(#288): the audio thread's budget, `live_cost.mjs --sweep-only
  # --gate=<ms>` (crates/auracle-wasm/examples/, on #288's branch), judged
  # here as a budget (never an expect) once it is on main.
  perf:
    name: Speed budgets (${{ matrix.browser }} ${{ matrix.shard }})
    needs: engine
    runs-on: ubuntu-24.04
    # In Playwright's image, as the hunt's runners: it holds Firefox too.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    timeout-minutes: 45
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 40
      # The image runs as root, and a container job's HOME (/github/home)
      # belongs to the runner's user: Firefox will not start under a HOME it
      # does not own ("Running Nightly as root in a regular user's session is
      # not supported"), and every test of a Firefox shard failed at launch.
      # For the whole job, since the `playwright` action writes git's
      # safe.directory under HOME and Playwright's git reads it there.
      HOME: /root
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox]
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      # Firefox on Linux sounds through a PulseAudio server, and Playwright's
      # image has none: there its AudioContext never leaves `suspended`
      # (the graph falls back to the system clock, and the context waits on
      # the audio stream), so every spec that reads a level reads silence.
      # A server with no hardware gives a null sink, and Firefox runs on it.
      # Chromium needs none. This is the one apt step in a browser job (the
      # `playwright` action says why the others went): about 2 MB, cut at
      # three minutes with a message naming the mirror, and on this nightly
      # job's Firefox shards only.
      - name: An audio server for Firefox
        if: matrix.browser == 'firefox'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if ! timeout -k 10 180 bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends pulseaudio' > /tmp/apt.log 2>&1; then
            tail -20 /tmp/apt.log
            echo "::error::Installing PulseAudio took over three minutes or failed: Ubuntu's mirror is slow or unreachable from this runner, not the change. Re-run the job."
            exit 1
          fi
          pulseaudio --daemonize --exit-idle-time=-1 2>&1 | grep -v "not intended to be run as root" || true
          pactl info | grep -E "^(Server String|Default Sink)" || { echo "::error::PulseAudio did not start, so Firefox would read no level"; exit 1; }

      - name: Which browser this shard runs
        run: echo "Speed budgets in ${{ matrix.browser }}, shard ${{ matrix.shard }}." >> "$GITHUB_STEP_SUMMARY"

      - name: The specs that record a budget
        id: files
        run: echo "files=$(cd tests/web && grep -lE '\bbudget\(' -- *.spec.js | sed 's|^|/|' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/browser-shard
        env:
          AURACLE_PERF: "1"
          AURACLE_PROFILE: air
          AURACLE_BROWSER: ${{ matrix.browser }}
        with:
          tier: fast
          name: perf
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          files: ${{ steps.files.outputs.files }}
          args: --grep-invert "@quarantine"

  perf-report:
    name: Speed budgets report
    needs: perf
    if: ${{ !cancelled() && needs.perf.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: perf
          failed: ${{ needs.perf.result == 'failure' }}

  perf-file:
    name: File the budgets over their limit
    needs: perf
    if: always() && github.event_name == 'schedule' && needs.perf.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Speed budgets over their limit
          results: ${{ toJSON(needs) }}
          advice: >-
            Each budget is how long something took against the limit the app
            was built to (ADR-022). The gate records them and never fails on
            one; this run judged them on main, on the reference profile
            (ADR-025) in Chromium and in Firefox, and the run's summary lists
            each one over its limit with the profile it was measured on, and
            what each shard's calibration measured and the CPU it ran on. Read
            whether the app got slower or the runner was slow (a runner slower
            than the reference is not slowed). A failure there that is not a
            budget is the Flake hunt's to find in Chromium; in Firefox, which
            no gate runs, it is a finding of its own.

  # Which tests failed, and on which of their three runs, in one report; the
  # issue each goes to (tests/web/flakes.mjs: the one its annotation names,
  # else the open `Flaky:` issue titled for it, else a new one); the tests
  # the hunt was dealt that no runner reported (a runner lost, or a step
  # before its run failed, writes no report, and its tests would otherwise
  # leave no trace); and, on main, the times of the runs that passed folded
  # into the fast tier's timings and saved for the gate's next deal.
  report:
    name: Flake hunt report
    needs: hunt
    if: ${{ !cancelled() && needs.hunt.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      flaky: ${{ steps.who.outputs.flaky }}
      unexplained: ${{ steps.who.outputs.unexplained }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: hunt
          failed: ${{ needs.hunt.result == 'failure' }}
          timings: ${{ github.ref == 'refs/heads/main' && 'fast' || '' }}
      # The open issues: a flake's issue opened by hand is found by its
      # title, and an issue a test names that is closed is passed over.
      # Unread, the issue a test names is taken as open, and only an issue
      # the hunt opened itself is found by its title (file-issue's own
      # search), so a flake's issue opened by hand gets a twin. And the
      # tests the hunt was dealt, listed as its runners list them (no
      # browser): one in no runner's report never ran. A listing that fails
      # is said, and files the run.
      - name: Which issue each failed test goes to
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.hunt.result }}
        run: |
          cd tests/web
          open=()
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > open-issues.json; then
            open=(--open open-issues.json)
          else
            echo "::warning::The open issues could not be listed: each failed test goes to the issue it names, else to the hunt's own issue under its title."
          fi
          npx playwright test --list --reporter=json --pass-with-no-tests ${{ env.HUNT_TESTS }} > listed.json || rm -f listed.json
          node flakes.mjs hunt merged.json "${open[@]}" --listed listed.json --outcome "$OUTCOME"

  # Each test that failed, on its own issue: a comment on the one open for it,
  # or a new `Flaky:` issue (labelled flake). Two at a time.
  file-flaky:
    name: File a flaky test (${{ strategy.job-index }})
    needs: report
    if: >-
      always() && github.event_name == 'schedule' &&
      needs.report.outputs.flaky != '' && needs.report.outputs.flaky != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.report.outputs.flaky) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          issue: ${{ matrix.issue }}
          title: ${{ matrix.title }}
          labels: flake,area:tests
          failed: ${{ matrix.failed }}
          detail: ${{ matrix.detail }}
          advice: >-
            This test passed the gate on this commit and failed here on main,
            where nothing changed but the machine and the seed: the hunt boots
            unseeded, so a test that failed every run may hold only for the
            gate's seed. The run's summary links one report with each failed
            run's trace. Fix the test or the app; while it is being fixed,
            quarantine it: the @quarantine tag, with this issue named beside it
            (`annotation: { type: "issue", description: "#<this issue>" }`),
            and the issue labelled quarantined (docs/process.md § Flakes).

  # What no one test accounts for: the engine's build, a runner cut short or
  # lost (a test cut short, or tests the hunt was dealt that no runner
  # reported), an error outside any test, or more tests failing at once than
  # a few flakes would (flakes.mjs MANY), which is one thing wrong with main
  # or the machines. Filed beside the flakes the other runners found.
  file:
    name: File what no test accounts for
    needs: [engine, hunt, report]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.engine.result == 'failure' || needs.report.result == 'failure' ||
      needs.report.outputs.unexplained == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Flake hunt failing on main
          results: ${{ toJSON(needs) }}
          advice: >-
            The hunt failed in a way no one test's issue holds: the engine's
            build, a runner cut short or lost, an error outside any test, or
            more tests at once than a few flakes would be. The run's summary
            says which, and links one report of every runner, with traces.

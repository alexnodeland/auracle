name: Flake hunt

# Every night, the gate's browser tests three times each, against main, where
# nothing changed but the machine.
#
# The gate (ci.yml) runs each test once with no retries, so a test that fails
# one run in thirty shows up only as a red PR now and then, and is easy to
# re-run past. Here it fails three times as often, and each test that fails
# gets an issue of its own, `Flaky: <file> '<test title>'`, or a comment on
# the one already open (tests/web/flakes.mjs finds it). Every test here passed
# the gate on this very commit, so even one that failed all three runs is a
# flake to the gate: the hunt boots unseeded, and the gate's seed may be the
# one it holds for. The fix is to the test or the app; while it is being
# fixed the test can be tagged @quarantine with its issue named, which moves
# it from the gate to the Slow suite (docs/architecture/testing.md § Flakes).
#
# Its passing runs also keep the fast tier's timings current: the median of
# each test's three, folded into the timings the gate deals by, whether or
# not main's last push ran the tier.
#
# Its own workflow, not a job in the Slow suite, so its hours never hold that
# workflow's queue on main.
#
# After it, the speed budgets (ADR-022): the gate records each as an
# annotation and never fails on one; here they are judged, once a night, on
# main, on the reference profile (ADR-025), in Chromium and in Firefox, each
# test given its verdict, and the ones over their limit are listed on an
# issue of their own. And the audio thread's budget (ADR-025's half a
# quantum), judged on every preset as a budget that names what is over and
# never turns the run red.
#
# CI's own health (scripts/ci_stats.py) is a workflow of its own,
# ci-health.yml, after this one each night: a stop at the API's rate limit
# there is a red CI health run, not a red hunt.
#
# It holds at most three runners at once (#582). GitHub starts this cron
# 4.5 to 6 hours late (from 09:46 to 12:00 UTC over Oct 18 to Nov 1), when
# PRs are being queued, and each runner it holds is one the merge queue's
# next batch can wait for. So its jobs run in stages, one after another,
# none holding more than three (scripts/test_ci_skip.py counts the most
# its jobs can hold at once from their `needs` and `max-parallel`, in
# dev-check):
#
# 1. the engine, one runner;
# 2. the hunt's twelve runners, three at a time: about 70 minutes;
# 3. the hunt's report, then the flakes it files (two at a time) beside
#    what no test accounts for;
# 4. the speed budgets' thirteen runners, three at a time: about 70
#    minutes;
# 5. their report, Touch in WebKit and the audio thread's budget, side by
#    side, then the budgets' filing.
#
# About two and a half hours from the engine to the last job, on the job
# times of 2026-11-01 (the hunt's runners 14 to 22 minutes each, the
# budgets' 11 to 19, Touch in WebKit 8), and longer on a night a stage
# waits for runners. Side by side (the hunt four at a time beside the
# budgets three at a time, up to nine at once) the same jobs come to
# about an hour and a quarter with no wait; that night, waiting for
# runners other repositories held, they took 2 h 20 min. Every test still
# gets its verdict and every runner its share and its time limit; the
# answers come later in the day. A stage starts whatever the one before
# it found (`!cancelled()`), so a red hunt still has its budgets judged.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-hunt
  cancel-in-progress: false

env:
  # The tests the hunt runs, the gate's: its runners are dealt them, and its
  # report lists them to find any no runner reported.
  HUNT_TESTS: '--grep-invert "@slow|@quarantine"'

jobs:
  # The engine, the timings each set of runners deals by and the image's tag
  # (the Playwright version tests/web/package-lock.json locks), once for the
  # run, as in ci.yml: the fast tier's for the hunt, and the speed budgets'
  # own (`perf`, each test's last time in each browser), seeded from the fast
  # and slow tiers' on a night it has none.
  engine:
    name: Engine for the browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: playwright
        uses: ./.github/actions/playwright-version
      - uses: ./.github/actions/web-engine
      - uses: ./.github/actions/browser-timings
        with:
          tier: fast
      - uses: ./.github/actions/browser-timings
        with:
          tier: slow
      - uses: ./.github/actions/browser-timings
        with:
          tier: perf
          seed: fast slow

  # The gate's twelve shards, each run three times over: about seventeen
  # minutes a shard (14 to 22 on 2026-11-01), so the job limit leaves room
  # for a slow runner. Three at a time (`max-parallel`), the workflow's
  # whole share (the header says why): four rounds, about 70 minutes. Wider
  # would be over sooner but hold more of the account's 20 while PRs are
  # queued (slow-suite.yml counts the lanes'). Search health's three long
  # jobs (cron 04:20 UTC, as late as this one) can run beside its first hour
  # on a night main moved; the Slow suite's nightly run (04:23 UTC, about
  # twenty minutes) was over before this one began on every night from
  # Oct 18 to Nov 1.
  hunt:
    name: Flake hunt (${{ matrix.shard }})
    needs: engine
    runs-on: ubuntu-24.04
    # In Playwright's image, as the gate's browser job: the same Chromium and
    # libraries (.github/actions/playwright says why).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    # Playwright's global timeout, five minutes under the job's limit; the
    # shard interrupts the run a minute before it, so a shard that runs long
    # still reports its tests and the one it was running (ci.yml's browser
    # job says why). The two numbers move together.
    timeout-minutes: 45
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      # Unseeded: on the gate, a spec on the fixture that names no seed of
      # its own boots seeded (tests/web/fixtures.js SEED, the same pool and
      # sides each run). Here those boot unseeded, so a spec meets pools and
      # offers it has not seen before. A spec that names its own `random:`
      # seed keeps it.
      - uses: ./.github/actions/browser-shard
        env:
          AURACLE_SEED: random
        with:
          tier: fast
          name: hunt
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: ${{ env.HUNT_TESTS }} --repeat-each=3

  # The touch specs in WebKit, on an iPhone's profile (AURACLE_BROWSER=webkit,
  # tests/web/playwright.config.js): as near iOS Safari as Playwright comes.
  # Playwright's image holds WebKit and its libraries, so nothing is
  # installed. WebKit has no CDP, so touch_gestures' finger is made in the
  # page there (its `cdpOf` says what that proves and what it does not).
  # Seeded as on the gate, each test three times; a failure is this job red.
  # After the speed budgets, beside their report (the header's stage 5),
  # whatever they found.
  touch-webkit:
    name: Touch in WebKit
    needs: [engine, perf]
    if: ${{ !cancelled() && needs.engine.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    timeout-minutes: 20
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - uses: ./.github/actions/browser-shard
        env:
          AURACLE_BROWSER: webkit
        with:
          tier: fast
          name: webkit
          shard: "1/1"
          index: "0"
          files: /touch_gestures.spec.js /shell_phone.spec.js
          args: --grep-invert "@quarantine" --repeat-each=3

  # The speed budgets, judged (AURACLE_PERF=1): every spec file that records
  # one (`budget(` in it), each test once, its @slow ones too, seeded as on
  # the gate. On the reference profile (AURACLE_PROFILE=air, ADR-025,
  # tests/web/profile.js): each runner times a calibration render at its
  # first boot and slows the engine worker and every farm worker until a
  # render takes the reference machine's time, boots with ?farm=2, and in
  # Chromium throttles the page by the same rate up to the profile's cap
  # (`pageRateMax` in tests/web/profiles.json), the Air's CPU against an
  # M-series one; each shard's summary says what it measured and
  # what is an estimate, and each budget names the profile beside its
  # figure. A spec's own slowed worker.js is kept on it (the fixture serves
  # a spec's `workerPrefix` after its own slowed engine; patch_audible's,
  # #166).
  # In Chromium and in Firefox (D10): Firefox has no throttle for a page, so
  # there the engine and the farm are slowed and the page is not, and it
  # needs an audio server the image lacks (a step below starts one). The
  # run's project is named for its browser, so the merged report says which
  # each test ran in.
  #
  # Every test gets its verdict (#508): eight runners for Chromium and five
  # for Firefox, each dealt about 28 minutes of its browser's tests by
  # shard.mjs from the job's own timings (`perf`: each test's last time in
  # each browser, a run that failed over a budget counted too, which the
  # report below folds on main), so each ends about ten minutes inside its
  # 40. On 2026-10-31, three runners a browser dealt by the gate's timings
  # were each cut at 40 minutes, and 74 of the 167 tests in Chromium and 32
  # in Firefox never ran: on the profile a test took about seven times its
  # time on the gate in Chromium (about 230 minutes in all) and three and a
  # half in Firefox (about 140). Three at a time, the workflow's whole share,
  # once the hunt and what it files are done (the header's stage 4),
  # whatever the hunt found: about two and three quarter hours on the
  # 1,100 ms profile (the maintainer accepted about three, 2026-10-31).
  # Wider would be over sooner and hold more of the account's twenty while
  # PRs are queued; fewer, longer runners would leave less of each cut to
  # spare. #509 lowered the estimate, and each test is shorter on the new
  # profile: on 2026-11-01, its first night, dealt by the old profile's
  # timings, each runner took 11 to 19 minutes, its setup included, and the
  # thirteen about 70 minutes three at a time. As `perf`'s timings refresh,
  # each runner's share follows.
  perf:
    name: Speed budgets (${{ matrix.browser }} ${{ matrix.shard }})
    needs: [engine, report, file-flaky, file]
    if: ${{ !cancelled() && needs.engine.result == 'success' }}
    runs-on: ubuntu-24.04
    # In Playwright's image, as the hunt's runners: it holds Firefox too.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    timeout-minutes: 45
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 40
      # The image runs as root, and a container job's HOME (/github/home)
      # belongs to the runner's user: Firefox will not start under a HOME it
      # does not own ("Running Nightly as root in a regular user's session is
      # not supported"), and every test of a Firefox shard failed at launch.
      # For the whole job, since the `playwright` action writes git's
      # safe.directory under HOME and Playwright's git reads it there.
      HOME: /root
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { browser: chromium, shard: "1/8" }
          - { browser: chromium, shard: "2/8" }
          - { browser: chromium, shard: "3/8" }
          - { browser: chromium, shard: "4/8" }
          - { browser: chromium, shard: "5/8" }
          - { browser: chromium, shard: "6/8" }
          - { browser: chromium, shard: "7/8" }
          - { browser: chromium, shard: "8/8" }
          - { browser: firefox, shard: "1/5" }
          - { browser: firefox, shard: "2/5" }
          - { browser: firefox, shard: "3/5" }
          - { browser: firefox, shard: "4/5" }
          - { browser: firefox, shard: "5/5" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      # Firefox on Linux sounds through a PulseAudio server, and Playwright's
      # image has none: there its AudioContext never leaves `suspended`
      # (the graph falls back to the system clock, and the context waits on
      # the audio stream), so every spec that reads a level reads silence.
      # A server with no hardware gives a null sink, and Firefox runs on it.
      # Chromium needs none. This is the one apt step in a browser job (the
      # `playwright` action says why the others went): about 2 MB, cut at
      # three minutes with a message naming the mirror, and on this nightly
      # job's Firefox shards only.
      - name: An audio server for Firefox
        if: matrix.browser == 'firefox'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if ! timeout -k 10 180 bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends pulseaudio' > /tmp/apt.log 2>&1; then
            tail -20 /tmp/apt.log
            echo "::error::Installing PulseAudio took over three minutes or failed: Ubuntu's mirror is slow or unreachable from this runner, not the change. Re-run the job."
            exit 1
          fi
          pulseaudio --daemonize --exit-idle-time=-1 2>&1 | grep -v "not intended to be run as root" || true
          pactl info | grep -E "^(Server String|Default Sink)" || { echo "::error::PulseAudio did not start, so Firefox would read no level"; exit 1; }

      - name: Which browser this shard runs
        run: echo "Speed budgets in ${{ matrix.browser }}, shard ${{ matrix.shard }}." >> "$GITHUB_STEP_SUMMARY"

      - name: The specs that record a budget
        id: files
        run: echo "files=$(cd tests/web && grep -lE '\bbudget\(' -- *.spec.js | sed 's|^|/|' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/browser-shard
        env:
          AURACLE_PERF: "1"
          AURACLE_PROFILE: air
          AURACLE_BROWSER: ${{ matrix.browser }}
        with:
          tier: perf
          name: perf
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          files: ${{ steps.files.outputs.files }}
          args: --grep-invert "@quarantine"

  # The audio thread's budget (ADR-025: its work a quantum under half a
  # quantum on the reference machine; #361), judged nightly as a budget:
  # never red for a preset over it (ADR-022). `live_cost.mjs --sweep-only
  # --gate` times every preset's live voices in node, the V8 Chromium runs,
  # at four voices (A alone) and at eight (A, and B holding the same preset,
  # a proxy for an offer bred from it), against half a quantum divided by
  # this runner's rate on the reference profile, which it measures first by
  # the profile's own calibration render (tests/web/profiles.json, whose
  # reference is an estimate until the Air measures it: ADR-025's figure
  # times the speed-ups measured since). The run's summary names each
  # preset over the limit and the issue it waits on (#320: a voice count
  # from the sound's own cost), and says it is not judged at #320's ceiling
  # until that exists.
  # Red only when it could not measure, which is filed with the speed
  # budgets. A runner of its own for a few minutes, so the sweep shares its
  # cores with nothing: after the speed budgets, beside their report (the
  # header's stage 5), whatever they found.
  audio:
    name: The audio thread's budget
    needs: [engine, perf]
    if: ${{ !cancelled() && needs.engine.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Every preset's voices against half a quantum on the reference profile
        run: node crates/auracle-wasm/examples/live_cost.mjs --sweep-only --gate

  # Every runner's report merged: the HTML report, each budget over its limit
  # in the run's summary, and with them each test that failed on something
  # else (`failures`), which is the comment the next job files; and, on main,
  # each test's time in each browser folded into the job's own timings
  # (`--by-project`, `--failed`: a test over a budget fails having run to its
  # end, and its time is still how long it holds its runner), which the next
  # night deals by.
  perf-report:
    name: Speed budgets report
    needs: perf
    if: ${{ !cancelled() && needs.perf.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      budgets: ${{ steps.report.outputs.budgets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: report
        uses: ./.github/actions/browser-report
        with:
          name: perf
          failed: ${{ needs.perf.result == 'failure' }}
          failures: "true"
          timings: ${{ github.ref == 'refs/heads/main' && 'perf' || '' }}
          timings-options: --by-project --failed

  # One comment a night on *Speed budgets over their limit* (#221), readable
  # without the run: each budget over its limit, as the report's table, and
  # each test that failed on something else.
  perf-file:
    name: File the budgets over their limit
    needs: [perf, perf-report, audio]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.perf.result == 'failure' || needs.audio.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Speed budgets over their limit
          results: ${{ toJSON(needs) }}
          detail: ${{ needs.perf-report.outputs.budgets }}
          advice: >-
            Each budget is how long something took against the limit the app
            was built to (ADR-022). The gate records them and never fails on
            one; this run judged them on main, on the reference profile
            (ADR-025) in Chromium and in Firefox, each test once: the table
            lists each one over its limit, with the rates its test's boot ran
            at on the profile (from its runner's calibration) and the CPU it
            ran on, and the run's summary has each shard's calibration. Read
            whether the app got slower or the runner was slow (a runner slower
            than the reference is not slowed). A failure that is not a budget
            is the Flake hunt's to find in Chromium; in Firefox, which no gate
            runs, it is a finding of its own. The audio thread's budget is in
            the run's summary, and is named here only when it could not
            measure (`audio`).

  # Which tests failed, and on which of their three runs, in one report; the
  # issue each goes to (tests/web/flakes.mjs: the one its annotation names,
  # else the open `Flaky:` issue titled for it, else a new one); the tests
  # the hunt was dealt that no runner reported (a runner lost, or a step
  # before its run failed, writes no report, and its tests would otherwise
  # leave no trace); and, on main, the times of the runs that passed folded
  # into the fast tier's timings and saved for the gate's next deal.
  report:
    name: Flake hunt report
    needs: hunt
    if: ${{ !cancelled() && needs.hunt.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      flaky: ${{ steps.who.outputs.flaky }}
      unexplained: ${{ steps.who.outputs.unexplained }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: hunt
          failed: ${{ needs.hunt.result == 'failure' }}
          timings: ${{ github.ref == 'refs/heads/main' && 'fast' || '' }}
      # The open issues: a flake's issue opened by hand is found by its
      # title, and an issue a test names that is closed is passed over.
      # Unread, the issue a test names is taken as open, and only an issue
      # the hunt opened itself is found by its title (file-issue's own
      # search), so a flake's issue opened by hand gets a twin. And the
      # tests the hunt was dealt, listed as its runners list them (no
      # browser): one in no runner's report never ran. A listing that fails
      # is said, and files the run.
      - name: Which issue each failed test goes to
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.hunt.result }}
        run: |
          cd tests/web
          open=()
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > open-issues.json; then
            open=(--open open-issues.json)
          else
            echo "::warning::The open issues could not be listed: each failed test goes to the issue it names, else to the hunt's own issue under its title."
          fi
          npx playwright test --list --reporter=json --pass-with-no-tests ${{ env.HUNT_TESTS }} > listed.json || rm -f listed.json
          node flakes.mjs hunt merged.json "${open[@]}" --listed listed.json --outcome "$OUTCOME"

  # Each test that failed, on its own issue: a comment on the one open for it,
  # or a new `Flaky:` issue (labelled flake). Two at a time.
  file-flaky:
    name: File a flaky test (${{ strategy.job-index }})
    needs: report
    if: >-
      always() && github.event_name == 'schedule' &&
      needs.report.outputs.flaky != '' && needs.report.outputs.flaky != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.report.outputs.flaky) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          issue: ${{ matrix.issue }}
          title: ${{ matrix.title }}
          labels: flake,area:tests
          failed: ${{ matrix.failed }}
          detail: ${{ matrix.detail }}
          advice: >-
            This test passed the gate on this commit and failed here on main,
            where nothing changed but the machine and the seed: the hunt boots
            unseeded, so a test that failed every run may hold only for the
            gate's seed. The run's summary links one report with each failed
            run's trace. Fix the test or the app; while it is being fixed,
            quarantine it: the @quarantine tag, with this issue named beside it
            (`annotation: { type: "issue", description: "#<this issue>" }`),
            and the issue labelled quarantined (docs/process.md § Flakes).

  # What no one test accounts for: the engine's build, a runner cut short or
  # lost (a test cut short, or tests the hunt was dealt that no runner
  # reported), an error outside any test, or more tests failing at once than
  # a few flakes would (flakes.mjs MANY), which is one thing wrong with main
  # or the machines. Filed beside the flakes the other runners found.
  file:
    name: File what no test accounts for
    needs: [engine, hunt, report]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.engine.result == 'failure' || needs.report.result == 'failure' ||
      needs.report.outputs.unexplained == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Flake hunt failing on main
          results: ${{ toJSON(needs) }}
          advice: >-
            The hunt failed in a way no one test's issue holds: the engine's
            build, a runner cut short or lost, an error outside any test, or
            more tests at once than a few flakes would be. The run's summary
            says which, and links one report of every runner, with traces.

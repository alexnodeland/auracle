name: Flake hunt

# Every night, the gate's browser tests three times each, against main, where
# nothing changed but the machine.
#
# The gate (ci.yml) runs each test once with no retries, so a test that fails
# one run in thirty shows up only as a red PR now and then, and is easy to
# re-run past. Here it fails three times as often, and a failure files an
# issue. The fix is to the test or the app; while it is being fixed the test
# can be tagged @quarantine, which moves it from the gate to the Slow suite
# (docs/architecture/testing.md § Flakes).
#
# Its own workflow, not a job in the Slow suite, so its hour never holds that
# workflow's queue on main.
#
# Beside it, the speed budgets (ADR-022): the gate records each as an
# annotation and never fails on one; here they are judged, once a night, on
# main, and the ones over their limit file an issue of their own.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-hunt
  cancel-in-progress: false

jobs:
  # The engine, the fast tier's timings and the image's tag (the Playwright
  # version tests/web/package-lock.json locks), once for the run, as in
  # ci.yml.
  engine:
    name: Engine for the browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: playwright
        uses: ./.github/actions/playwright-version
      - uses: ./.github/actions/web-engine
      - uses: ./.github/actions/browser-timings
        with:
          tier: fast

  # The gate's twelve shards, each run three times over: about twenty
  # minutes a shard, so the job limit leaves room for a slow runner. Four at a
  # time (`max-parallel`), in three rounds of about twenty minutes: it runs at
  # night beside Search health, which holds three runners for hours, and the
  # speed budgets' two, so together they hold nine of the account's 20 and
  # leave a PR's `CI` (16 at its widest) nearly all it needs. At eight wide
  # the hunt would be over sooner but hold thirteen, and a PR pushed then
  # would wait for runners. The Slow suite's nightly run (04:23 UTC, about
  # twenty minutes) is over before this one starts (05:41 UTC).
  hunt:
    name: Flake hunt (${{ matrix.shard }})
    needs: engine
    runs-on: ubuntu-24.04
    # In Playwright's image, as the gate's browser job: the same Chromium and
    # libraries (.github/actions/playwright says why).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.engine.outputs.playwright }}-noble
      options: --ipc=host --init
    # Playwright's global timeout, five minutes under the job's limit; the
    # shard interrupts the run a minute before it, so a shard that runs long
    # still reports its tests and the one it was running (ci.yml's browser
    # job says why). The two numbers move together.
    timeout-minutes: 45
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      # Unseeded: on the gate, a spec on the fixture that names no seed of
      # its own boots seeded (tests/web/fixtures.js SEED, the same pool and
      # sides each run). Here those boot unseeded, so a spec meets pools and
      # offers it has not seen before. A spec that names its own `random:`
      # seed keeps it.
      - uses: ./.github/actions/browser-shard
        env:
          AURACLE_SEED: random
        with:
          tier: fast
          name: hunt
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          args: --grep-invert "@slow|@quarantine" --repeat-each=3

  # The speed budgets, judged (AURACLE_PERF=1): every spec file that records
  # one (`budget(` in it), each test once, its @slow ones too, seeded as on
  # the gate. At a fixed AURACLE_CPU_THROTTLE of 1, the runner as it is: at 2
  # the fixture's slowed worker.js would replace a spec's own (patch_audible's
  # slowed engine, #166), and those budgets would measure something else.
  # Each shard's summary names its CPU, the runners differ by about two times.
  perf:
    name: Speed budgets (${{ matrix.shard }})
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AURACLE_GLOBAL_TIMEOUT_MIN: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine
          path: apps/web/pkg

      - uses: ./.github/actions/playwright

      - name: The specs that record a budget
        id: files
        run: echo "files=$(cd tests/web && grep -lE '\bbudget\(' -- *.spec.js | sed 's|^|/|' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/browser-shard
        env:
          AURACLE_PERF: "1"
          AURACLE_CPU_THROTTLE: "1"
        with:
          tier: fast
          name: perf
          shard: ${{ matrix.shard }}
          index: ${{ strategy.job-index }}
          files: ${{ steps.files.outputs.files }}
          args: --grep-invert "@quarantine"

  perf-report:
    name: Speed budgets report
    needs: perf
    if: ${{ !cancelled() && needs.perf.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: perf
          failed: ${{ needs.perf.result == 'failure' }}

  perf-file:
    name: File the budgets over their limit
    needs: perf
    if: always() && github.event_name == 'schedule' && needs.perf.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Speed budgets over their limit
          results: ${{ toJSON(needs) }}
          advice: >-
            Each budget is how long something took against the limit the app
            was built to (ADR-022). The gate records them and never fails on
            one; this run judged them on main, and the run's summary lists each
            one over its limit, with the CPU each shard ran on. Read whether the
            app got slower or the runner was slow. A failure there that is not
            a budget is the Flake hunt's to find.

  # Which tests failed, and on which of their three runs, in one report.
  report:
    name: Flake hunt report
    needs: hunt
    if: ${{ !cancelled() && needs.hunt.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-report
        with:
          name: hunt
          failed: ${{ needs.hunt.result == 'failure' }}

  file:
    name: File what it found
    needs: [engine, hunt]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/file-issue
        with:
          title: Flake hunt found a flaky test
          results: ${{ toJSON(needs) }}
          advice: >-
            Each of these tests passes the gate on most runs and failed here on
            main, where nothing changed but the machine. The run's summary links
            one report naming each failed test and which of its three runs
            failed, with traces. Fix the test or the app; while it is being
            fixed, tag it @quarantine with a comment naming this issue
            (docs/architecture/testing.md § Flakes).

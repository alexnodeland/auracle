# Keep CI's pinned actions and the browser tests' npm packages current.
#
# Every action in .github is pinned to a commit SHA with its version in a
# trailing comment (`uses: actions/checkout@<sha> # v7.0.1`): a tag can be moved
# to other code, a SHA cannot. Dependabot reads the comment and opens a PR that
# moves both. One grouped PR a week per ecosystem, so updates arrive as one
# reviewable change rather than a dozen. The Rust compiler is not an action:
# rust-toolchain.toml pins it, every job installs it with rustup, and it is
# moved by hand, a PR of its own.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they share (Dependabot reads
    # .github/workflows from `/`, but each composite only from its own
    # directory).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # @playwright/test pins the Chromium the specs run in, and the tag of the
  # Playwright image CI's browser jobs run in, which each workflow's engine job
  # reads from the lockfile (.github/actions/playwright-version): a bump moves
  # both in one PR. It is a real change to what the specs run against: its own
  # run (CI's fast lane) runs the smoke pair in the new image, and the merge
  # queue's run the whole browser tier.
  - package-ecosystem: npm
    directory: /tests/web
    schedule:
      interval: weekly
    groups:
      browser-tests:
        patterns: ["*"]
    commit-message:
      prefix: tests

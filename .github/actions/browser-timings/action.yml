name: Browser timings
description: >
  Main's last timings for a browser tier, read once for the whole run and
  uploaded as the `browser-timings-<tier>` artifact that every runner of the
  tier deals its tests from (tests/web/shard.mjs).

# Once per run, not once per runner: the deal is a partition only if every
# runner reads the same file. Restoring the cache on each runner let a re-run
# of one failed runner, or a save from main landing mid-run, deal from newer
# timings than its siblings had, and a run could then skip tests and pass. An
# artifact is the run's own: a re-run of failed jobs downloads the first
# attempt's.

inputs:
  tier:
    description: "`fast`, `slow` or `perf` (the nightly Speed budgets', each test's time in each browser)"
    required: true
  seed:
    description: >-
      Tiers whose timings stand in while this one has none of its own (its
      first run, or its cache evicted), space-separated: each restored
      earlier in the same job (its own browser-timings step), and merged
      into this tier's file as plain times, which shard.mjs deals a tier
      folded by project by until that project has times of its own
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The newest entry under the prefix (the key itself never matches). Saved
    # from main only (browser-report), so a PR reads main's.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/web/timings-${{ inputs.tier }}.json
        key: browser-timings-${{ inputs.tier }}-${{ github.run_id }}
        restore-keys: browser-timings-${{ inputs.tier }}-

    # None at all (evicted, the first run) is the seed's times where it has
    # one, or else an empty file, which every runner deals by count; either
    # way all from the same file.
    - shell: bash
      env:
        SEED: ${{ inputs.seed }}
      run: |
        f=tests/web/timings-${{ inputs.tier }}.json
        if [ ! -s "$f" ] && [ -n "$SEED" ]; then
          OUT="$f" node -e '
            const fs = require("fs");
            const seeds = process.argv.slice(1).map((t) => `tests/web/timings-${t}.json`).filter((p) => fs.existsSync(p));
            const merged = Object.assign({}, ...seeds.map((p) => JSON.parse(fs.readFileSync(p, "utf8"))));
            fs.writeFileSync(process.env.OUT, JSON.stringify(merged, null, 1) + "\n");
            console.log(`timings: none of its own yet, seeded from ${seeds.join(" and ") || "nothing"}`);
          ' $SEED
        fi
        [ -s "$f" ] || echo '{}' > "$f"
        echo "timings: $(node -e "console.log(Object.keys(require('./$f')).length)") tests with a time"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: browser-timings-${{ inputs.tier }}
        path: tests/web/timings-${{ inputs.tier }}.json
        retention-days: 3
        if-no-files-found: error

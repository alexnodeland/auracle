name: Playwright
description: >
  Node, tests/web's locked dependencies and Playwright's Chromium with the
  runner's system libraries, ready for `npx playwright test` in tests/web.

# The browser download is cached on the lockfile (it pins the Playwright
# version, which pins the Chromium build). The system libraries are apt
# packages outside the cache, so they are installed on every run either way.
#
# Each network step is cut at three minutes, with a message naming the slow
# server: a step that usually takes seconds once took fourteen minutes on a
# slow apt mirror (#162), and the shard was cancelled at its job limit with
# no report. A composite action's steps take no `timeout-minutes`, so the
# commands run under coreutils' `timeout`.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: tests/web/package-lock.json

    - name: Install tests/web's dependencies
      shell: bash
      run: |
        cd tests/web
        timeout -k 10 180 npm ci --no-audit --no-fund || {
          s=$?
          if [ "$s" = 124 ] || [ "$s" = 137 ]; then
            echo "::error::npm ci took over three minutes: the npm registry (registry.npmjs.org) is slow or unreachable from this runner, not the change. Re-run the job."
          fi
          exit "$s"
        }

    - id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('tests/web/package-lock.json') }}

    - name: Install Playwright's Chromium
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd tests/web
        timeout -k 10 180 npx playwright install --with-deps chromium || {
          s=$?
          if [ "$s" = 124 ] || [ "$s" = 137 ]; then
            echo "::error::Installing Chromium took over three minutes: Playwright's download server or the runner's Ubuntu package mirror (apt) is slow, not the change (#162). Re-run the job."
          fi
          exit "$s"
        }

    - name: Install Chromium's system libraries
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: |
        cd tests/web
        timeout -k 10 180 npx playwright install-deps chromium || {
          s=$?
          if [ "$s" = 124 ] || [ "$s" = 137 ]; then
            echo "::error::Chromium's system libraries took over three minutes to install: the runner's Ubuntu package mirror (apt) is slow, not the change (#162). Re-run the job."
          fi
          exit "$s"
        }

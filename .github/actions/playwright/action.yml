name: Playwright
description: >
  Node, tests/web's locked dependencies and Playwright's Chromium with the
  runner's system libraries, ready for `npx playwright test` in tests/web.

# The browser download is cached on the lockfile (it pins the Playwright
# version, which pins the Chromium build). The system libraries are apt
# packages outside the cache, so they are installed on every run either way.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: tests/web/package-lock.json

    - name: Install tests/web's dependencies
      shell: bash
      run: cd tests/web && npm ci --no-audit --no-fund

    - id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('tests/web/package-lock.json') }}

    - name: Install Playwright's Chromium
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: cd tests/web && npx playwright install --with-deps chromium

    - name: Install Chromium's system libraries
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: cd tests/web && npx playwright install-deps chromium

name: Web engine
description: >
  apps/web/pkg for this commit, built once per workflow run and uploaded as the
  `web-engine` artifact for the browser shards to download. Restored from the
  cache when no input of the wasm build changed, built otherwise.

# Every browser shard used to install Rust and build the wasm itself: about a
# minute and a half each, five times over, for the same bytes. Now one job
# builds it and the shards download it.
#
# The cache key is every input of `make wasm`: the crates, the workspace
# manifest and lockfile (profiles live in Cargo.toml), the Makefile (the wasm
# stack size and flags) and a toolchain pin if one is ever added. A PR that
# touches only apps/web or tests/web restores main's build and skips the Rust
# toolchain entirely. It does not key on the stable compiler's version, which
# moves under a fixed key between releases; a new stable changes the wasm's
# bytes, not what the app does.
#
# On a hit the pkg is re-stamped, because pkg/build.json is a hash over the
# engine AND the app scripts (see the Makefile's `wasm-stamp`), and the app
# scripts are this commit's, not the ones of the run that saved the cache.

runs:
  using: composite
  steps:
    - id: pkg
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/web/pkg
        key: web-engine-${{ runner.os }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'Makefile', 'rust-toolchain*') }}

    - if: steps.pkg.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - if: steps.pkg.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - if: steps.pkg.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
      with:
        tool: wasm-pack

    - name: Build the engine for the browser
      if: steps.pkg.outputs.cache-hit != 'true'
      shell: bash
      run: make wasm

    - name: Stamp the cached engine against this commit's app scripts
      if: steps.pkg.outputs.cache-hit == 'true'
      shell: bash
      run: make -s wasm-stamp

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: web-engine
        path: apps/web/pkg/
        retention-days: 3
        if-no-files-found: error

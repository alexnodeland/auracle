name: Browser shard
description: >
  One runner's share of a browser tier: the tests tests/web/shard.mjs deals
  this runner from the run's timings (the `browser-timings-<tier>` artifact),
  run against apps/web/pkg (download the web-engine artifact first, and run
  ./.github/actions/playwright). Keeps the runner's blob report for the run's
  merged report.

inputs:
  tier:
    description: "`fast` or `slow`: which timings to deal by"
    required: true
  name:
    description: "The blob artifacts' prefix, one per set of runners in a run (`fast`, `slow`, `hunt`)"
    required: true
  shard:
    description: "This runner, as k/N"
    required: true
  index:
    description: "The matrix job's index (strategy.job-index), for unique artifact names"
    required: true
  args:
    description: "Playwright's options: the tier's --grep, --repeat-each (no spec files: see `files`)"
    required: true
  files:
    description: "Spec files to narrow the tier to (anchored, `/name.spec.js`), space-separated; empty for all"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: browser-timings-${{ inputs.tier }}
        path: tests/web

    # Its own port, so the run can never be served by anything else.
    - name: Run this runner's tests
      shell: bash
      env:
        AURACLE_TEST_PORT: "8690"
        PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ inputs.name }}-${{ inputs.index }}.zip
      run: cd tests/web && node shard.mjs run --shard "${{ inputs.shard }}" --timings "timings-${{ inputs.tier }}.json" --files "${{ inputs.files }}" -- ${{ inputs.args }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: blob-${{ inputs.name }}-${{ inputs.index }}
        path: tests/web/blob-report/
        retention-days: 7
        if-no-files-found: ignore

name: File an issue
description: >
  A failure on main nobody is watching, filed as an issue: one open issue per
  title, commented on by every further failing run until someone closes it;
  or, given an issue's number, a comment on that issue (a quarantined test's
  own). The job needs `permissions: issues: write`, and checks out first (the
  script is file-issue.js, beside this file).

inputs:
  title:
    description: "The issue's title, which is also how a later run finds it; not used with `issue`"
    required: false
    default: ""
  issue:
    description: "An issue's number to comment on instead, whatever its title; nothing is opened"
    required: false
    default: ""
  results:
    description: "toJSON(needs) of the calling job: the failed jobs are named (unless `failed` says what failed)"
    required: false
    default: "{}"
  failed:
    description: "What failed, in place of the jobs `results` names (markdown, one line)"
    required: false
    default: ""
  detail:
    description: "Markdown under that line: what the failure said"
    required: false
    default: ""
  labels:
    description: "Labels for an issue this opens, comma-separated"
    required: false
    default: ""
  advice:
    description: "What to do about it, after the run's link"
    required: true
  run:
    description: >-
      What the run was, to begin the issue: "The weekly run". Left out, a
      scheduled run is "The nightly run" and any other "The push"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TITLE: ${{ inputs.title }}
        ISSUE: ${{ inputs.issue }}
        RESULTS: ${{ inputs.results }}
        FAILED: ${{ inputs.failed }}
        DETAIL: ${{ inputs.detail }}
        LABELS: ${{ inputs.labels }}
        ADVICE: ${{ inputs.advice }}
        RUN: ${{ inputs.run }}
        SCRIPT: ${{ github.action_path }}/file-issue.js
      with:
        script: |
          const { fileIssue } = require(process.env.SCRIPT);
          await fileIssue({ github, context, core });

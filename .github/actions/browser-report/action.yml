name: Browser report
description: >
  A run's browser runners merged: one HTML report (every test, the traces of
  what failed) uploaded as `browser-report-<name>` when a runner failed, the
  speed budgets recorded over their limit listed in the run's summary (and
  in the output `budgets`, cut to fit an issue's comment), and, when asked,
  the run's times folded into the tier's timings for the next run's deal.

inputs:
  name:
    description: "The blob artifacts' prefix (`fast`, `slow`, `hunt`, `perf`)"
    required: true
  failed:
    description: "'true' when a runner of this set failed: upload the HTML report"
    required: true
  timings:
    description: >-
      The tier whose timings these times update (`fast`, `slow`, `perf`); empty for
      none. On main they are saved to the cache; on any other ref, where a
      saved cache would be that ref's alone, they are uploaded as
      `browser-timings-folded-<tier>` for main's run to save (ci.yml's
      changes job, once main reuses the merge queue's run)
    required: false
    default: ""
  timings-options:
    description: >-
      Options for the fold (`shard.mjs timings`): `--by-project` for a tier
      that runs in more than one browser and deals each by its own times,
      `--failed` to count a run that failed or timed out too
    required: false
    default: ""
  failures:
    description: >-
      'true' to list beside the budgets each test that failed on something
      other than a budget, or was interrupted (the nightly Speed budgets
      job's, where nothing else lists them)
    required: false
    default: ""
  through-cancel:
    description: >-
      'true' to run to the end through a cancel of the job that comes while
      the report runs: ci.yml's `CI`, whose report a red batch's run keeps
      when the queue's next run cancels it. Empty, such a cancel stops the
      step then running and skips the rest, as it would with no `if` here.
      Either way a step that fails skips the rest
    required: false
    default: ""

outputs:
  budgets:
    description: >-
      The budgets over their limit (and the failures, when asked) as
      markdown, cut to fit an issue's comment; empty with no merged report
    value: ${{ steps.budgets.outputs.markdown }}

runs:
  using: composite
  steps:
    # Each step's `if` reads the action's own status, `action_status`, which
    # is what `success()` and `failure()` read inside a composite action, so
    # a step that fails skips the rest. When the job is cancelled, the runner
    # sets it to cancelled for the step then running and asks that step's
    # `if` again, stopping the step if it no longer holds (actions/runner,
    # CompositeActionHandler.cs, RunStepsAsync). With `through-cancel` empty
    # the `if` is `success()`, as with none: the step stops, the action's
    # status is then cancelled, and the rest are skipped. Set, `!failure()`
    # still holds, so the step carries on and the rest run as they would
    # have.
    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: tests/web/package-lock.json

    # Playwright's package for merge-reports; no browser.
    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) }}
      shell: bash
      run: cd tests/web && npm ci --no-audit --no-fund

    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: blob-${{ inputs.name }}-*
        path: tests/web/all-blobs
        merge-multiple: true

    - name: Merge the runners' reports
      if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) }}
      shell: bash
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        PLAYWRIGHT_HTML_OPEN: never
        PLAYWRIGHT_JSON_OUTPUT_FILE: merged.json
      run: |
        cd tests/web
        if ! ls all-blobs/*.zip >/dev/null 2>&1; then
          echo "no runner wrote a report"; exit 0
        fi
        npx playwright merge-reports --reporter html,json all-blobs

    # The speed budgets (ADR-022) the runs recorded over their limit, in the
    # run's summary: on the gate they are recorded, never judged. The same,
    # cut to fit, is the step's output, for the comment the nightly Speed
    # budgets job files.
    - name: Budgets over their limit
      id: budgets
      if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) }}
      shell: bash
      run: |
        cd tests/web
        [ -f merged.json ] || exit 0
        node shard.mjs budgets ${{ inputs.failures == 'true' && '--failures' || '' }} --out budgets.md merged.json
        d="BUDGETS_$(openssl rand -hex 8)"
        { echo "markdown<<$d"; cat budgets.md; echo "$d"; } >> "$GITHUB_OUTPUT"

    - id: upload
      if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) && inputs.failed == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: browser-report-${{ inputs.name }}
        path: tests/web/playwright-report/
        retention-days: 14
        if-no-files-found: ignore

    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) && inputs.failed == 'true' && steps.upload.outputs.artifact-url != '' }}
      shell: bash
      run: |
        {
          echo "### Browser tests (${{ inputs.name }}) failed"
          echo
          echo "Every runner's results in one report, with the failed tests' traces:"
          echo "[browser-report-${{ inputs.name }}](${{ steps.upload.outputs.artifact-url }})."
          echo "Unzip it and run \`npx playwright show-report <dir>\` in tests/web."
        } >> "$GITHUB_STEP_SUMMARY"

    # The times for the next run's deal: folded into main's last timings and
    # saved under a new key (a cache entry is immutable), which the next run's
    # browser-timings restores by prefix. A failure here costs the next run its
    # balance, not its answer.
    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) && inputs.timings != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/web/timings-${{ inputs.timings }}.json
        key: browser-timings-${{ inputs.timings }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: browser-timings-${{ inputs.timings }}-

    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) && inputs.timings != '' }}
      shell: bash
      run: |
        cd tests/web
        [ -f merged.json ] || { echo "no merged report; timings unchanged"; exit 0; }
        node shard.mjs timings --out "timings-${{ inputs.timings }}.json" ${{ inputs.timings-options }} merged.json

    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) && inputs.timings != '' && github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/web/timings-${{ inputs.timings }}.json
        key: browser-timings-${{ inputs.timings }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Elsewhere (the merge queue's run), kept for main: a cache saved from a
    # pull_request run is restored by that PR's runs only.
    - if: ${{ !failure() && (inputs.through-cancel == 'true' || success()) && inputs.timings != '' && github.ref != 'refs/heads/main' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: browser-timings-folded-${{ inputs.timings }}
        path: tests/web/timings-${{ inputs.timings }}.json
        retention-days: 3
        if-no-files-found: ignore

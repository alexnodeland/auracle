name: Browser report
description: >
  A run's browser runners merged: one HTML report (every test, the traces of
  what failed) uploaded as `browser-report-<name>` when a runner failed, the
  speed budgets recorded over their limit listed in the run's summary, and,
  when asked, the run's times folded into the tier's timings for the next
  run's deal.

inputs:
  name:
    description: "The blob artifacts' prefix (`fast`, `slow`, `hunt`)"
    required: true
  failed:
    description: "'true' when a runner of this set failed: upload the HTML report"
    required: true
  timings:
    description: >-
      The tier whose timings these times update (`fast`, `slow`); empty for
      none. On main they are saved to the cache; on any other ref, where a
      saved cache would be that ref's alone, they are uploaded as
      `browser-timings-folded-<tier>` for main's run to save (ci.yml's
      changes job, once main reuses the merge queue's run)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: tests/web/package-lock.json

    # Playwright's package for merge-reports; no browser.
    - shell: bash
      run: cd tests/web && npm ci --no-audit --no-fund

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: blob-${{ inputs.name }}-*
        path: tests/web/all-blobs
        merge-multiple: true

    - name: Merge the runners' reports
      shell: bash
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        PLAYWRIGHT_HTML_OPEN: never
        PLAYWRIGHT_JSON_OUTPUT_FILE: merged.json
      run: |
        cd tests/web
        if ! ls all-blobs/*.zip >/dev/null 2>&1; then
          echo "no runner wrote a report"; exit 0
        fi
        npx playwright merge-reports --reporter html,json all-blobs

    # The speed budgets (ADR-022) the runs recorded over their limit, in the
    # run's summary: on the gate they are recorded, never judged.
    - name: Budgets over their limit
      shell: bash
      run: |
        cd tests/web
        [ -f merged.json ] || exit 0
        node shard.mjs budgets merged.json

    - id: upload
      if: inputs.failed == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: browser-report-${{ inputs.name }}
        path: tests/web/playwright-report/
        retention-days: 14
        if-no-files-found: ignore

    - if: inputs.failed == 'true' && steps.upload.outputs.artifact-url != ''
      shell: bash
      run: |
        {
          echo "### Browser tests (${{ inputs.name }}) failed"
          echo
          echo "Every runner's results in one report, with the failed tests' traces:"
          echo "[browser-report-${{ inputs.name }}](${{ steps.upload.outputs.artifact-url }})."
          echo "Unzip it and run \`npx playwright show-report <dir>\` in tests/web."
        } >> "$GITHUB_STEP_SUMMARY"

    # The times for the next run's deal: folded into main's last timings and
    # saved under a new key (a cache entry is immutable), which the next run's
    # browser-timings restores by prefix. A failure here costs the next run its
    # balance, not its answer.
    - if: inputs.timings != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/web/timings-${{ inputs.timings }}.json
        key: browser-timings-${{ inputs.timings }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: browser-timings-${{ inputs.timings }}-

    - if: inputs.timings != ''
      shell: bash
      run: |
        cd tests/web
        [ -f merged.json ] || { echo "no merged report; timings unchanged"; exit 0; }
        node shard.mjs timings --out "timings-${{ inputs.timings }}.json" merged.json

    - if: inputs.timings != '' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/web/timings-${{ inputs.timings }}.json
        key: browser-timings-${{ inputs.timings }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Elsewhere (the merge queue's run), kept for main: a cache saved from a
    # pull_request run is restored by that PR's runs only.
    - if: inputs.timings != '' && github.ref != 'refs/heads/main'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: browser-timings-folded-${{ inputs.timings }}
        path: tests/web/timings-${{ inputs.timings }}.json
        retention-days: 3
        if-no-files-found: ignore

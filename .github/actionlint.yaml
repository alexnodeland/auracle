# actionlint's own configuration (https://github.com/rhysd/actionlint).
#
# actionlint 1.7.12, the latest release, does not know concurrency's `queue`
# key (rhysd/actionlint#654), which GitHub accepts since May 2026 ("Control
# the concurrency of workflows and jobs"). ci.yml and slow-suite.yml use it
# to say that main keeps only its newest waiting run (`queue: single`, the
# default, written out); mutants.yml, that main runs every waiting run in
# turn (`queue: max`: each is a different part of the workspace). Drop this
# once a release knows the key.
paths:
  .github/workflows/ci.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/slow-suite.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/mutants.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'

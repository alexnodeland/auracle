<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auracle | Brand rasters</title>
<!--
  The source of lockup.png and og.png.

  Both set the LOGOTYPE, so neither can come out of an SVG renderer: they need
  real Jost outlines. They come out of a browser instead.

      python3 -m http.server 8080          # from the repo root
      open http://localhost:8080/www/brand/render.html

  Then screenshot the two elements, `#banner` and `#og`, at a device scale of
  1, and save them over www/brand/lockup.png and www/brand/og.png. Any tool
  that can screenshot a single element will do (Playwright's
  `locator('#og').screenshot()` from tests/web/node_modules, run through
  www/video/tools/one_browser.sh like every browser job); the sizes below are
  already the final pixel dimensions, so nothing needs scaling afterwards.

  Both carry the line from www/brand/voice.md: the banner sets the tagline
  under the wordmark, and the card sets the tagline with the descriptor under
  it. Change the line there and these change with it.

  #banner is drawn at 2x (1440x360) and displayed at 720 in the README, because
  a 1x banner is visibly soft on a retina screen. #og is exactly 1200x630, the
  size Open Graph wants, which is already 2x for how it is displayed.

  Fonts are read from apps/web/fonts, the one place the faces live. The colors
  and families are the brand page's tokens, generated into the block below
  from www/brand/tokens.json by `make tokens`.
-->
<style>
@font-face {
  font-family: "Jost";
  src: url("../../apps/web/fonts/jost-var.woff2") format("woff2-variations");
  font-weight: 100 900;
  font-display: block;
}
@font-face {
  font-family: "IBM Plex Mono";
  src: url("../../apps/web/fonts/plexmono-400.woff2") format("woff2");
  font-weight: 400;
  font-display: block;
}

/* tokens:begin: generated from www/brand/tokens.json by `make tokens`. Edit the JSON, not this block. */
:root {
  /* grounds */
  --rack: #0c0d10;     /* the void behind the rack */
  --panel: #171a1f;    /* graphite faceplate */
  --panel-hi: #1d2127; /* raised surface */
  --bezel: #07080a;    /* screen bezels */
  --hairline: #292e36;

  /* machined graphite: the two faces of every raised control and the ink of
     the shadow under it, one literal each, so a retune is one line */
  --plate-hi: #232830;     /* util buttons, selects: top of the face */
  --plate-lo: #181b21;     /*   …and the bottom */
  --btn-hi: #2a2f37;       /* hardware buttons and pads: top of the face */
  --btn-lo: #1a1d23;       /*   …and the bottom */
  --btn-hover-hi: #333944; /* the same face under a pointer: one step up */
  --btn-hover-lo: #1e2228;
  --shadow-ink: #0a0b0d;   /* the hard shadow line under a raised control */
  --knob-body: #22262d;    /* PERFORM's knob caps */

  /* shared shades: one value, used on more than one surface */
  --rack-lo: #0a0b0e;   /* below the rack: the landing page's foot, the docs' sidebar */
  --panel-lo: #12151a;  /* the foot of a raised panel; the docs' quotes and search results */
  --pop-lo: #14161a;    /* the foot of a floating surface and of the menu bar; the docs' pop-ups */
  --recess-hi: #14171b; /* the top of a recessed panel (bank, node bank); a screw's shadow; an empty tile */
  --lifted: #1a1e24;    /* a lifted strip: a held tray item's top, a table's header row */
  --amber-off: #1a1410; /* an unlit amber cell: pips, lock dots */
  --steel: #3a3f47;     /* bare steel: a screw head's highlight; the docs' scrollbar */

  /* silk: warm silkscreen ink */
  --silk: #d9d4c8;      /* 13.1:1 on rack */
  --silk-dim: #9a958a;  /*  5.9:1: all dimmed TEXT */
  --silk-mute: #6f6c63; /*  non-text only: hairlines, disabled glyphs */

  /* green phosphor: sound. `-dim` is the text tier, `-deep` the stroke tier */
  --phos-a: #8ef0b1;      /* 14.1:1 */
  --phos-a-dim: #63a97c;  /*  5.2:1: knob values, readouts */
  --phos-a-deep: #3d6a4d; /*  strokes and fills only */

  /* amber phosphor: the model's mind */
  --phos-b: #ffb454;      /* 11.0:1 */
  --phos-b-dim: #b8823c;  /*  5.4:1: lineage log, notes */
  --phos-b-deep: #7a5526; /*  strokes and fills only */

  /* danger */
  --led-red: #ff5747;

  /* light and shadow: never ink */
  --black: #000000; /* shadow lines, the edge under a raised control, masks */
  --white: #ffffff; /* highlights only, at an opacity; as ink it reads cold against silk */

  /* brand: shades only this surface uses */
  --paper-stock: #e8e6e0;      /* the stock the mark is shown on, to prove the tile does not invert (not the docs' Paper) */
  --paper-stock-edge: #c9c6bd; /*   …its edge */
  --paper-ink: #1b1a18;        /*   …the logotype printed on it */
  --paper-ink-dim: #6b6862;    /*   …a caption printed on it */

  /* opacities: `--phos-b-30` is --phos-b at 30%; a third digit is a tenth
     (`--phos-a-045` is 4.5%) */
  --white-07: rgba(255, 255, 255, 0.07);
  --rack-86: rgba(12, 13, 16, 0.86);
  --led-red-30: rgba(255, 87, 71, 0.3);
  --led-red-35: rgba(255, 87, 71, 0.35);

  /* families */
  --font-silk: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-voice: "Newsreader", Georgia, "Times New Roman", serif;

  /* type: one ratio (1.2) and six roles. The steps run up from the value size,
     12 × 1.2ⁿ rounded: 12, 14, 17, 21, and 52 at n = 8. Labels sit under the
     scale at 11 px, the floor for text in a page; the rack, drawn to its zoom,
     has sizes of its own, and a lone glyph is sized to its button */
  --t-label: 11px;    /* silk caps: panel labels, tabs, buttons; the floor for text */
  --t-value: 12px;    /* mono values, readouts, small print */
  --t-body: 0.875rem; /* brand: 14 px, in rem, so the spec's prose and tables follow the reader's font size */
  --t-voice: 17px;    /* the model speaking (Newsreader italic), and nothing else */
  --t-title: 21px;    /* a title: a sound's name, a card's heading, the wordmark */
  --t-display: 52px;  /* a level's one headline */
  --t-canvas: 12px;   /* the smallest text drawn on a canvas (TA20 found 10 px too small) */

  /* space: a 4 px grid to 16, then wider. Under the first step (1 to 3 px) is
     an optical nudge, not a space, and is written as it is */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;

  /* radius: three. A circle is 50% and a pill 999px, shapes rather than steps;
     1 to 3 px is a hairline's rounding */
  --r1: 4px;  /* a row, a chip, a small control */
  --r2: 8px;  /* a button, a pad, a card */
  --r3: 14px; /* the well, a sheet */

  /* motion: four durations and two easings. Under prefers-reduced-motion every
     duration is 0 ms. A loop's period is not one of these */
  --d-press: 90ms;                /* a press: a control going down, a row lighting */
  --d-state: 180ms;               /* a state changing: a color, a hover, a reveal */
  --d-move: 320ms;                /* something moving: a view, a panel, a card arriving */
  --d-zoom: 620ms;                /* a move between the levels, the sound's face carried across (the specimen's morph) */
  --e-settle: cubic-bezier(0.2, 0.8, 0.2, 1); /* arriving and coming to rest */
  --e-swap: cubic-bezier(0.6, 0, 0.2, 1); /* one thing giving way to another */

  /* brand: sizes only this surface uses */
  --t-headline: clamp(2rem, 4.4vw, 3.1rem); /* the page's headline, as the landing page's display line is its own (--t-display is the specimen's 52 px) */
  --t-h2: clamp(1.4rem, 2.8vw, 1.95rem); /* a section's heading */
  --t-micro: 11px;                /* mono captions, at the floor */
  --s8: 72px;                     /* between sections */
}
@media (prefers-reduced-motion: reduce) {
  :root { --d-press: 0ms; --d-state: 0ms; --d-move: 0ms; --d-zoom: 0ms; }
}
/* tokens:end */

*, *::before, *::after { box-sizing: border-box; }
/* Bare steel, so the edges of both artboards are obvious while shooting. */
body { margin: 0; background: var(--steel); font-family: var(--font-silk); -webkit-font-smoothing: antialiased; }

/* The lockup rule, identical to the one in index.html. */
.lk { display: inline-flex; align-items: center; gap: .62em; font-weight: 500; line-height: 1; white-space: nowrap; color: var(--silk); }
.lk .glyph { width: 1.28em; height: 1.28em; flex: none; transform: translateY(-.035em); }
.lk .wm { letter-spacing: .095em; }

#banner {
  width: 1440px; height: 360px; background: var(--rack);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; /* token-exempt: lockup.png's geometry, drawn at this size for the README */
}
/* Both lines carry a start margin of one letter-space. letter-spacing is
   applied after the *final* letter too, so a centered line's ink sits half a
   letter-space left of true center; a start margin of one full space puts it
   back. It goes on the lockup rather than on .wm, or it would open the
   specified 0.62em gap between the mark and the word. */
#banner .lk { font-size: 88px; /* token-exempt: lockup.png's geometry, drawn at this size for the README */ margin-inline-start: .095em; }
#banner .tag {
  font-family: var(--font-mono); font-size: 22px; /* token-exempt: lockup.png's geometry, drawn at this size for the README */ letter-spacing: .24em;
  margin-inline-start: .24em;
  text-transform: uppercase; color: var(--silk-mute);
}

#og {
  width: 1200px; height: 630px; background: var(--rack);
  padding: 88px 92px; /* token-exempt: og.png's geometry, drawn at this size for the 1200 by 630 card */ display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
/* One flourish: the mark's own rings at poster scale, bled off the right
   edge. The aura, not a decoration borrowed from somewhere else. */
#og .halo { position: absolute; right: -250px; top: 50%; transform: translateY(-50%); width: 760px; height: 760px; }
#og .head { position: relative; z-index: 1; }
#og .head .lk { font-size: 40px; } /* token-exempt: og.png's geometry, drawn at this size for the 1200 by 630 card */
/* The line: the tagline as the display, the descriptor under it in plain
   Jost, as the landing page's hero sets them. */
#og .display {
  position: relative; z-index: 1; margin: auto 0 0; max-width: 15ch;
  font-size: 76px; /* token-exempt: og.png's geometry, drawn at this size for the 1200 by 630 card */ font-weight: 300; letter-spacing: -.022em; line-height: 1.06; color: var(--silk);
}
#og .display b { font-weight: 300; color: var(--phos-a); }
#og .desc {
  position: relative; z-index: 1; margin: 30px 0 0; /* token-exempt: og.png's geometry, drawn at this size for the 1200 by 630 card */ max-width: 36ch;
  font-size: 27px; /* token-exempt: og.png's geometry, drawn at this size for the 1200 by 630 card */ font-weight: 300; line-height: 1.4; color: var(--silk-dim);
}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
  <symbol id="mark" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7" style="fill: var(--rack)"/>
    <circle cx="16" cy="16" r="12" fill="none" stroke-width="2.2" style="stroke: var(--phos-a-deep)"/>
    <circle cx="16" cy="16" r="7.4" fill="none" stroke-width="2.6" style="stroke: var(--phos-a)"/>
    <circle cx="16" cy="16" r="3" style="fill: var(--phos-b)"/>
  </symbol>
</defs></svg>

<div id="banner">
  <span class="lk"><svg class="glyph"><use href="#mark"/></svg><span class="wm">AURACLE</span></span>
  <span class="tag">A synthesizer that grows toward you</span>
</div>

<div id="og">
  <svg class="halo" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="12" fill="none" stroke-width="1.1" opacity=".45" style="stroke: var(--phos-a-deep)"/>
    <circle cx="16" cy="16" r="7.4" fill="none" stroke-width="1.3" opacity=".3" style="stroke: var(--phos-a)"/>
    <circle cx="16" cy="16" r="3" opacity=".09" style="fill: var(--phos-b)"/>
  </svg>
  <div class="head">
    <span class="lk"><svg class="glyph"><use href="#mark"/></svg><span class="wm">AURACLE</span></span>
  </div>
  <p class="display">A synthesizer that grows <b>toward you</b></p>
  <p class="desc">Pick the sound you&rsquo;d reach for. It learns your ear, and every generation grows a little closer.</p>
</div>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand rasters — render source</title>
<!--
  The source of lockup.png and og.png.

  Both set the LOGOTYPE, so neither can come out of an SVG renderer: they need
  real Jost outlines. They come out of a browser instead.

      python3 -m http.server 8080          # from the repo root
      open http://localhost:8080/www/brand/render.html

  Then screenshot the two elements — `#banner` and `#og` — at CSS scale, and
  save them over www/brand/lockup.png and www/brand/og.png. Any tool that can
  screenshot a single element will do; the sizes below are already the final
  pixel dimensions, so nothing needs scaling afterwards.

  #banner is drawn at 2x (1440x360) and displayed at 720 in the README, because
  a 1x banner is visibly soft on a retina screen. #og is exactly 1200x630, the
  size Open Graph wants, which is already 2x for how it is displayed.

  Fonts are read from apps/web/fonts, the one place the faces live.
-->
<style>
@font-face {
  font-family: "Jost";
  src: url("../../apps/web/fonts/jost-var.woff2") format("woff2-variations");
  font-weight: 100 900;
  font-display: block;
}
@font-face {
  font-family: "IBM Plex Mono";
  src: url("../../apps/web/fonts/plexmono-400.woff2") format("woff2");
  font-weight: 400;
  font-display: block;
}

:root {
  --rack: #0c0d10;
  --silk: #d9d4c8; --silk-mute: #6f6c63;
  --phos-a: #8ef0b1; --phos-a-deep: #3d6a4d; --phos-b: #ffb454;
  --font-silk: "Jost", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
*, *::before, *::after { box-sizing: border-box; }
/* Mid grey so the edges of both artboards are obvious while shooting. */
body { margin: 0; background: #333; font-family: var(--font-silk); -webkit-font-smoothing: antialiased; }

/* The lockup rule, identical to the one in index.html. */
.lk { display: inline-flex; align-items: center; gap: .62em; font-weight: 500; line-height: 1; white-space: nowrap; color: var(--silk); }
.lk .glyph { width: 1.28em; height: 1.28em; flex: none; transform: translateY(-.035em); }
.lk .wm { letter-spacing: .095em; }

#banner {
  width: 1440px; height: 360px; background: var(--rack);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
}
/* Both lines carry a start margin of one letter-space. letter-spacing is
   applied after the *final* letter too, so a centred line's ink sits half a
   letter-space left of true centre; a start margin of one full space puts it
   back. It goes on the lockup rather than on .wm, or it would open the
   specified 0.62em gap between the mark and the word. */
#banner .lk { font-size: 88px; margin-inline-start: .095em; }
#banner .tag {
  font-family: var(--font-mono); font-size: 22px; letter-spacing: .24em;
  margin-inline-start: .24em;
  text-transform: uppercase; color: var(--silk-mute);
}

#og {
  width: 1200px; height: 630px; background: var(--rack);
  padding: 88px 92px; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
/* One flourish: the mark's own rings at poster scale, bled off the right
   edge. The aura, not a decoration borrowed from somewhere else. */
#og .halo { position: absolute; right: -250px; top: 50%; transform: translateY(-50%); width: 760px; height: 760px; }
#og .head { position: relative; z-index: 1; }
#og .head .lk { font-size: 40px; }
#og .display {
  position: relative; z-index: 1; margin: auto 0 0; max-width: 15ch;
  font-size: 78px; font-weight: 300; letter-spacing: -.022em; line-height: 1.06; color: var(--silk);
}
#og .display b { font-weight: 300; color: var(--phos-a); }
#og .foot {
  position: relative; z-index: 1; margin-top: 40px;
  display: flex; gap: 28px; align-items: baseline;
  font-family: var(--font-mono); font-size: 17px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--silk-mute);
}
#og .foot .dot { color: var(--phos-a-deep); }
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
  <symbol id="mark" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="7" fill="#0c0d10"/>
    <circle cx="16" cy="16" r="12" fill="none" stroke="#3d6a4d" stroke-width="2.2"/>
    <circle cx="16" cy="16" r="7.4" fill="none" stroke="#8ef0b1" stroke-width="2.6"/>
    <circle cx="16" cy="16" r="3" fill="#ffb454"/>
  </symbol>
</defs></svg>

<div id="banner">
  <span class="lk"><svg class="glyph"><use href="#mark"/></svg><span class="wm">AURACLE</span></span>
  <span class="tag">A synthesizer that searches for your sound</span>
</div>

<div id="og">
  <svg class="halo" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#3d6a4d" stroke-width="1.1" opacity=".45"/>
    <circle cx="16" cy="16" r="7.4" fill="none" stroke="#8ef0b1" stroke-width="1.3" opacity=".3"/>
    <circle cx="16" cy="16" r="3" fill="#ffb454" opacity=".09"/>
  </svg>
  <div class="head">
    <span class="lk"><svg class="glyph"><use href="#mark"/></svg><span class="wm">AURACLE</span></span>
  </div>
  <p class="display">It plays you two patches. You pick <b>one</b>.</p>
  <div class="foot">
    <span>It learns, and makes more of it</span>
    <span class="dot">&bull;</span>
    <span>Runs in the browser</span>
  </div>
</div>

</body>
</html>

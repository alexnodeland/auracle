<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Auracle">
  <!-- The wordmark's lamp, alone: a green phosphor ring on the rack void with
       the amber pip that means the model is listening. At 16px nothing more
       survives, and a two-phosphor mark is the whole identity in one glyph. -->
  <rect width="32" height="32" rx="6" fill="#0c0d10"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#3d6a4d" stroke-width="2.5"/>
  <path d="M16 7a9 9 0 0 1 8.49 6" fill="none" stroke="#8ef0b1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3" fill="#ffb454"/>
</svg>

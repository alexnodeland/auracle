# What the Rust tests need from nextest's pool. `make test`, CI's tiers
# (`make test-fast-tier`, the Coverage jobs, the Slow suite) and
# cargo-mutants all run nextest, and it reads this file from the workspace
# root. docs/architecture/testing.md § The local loop says what each part
# bought, measured.
#
# Which test is slow (the CI tiers) is named in the Makefile (SEARCH_FLOOR,
# SLOW_TESTS) and nowhere else; nothing here moves a test between tiers.

[profile.default]
# A test running past a minute is reported as slow, every minute it runs,
# and stopped at twenty: a hung test ends with its name in the report,
# instead of holding the run until someone stops it. Generous, because a
# workstation is shared: on a 16-core Mac at a load average of 90 to 150,
# the longest fast-tier test took 170 s and the search floor 422 s.
slow-timeout = { period = "60s", terminate-after = 20 }

# CI's runs (NEXTEST_PROFILE=ci, set in ci.yml and slow-suite.yml): stopped
# at ten minutes, so a hung test ends inside its job's limit (twenty minutes
# for a Coverage runner) and the job reports it, where the limit would cut
# the job off with no report. On a runner the longest fast-tier test took
# 70 s, instrumented (a queue run on Oct 6), and the longest slow one about
# three minutes, the search floor aside. The JUnit file (junit.xml under
# nextest's ci directory in the target directory) has every test's time.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

# Tests that start threads of their own declare how many (`threads-required`):
# nextest counts a test as one thread, and beside fifteen others a test's
# own threads oversubscribe the machine, so it and every test around it run
# slower than alone, and a test's time stops saying what it costs. Declared,
# the test takes that many of the pool's slots (all of them, at most).
#
# Declared is a test whose work runs in threads of its own for the whole
# test: one per seed, preset or core. A test that starts them for one phase
# is left at one: the generation tests (an engine taught on one thread, then
# its five walks at once, `farm_walks`) measured about two busy threads over
# their run, and declared at five they would hold the slots idle through the
# rest, in CI's fast tier too.
#
# These overrides are the default profile's, so the ci profile has them too.

# The search floor: sixteen seeds, a thread each. Its own limit, since on a
# slow runner it can come near ten minutes (about five and a half on a
# typical one).
[[profile.default.overrides]]
filter = 'test(=engine::tests::refinement_improves_pool)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 20 }

# A thread per core (`available_parallelism`).
[[profile.default.overrides]]
filter = 'test(=file::tests::the_mask_is_what_survives_a_recording) | test(=shipped_preset_wirings_measure_the_same_today)'
threads-required = "num-test-threads"

# A thread for each seed, preset or session.
[[profile.default.overrides]]
filter = 'test(=engine::tests::closed_loop_learns_synthetic_taste)'
threads-required = 5

[[profile.default.overrides]]
filter = 'test(=perform::tests::named_controls_move_the_sound_they_name)'
threads-required = 4

[[profile.default.overrides]]
filter = """
test(=engine::tests::closed_loop_learns_motion_rate)
| test(=guess::tests::a_seeded_session_guesses_the_same)
| test(=walk::tests::a_tilted_walk_carries_and_hears_the_takes)
"""
threads-required = 3

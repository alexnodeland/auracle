[workspace]
resolver = "2"
members = [
    "crates/auracle-grammar",
    "crates/auracle-features",
    "crates/auracle-taste",
    "crates/auracle-session",
    "crates/auracle-wasm",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# fugue-ppl requires 1.87, so this is the floor the workspace already had;
# declaring it is what makes a new stable lint a deliberate bump rather than a
# surprise on every `-D warnings` job at once. Every crate inherits it.
rust-version = "1.87"
authors = ["Alex Nodeland"]
license = "MIT"
repository = "https://github.com/alexnodeland/auracle"

# Everything the user waits on is render-bound, so release builds trade
# compile time for codegen quality. `panic = "abort"` also drops unwinding
# tables from the wasm bundle. These flags cannot change float results — only
# --fast-math style options could, and none is enabled anywhere.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# What the test suite builds under — `make test` and CI both.
#
# The tests need release-grade codegen: they render real audio sample-by-sample
# and debug-mode DSP is ~20× slower. They do not need `release`'s *shipping*
# flags. `lto = "fat"` and `codegen-units = 1` are there to shave the render loop
# of the artifact users wait on; applied to five test binaries they instead
# funnel every link through one core, which was most of CI's compile step. Tests
# are also built and run on every `make check`, so this is the compile the
# contributor loop pays too.
#
# `opt-level` and `debug-assertions` are inherited from release on purpose:
# lowering the first makes the suite slower than fat LTO ever made it faster, and
# enabling the second changes which paths the tests exercise. `panic` is not
# inherited — cargo forces `unwind` for test harnesses regardless.
#
# `incremental` is for the edit-and-test loop on a workstation: after an edit
# to a function's body, rustc reuses what it compiled of the unchanged code
# instead of compiling the edited crate and every crate after it whole
# (docs/architecture/testing.md § The local loop has the times). It applies to
# the workspace's crates only; the dependencies are compiled once either way.
# CI sets CARGO_INCREMENTAL=0, which overrides it: there every build starts
# from a cache, and the incremental state would only make each cache bigger.
#
# `codegen-units = 256` is cargo's own number for an incremental build (the 16
# this had is the default for one that is not, written before the profile was
# incremental): incremental compilation reuses whole codegen units, so an edit
# dirties a 256th of a crate where it dirtied a 16th. Measured on a
# one-statement edit to a plain function, the rebuild took 9 to 13 CPU seconds
# against 31 to 41; the fast tier's tests took as long (1,069 and 1,105 CPU
# seconds against 1,078 and 1,083); a build from nothing took the same without
# incremental state (CI's) and 7 % more with it
# (docs/notes/rust-build-2026-10/). The dependencies below keep 16: they are
# compiled once, and the render loop runs in them.
[profile.test-fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[profile.test-fast.package."*"]
codegen-units = 16

[workspace.dependencies]
# In-house foundations, from crates.io.
# quiver-dsp: the LIBRARY name is `quiver` — imports are `use quiver::...`.
# 0.4.0 is the audit release plus audio in (`AudioInput`/`AudioInputStream`,
# `PitchTracker`, `Capture`). Every module/port name the compiler uses is
# unchanged from 0.3.3, but renders are not bit-identical: `KarplusStrong`
# (the Pluck source) was rebuilt, and a `DelayLine` fed by an acyclic path no
# longer lags its input by a sample, so φ moved and was revalidated.
# `set_param_by_id` now returns false for a cabled port (`Compiler::constant`).
# `auracle_features::QUIVER_DSP_VERSION` must move with this line — a test
# reads Cargo.lock and fails when it does not.
quiver-dsp = "0.4.0"
# default-features off: `checkpoint`/`parallel` don't compile on wasm32 and
# nothing here uses them; `ppl` is the layer we build on.
fugue-evo = { version = "0.3.1", default-features = false, features = ["std", "ppl"] }
# 0.2.2 adds `adaptive_mcmc_chain_thinned`, which is what stops a fit holding
# the whole chain in memory to keep 500 draws (see `auracle_taste::model`).
# 0.2.3 draws every index as a `u64`, so a seeded fit, walk and offer make the
# same draws in wasm32 as natively (`crates/auracle-wasm/tests/boot_agrees.rs`),
# and gives a `Uniform` site (every knob) a walk reflected in its bounds, where
# 0.2.2 walked a positive knob in log space: native fits are unchanged, native
# walks and offers are not.
fugue-ppl = "0.2.3"

# Shared third-party
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: observation logs are the profile's source of truth and must
# reload bit-identically (serde_json's fast float parse can be off by 1 ULP).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

# Intra-workspace
auracle-grammar = { path = "crates/auracle-grammar", version = "0.2.0" }
auracle-features = { path = "crates/auracle-features", version = "0.2.0" }
auracle-taste = { path = "crates/auracle-taste", version = "0.2.0" }
auracle-session = { path = "crates/auracle-session", version = "0.2.0" }

# Working on quiver / fugue / fugue-evo alongside auracle? Uncomment to use
# sibling checkouts instead of the registry (must stay at the end of this
# file — [patch.crates-io] is a top-level table):
# [patch.crates-io]
# quiver-dsp = { path = "../quiver" }
# fugue-evo = { path = "../fugue-ecosystem/fugue-evo" }
# fugue-ppl = { path = "../fugue-ecosystem/fugue" }

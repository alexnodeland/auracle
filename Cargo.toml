[workspace]
resolver = "2"
members = [
    "crates/ricercar-grammar",
    "crates/ricercar-features",
    "crates/ricercar-taste",
    "crates/ricercar-session",
    "crates/ricercar-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alex Nodeland"]
license = "MIT"
repository = "https://github.com/alexnodeland/ricercar"

[workspace.dependencies]
# In-house foundations (path deps during development).
# quiver-dsp: the LIBRARY name is `quiver` — imports are `use quiver::...`.
quiver-dsp = { path = "../quiver" }
# default-features off: `checkpoint`/`parallel` don't compile on wasm32 and
# nothing here uses them; `ppl` is the layer we build on.
fugue-evo = { path = "../fugue-ecosystem/fugue-evo", default-features = false, features = ["std", "ppl"] }
fugue-ppl = { path = "../fugue-ecosystem/fugue" }

# Shared third-party
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: observation logs are the profile's source of truth and must
# reload bit-identically (serde_json's fast float parse can be off by 1 ULP).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

# Intra-workspace
ricercar-grammar = { path = "crates/ricercar-grammar", version = "0.1.0" }
ricercar-features = { path = "crates/ricercar-features", version = "0.1.0" }
ricercar-taste = { path = "crates/ricercar-taste", version = "0.1.0" }
ricercar-session = { path = "crates/ricercar-session", version = "0.1.0" }

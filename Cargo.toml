[workspace]
resolver = "2"
members = [
    "crates/auracle-grammar",
    "crates/auracle-features",
    "crates/auracle-taste",
    "crates/auracle-session",
    "crates/auracle-wasm",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Alex Nodeland"]
license = "MIT"
repository = "https://github.com/alexnodeland/auracle"

# Everything the user waits on is render-bound, so release builds trade
# compile time for codegen quality. `panic = "abort"` also drops unwinding
# tables from the wasm bundle; tests keep the default dev/test profile and
# are unaffected. These flags cannot change float results — only --fast-math
# style options could, and none is enabled anywhere.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
# In-house foundations, from crates.io.
# quiver-dsp: the LIBRARY name is `quiver` — imports are `use quiver::...`.
# 0.2.0 is the perf release (coefficient memoization + interpreter R-series);
# renders are bit-identical to 0.1.1 by that release's golden-vector gate.
quiver-dsp = "0.2.0"
# default-features off: `checkpoint`/`parallel` don't compile on wasm32 and
# nothing here uses them; `ppl` is the layer we build on.
fugue-evo = { version = "0.3.1", default-features = false, features = ["std", "ppl"] }
fugue-ppl = "0.2.1"

# Shared third-party
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: observation logs are the profile's source of truth and must
# reload bit-identically (serde_json's fast float parse can be off by 1 ULP).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

# Intra-workspace
auracle-grammar = { path = "crates/auracle-grammar", version = "0.2.0" }
auracle-features = { path = "crates/auracle-features", version = "0.2.0" }
auracle-taste = { path = "crates/auracle-taste", version = "0.2.0" }
auracle-session = { path = "crates/auracle-session", version = "0.2.0" }

# Working on quiver / fugue / fugue-evo alongside auracle? Uncomment to use
# sibling checkouts instead of the registry (must stay at the end of this
# file — [patch.crates-io] is a top-level table):
# [patch.crates-io]
# quiver-dsp = { path = "../quiver" }
# fugue-evo = { path = "../fugue-ecosystem/fugue-evo" }
# fugue-ppl = { path = "../fugue-ecosystem/fugue" }
